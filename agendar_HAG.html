(function (raiz) {

  var TIPOS = {
    diagnostica: { rotulo: 'Consulta diagnóstica', paciente: 75, arrumacao: 15, arrumacaoSempre: false, sala: true },
    retorno:     { rotulo: 'Retorno presencial',   paciente: 60, arrumacao: 15, arrumacaoSempre: false, sala: true },

    online:      { rotulo: 'Consulta online',      paciente: 45, arrumacao: 0,  arrumacaoSempre: false, sala: false }
  };

  /* ---------- tempo em minutos, para nao errar com fuso nem com data ---------- */
  function paraMin(hhmm) {

    if (typeof hhmm === 'number') return hhmm;
    var m = String(hhmm).match(/^(\d{1,2}):(\d{2})/);

  function paraHora(min) {

    return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;

     por blocoDeSala(). Manter as duas coisas separadas evita o erro classico de
     somar arrumacao duas vezes. */
  function normalizaMarcados(marcados) {
    return (marcados || [])
      .map(function (a) {
        var ini = paraMin(a.inicio), fim = paraMin(a.fim);
        if (ini == null) return null;
        if (fim == null) {

          fim = ini + t.paciente;

      .filter(Boolean)
      .sort(function (x, y) { return x.inicio - y.inicio; });

    var ini = paraMin(horaPaciente);

    return {
      usaSala: true,
      inicio: paraHora(ini - arruma),
      fim: paraHora(ini + t.paciente),
      minutos: arruma + t.paciente,
      arrumacao: arruma
    };
  }

  /* ---------- o motor ----------
     regra: { inicio:'12:00', fim:'17:00', limite:5, local:'tatuape', modalidade:'presencial' }
     opcoes: { semente:3 }
     Devolve { horarios:[{hora, posicao, blocoSala}], motivo, dia:{...} }        */
  function horariosOfertados(regra, marcados, tipo, opcoes) {
    opcoes = opcoes || {};
    var semente = opcoes.semente == null ? 3 : opcoes.semente;
    var t = TIPOS[tipo];
    var vazio = { horarios: [], motivo: null, dia: null };

    if (!t) { vazio.motivo = 'tipo desconhecido: ' + tipo; return vazio; }
    if (!regra) { vazio.motivo = 'dia sem regra de atendimento'; return vazio; }

    var jIni = paraMin(regra.inicio), jFim = paraMin(regra.fim);
    if (jIni == null || jFim == null) { vazio.motivo = 'janela invalida'; return vazio; }

    var ocup = normalizaMarcados(marcados);
    var limite = regra.limite == null ? Infinity : regra.limite;

    var dia = {
      janela: { inicio: paraHora(jIni), fim: paraHora(jFim) },
      marcados: ocup.length,
      limite: limite === Infinity ? null : limite,
      blocoInicio: ocup.length ? paraHora(ocup[0].inicio) : null,
      blocoFim: ocup.length ? paraHora(ocup[ocup.length - 1].fim) : null
    };
    vazio.dia = dia;

    if (ocup.length >= limite) { vazio.motivo = 'limite de ' + limite + ' atendimentos atingido'; return vazio; }

    /* A REGRA DE ESPACAMENTO, que e mais sutil do que parece.
       Cada atendimento ocupa a sala de (horario do paciente menos arrumacao) ate
       (horario do paciente mais duracao). A sala do seguinte nao pode comecar
       antes de a do anterior terminar. Logo o intervalo entre dois pacientes e
       igual a arrumacao DO SEGUNDO, nao do primeiro.

       Para quase todos os tipos a arrumacao so existe no primeiro do dia, e ela
       fica antes da abertura, entao o intervalo entre pacientes e zero e eles
       encadeiam colados. O implante quebra isso: como exige 30 min SEMPRE, dois
       implantes seguidos precisam de 30 min entre o fim de um e a entrada do
       proximo paciente.

       A v1 errava aqui e o teste pegou: com o dia vazio ela ofertava implantes
       de hora em hora, 11:00 12:00 13:00, e as salas ficavam sobrepostas
       (10:30-12:00 e 11:30-13:00). Ninguem notaria ate o dia do procedimento. */
    var passo = t.paciente + (t.arrumacaoSempre ? t.arrumacao : 0);
    var folgaAntes = t.arrumacaoSempre ? t.arrumacao : 0;

    var cand = [];

    if (!ocup.length) {
      /* dia vazio: semente a partir do inicio da janela, no passo do tipo */
      for (var i = 0; i < semente; i++) {
        var h = jIni + i * passo;
        if (h + t.paciente > jFim) break;
        cand.push({ hora: paraHora(h), posicao: 'semente', primeiroDoDia: i === 0 });
      }
      if (!cand.length) vazio.motivo = 'janela curta demais para um ' + t.rotulo.toLowerCase();
    } else {
      var bIni = ocup[0].inicio, bFim = ocup[ocup.length - 1].fim;

      /* Encaixe ANTES do bloco. O novo atendimento passa a ser o primeiro do
         dia, e tem que terminar quando a SALA do atual primeiro abre. Se o
         atual primeiro for implante, a sala dele ja abre 30 min antes do
         paciente, entao o novo precisa terminar 30 min mais cedo. Se for de
         outro tipo, ele deixa de ser o primeiro do dia, perde a arrumacao, e o
         novo pode terminar colado. */
      var pri = TIPOS[ocup[0].tipo] || TIPOS.retorno;
      var recuoDoAtual = pri.arrumacaoSempre ? pri.arrumacao : 0;
      var antes = bIni - recuoDoAtual - t.paciente;
      /* Compara o HORARIO DO PACIENTE com o inicio da janela, nao a abertura da
         sala. 'inicio' da regra e o primeiro paciente; a sala abre antes dele de
         proposito, e a semente ja fazia assim. A v1 comparava a sala aqui e a
         janela ali, entao recusava encaixes validos so no caso do implante. */
      if (antes >= jIni) {
        /* EFEITO COLATERAL que precisa ser dito em voz alta. Ao entrar antes do
           bloco, este atendimento vira o primeiro do dia e o que era primeiro
           DEIXA DE SER. Na Livance isso muda o tipo do agendamento dele, que
           tem preco e duracao proprios, e libera 15 min de sala que estavam
           reservados para a arrumacao. Sem avisar, a Daniela lanca o novo e
           esquece de corrigir o antigo: a sala fica presa 15 min a mais e o
           premio de primeira do dia e cobrado duas vezes no mesmo dia. */
        var c = { hora: paraHora(antes), posicao: 'antes', primeiroDoDia: true };
        if (!pri.arrumacaoSempre && pri.arrumacao > 0) {
          c.efeitoColateral = {
            tipo: 'deixa_de_ser_primeiro_do_dia',
            atendimento: { inicio: paraHora(bIni), tipo: ocup[0].tipo },
            acao: 'trocar o tipo na Livance para a variante que não é primeira do dia',
            minutosLiberados: pri.arrumacao
          };
        }
        cand.push(c);
      }

      /* Encaixe DEPOIS do bloco: o paciente entra no fim do bloco mais a
         arrumacao do proprio tipo que esta entrando. */
      var depois = bFim + folgaAntes;
      if (depois + t.paciente <= jFim) {
        cand.push({ hora: paraHora(depois), posicao: 'depois', primeiroDoDia: false });
      }

      if (!cand.length) vazio.motivo = 'sem encaixe contíguo dentro da janela';
    }

    /* nunca ofertar horario que colida com algo ja marcado */
    cand = cand.filter(function (c) {
      var ci = paraMin(c.hora), cf = ci + t.paciente;
      return !ocup.some(function (o) { return ci < o.fim && cf > o.inicio; });
    });

    cand.forEach(function (c) {
      c.fim = paraHora(paraMin(c.hora) + t.paciente);
      c.blocoSala = blocoDeSala(tipo, c.hora, c.primeiroDoDia);
    });

    return { horarios: cand, motivo: cand.length ? null : (vazio.motivo || 'sem horário disponível'), dia: dia };
  }

    var teto = new Date(h); teto.setDate(teto.getDate() + tetoDias);

    if (ini > teto) return { inicio: null, fim: null, motivo: 'ainda fora das ' + tetoDias + ' semanas de antecedência', situacao: 'ainda_nao_abriu' };
    if (ini < h) ini = h;
    if (fim > teto) fim = teto;
    if (fim < ini) return { inicio: null, fim: null, motivo: 'janela clínica sem dia disponível', situacao: 'sem_dia' };

     A raia online da quarta so pode comecar depois que o Dr. Henrique sai de

  function janelaEfetiva(regra, ctx) {

    if (!regra) return null;
    var base = { inicio: regra.inicio, fim: regra.fim, ajustada: false, motivo: null };
    if (!regra.dependeDeLocal) return base;

    var desloc = regra.intervaloAposMin || 0;
    var jFimDep = paraMin(dep.janelaFim);
    var bFimDep = paraMin(dep.blocoFim);

        inicio: paraHora(Math.min(paraMin(regra.inicio), cedo) === cedo ? cedo : cedo),
        fim: regra.fim, ajustada: true,
        motivo: 'dia presencial fechado às ' + dep.blocoFim + ', liberado ' + desloc + ' min depois'
      };
    }
    if (dep.diaFechado && bFimDep == null) {
      return { inicio: regra.inicio, fim: regra.fim, ajustada: false,
               motivo: 'dia presencial fechado e vazio, mantida a janela padrão' };
    }
    /* dia presencial aberto: assume o pior caso, o presencial indo ate o fim.
       Usa >= de proposito: quando o horario gravado JA e o seguro, a janela nao
       muda, mas o motivo ainda precisa ser dito. Sem isso a tela mostraria
       18:30 sem explicar por que nao ha nada antes, e o Dr. Henrique nao teria
       como saber que basta fechar o dia presencial para liberar a tarde. */
    if (jFimDep != null) {
      var seguro = jFimDep + desloc;
      if (seguro >= paraMin(regra.inicio)) {
        return { inicio: paraHora(seguro), fim: regra.fim,
                 ajustada: seguro !== paraMin(regra.inicio),
                 motivo: 'dia presencial ainda aberto, reservado o deslocamento de '
                         + desloc + ' min a partir do fim da janela de ' + regra.dependeDeLocal };
      }
    }
    return base;

  /* ---------- ordem de oferta: centraliza nos dias preferidos ----------
     O Dr. Henrique quer concentrar em sabado e quarta. Regras de prioridade
     maior (segunda, sexta) so aparecem quando as de prioridade 1 nao tem
     encaixe. Sexta ainda depende de ser liberada sob demanda.               */
  function ordenarRegras(regras, opcoes) {
    opcoes = opcoes || {};
    return (regras || [])
      .filter(function (r) {
        if (r.ativo === false) return false;
        if (r.sobDemanda && !((opcoes.liberados || []).indexOf(r.local) >= 0)) return false;
        return true;
      })
      .slice()
      .sort(function (a, b) {
        return (a.prioridade || 1) - (b.prioridade || 1);
      });
  }

  var API = {
    versao: 'HAG_AGENDA_SLOTS_v1',
    janelaEfetiva: janelaEfetiva,

    diasElegiveis: diasElegiveis
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = API;

})(typeof self !== 'undefined' ? self : this);

  var f=new Intl.DateTimeFormat('sv-SE',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'});
  return f.format(new Date());
}
function dataBR(iso){var d=new Date(iso+'T12:00:00');
  return DIAS[d.getDay()]+', '+d.getDate()+' de '+MESES[d.getMonth()];}
function hhmm(t){return String(t||'').slice(0,5);}
function el(html){var t=document.getElementById('tela');t.innerHTML=html;return t;}
function esc(s){return String(s==null?'':s).replace(/[<>&"]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c];});}

function rpc(nome,args){
  return fetch(SURL+'/rest/v1/rpc/'+nome,{method:'POST',headers:H,body:JSON.stringify(args)})
    .then(function(r){return r.json();});
}
function rest(caminho){
  return fetch(SURL+'/rest/v1/'+caminho,{headers:H}).then(function(r){return r.json();});
}

var CTX=null, REGRAS=[], OCUP={}, TAB=null, JANELA=null, ALVO=null, ALVOMED=false;

function falha(msg){
  el('<div class="cartao"><div class="destaque">'+msg+'</div></div>');
}

function iniciar(){
  if(!PID){ falha('Este link de agendamento está incompleto. Peça um novo link para a equipe pelo WhatsApp.'); return; }
  rpc('hag_agendamento_contexto',{p_patient_id:PID}).then(function(c){
    if(!c||!c.ok){ falha('Não encontrei o seu cadastro por este link. Fale com a equipe pelo WhatsApp que resolvemos rapidinho.'); return; }
    CTX=c;
    if(c.agendamento){ telaJaAgendado(); return; }
    if(!c.retorno){ falha('Olá, '+esc(c.paciente.primeiro_nome)+'! Não encontrei nenhuma consulta aguardando agendamento para você. Se acha que deveria haver, fale com a equipe pelo WhatsApp.'); return; }
    /* HAG_ALVO_MEDICO_v1 (28/08/2026): a janela passa a girar em volta do dia
       que o Dr. Henrique mandou para a fila da Daniela, e nao mais da data
       teorica do plano. PORQUE: consulta antecipada por decisao clinica (o
       questionario mensal acusou necessidade de suporte) tinha a data teorica
       como centro, entao o dia escolhido pelo medico ficava FORA da lista e o
       paciente so via os dias em volta. Quando o alvo vem do medico a janela e
       simetrica, 7 dias para cada lado: a data ja e decisao, nao estimativa. */
    ALVO=c.retorno.data_alvo||c.retorno.data_planejada;
    ALVOMED=(c.retorno.alvo_origem==='medico'&&!!c.retorno.data_alvo);
    if(!ALVO){
      telaAjuda('Olá, '+esc(c.paciente.primeiro_nome)+'! Sua próxima consulta ("'+esc(c.retorno.nome)+'") ainda não tem data definida. Toque no botão abaixo e a Daniela organiza isso com você.');
      return;
    }
    JANELA=S.diasElegiveis(ALVO, hojeSP(), ALVOMED?{antes:7,depois:7}:null);
    if(!JANELA || JANELA.situacao==='ainda_nao_abriu'){
      falha('Olá, '+esc(c.paciente.primeiro_nome)+'! Sua próxima consulta ("'+esc(c.retorno.nome)+'") está prevista para perto de '+dataBR(ALVO)+'. O agendamento abre mais perto da data, e avisaremos você.');
      return;
    }
    if(JANELA.situacao==='atrasado'){
      telaAjuda('Olá, '+esc(c.paciente.primeiro_nome)+'! A janela ideal da sua consulta ("'+esc(c.retorno.nome)+'") já passou. Vamos encontrar juntos o melhor horário: toque no botão abaixo e a Daniela entra em contato.');
      return;
    }
    carregarAgenda();
  }).catch(function(){ falha('Não consegui carregar agora. Verifique a internet e tente de novo em instantes.'); });
}

function carregarAgenda(){
  Promise.all([
    rest('agenda_regras?ativo=eq.true&select=dia_semana,local,modalidade,hora_inicio,hora_fim,limite,prioridade&order=prioridade'),
    rest('v_agenda_ocupacao?data=gte.'+JANELA.inicio+'&data=lte.'+JANELA.fim+'&select=data,hora_inicio,hora_fim,tipo')
  ]).then(function(rs){
    REGRAS=rs[0]||[]; OCUP={};
    (rs[1]||[]).forEach(function(o){
      (OCUP[o.data]=OCUP[o.data]||[]).push({inicio:hhmm(o.hora_inicio),fim:hhmm(o.hora_fim),tipo:o.tipo||'retorno'});
    });
    /* HAG_MODALIDADE_CICLO_v1: a modalidade vem RESOLVIDA do servidor, ja
       aplicando a regra do plano (Reset alterna, Smart 90 e online, Transforma
       e presencial por padrao, Manutencao e livre) e a decisao da equipe gravada
       no retorno, que vence tudo. A tela so obedece. */
    var m=CTX.retorno.modalidade;
    TAB = (m==='online') ? 'online'
        : (m==='presencial') ? 'presencial'
        : (CTX.retorno.preferida==='presencial' ? 'presencial' : 'presencial');
    telaEscolha();
  }).catch(function(){ falha('Não consegui carregar a agenda agora. Tente de novo em instantes.'); });
}

function diasOfertados(modalidade){
  /* Do primeiro ao ultimo dia da janela clinica, casa cada data com a regra do
     dia da semana. A prioridade concentra: so desce para prioridade 2 ou 3
     quando os dias preferidos nao tem NENHUM horario na janela. A vespera e o
     proprio dia ficam de fora: a Daniela precisa de um dia util para garantir a
     sala na Livance. */
  var minData=(function(){var d=new Date(hojeSP()+'T12:00:00');d.setDate(d.getDate()+2);
    return d.toISOString().slice(0,10);})();
  var porPrio={};
  var d=new Date(JANELA.inicio+'T12:00:00'), fim=new Date(JANELA.fim+'T12:00:00');
  while(d<=fim){
    var iso=d.toISOString().slice(0,10);
    if(iso>=minData){
      var dow=d.getDay();
      for(var i=0;i<REGRAS.length;i++){
        var rg=REGRAS[i];
        if(rg.dia_semana!==dow || rg.modalidade!==modalidade) continue;
        var tipo = modalidade==='online' ? 'online' : 'retorno';
        var r=S.horariosOfertados(
          {inicio:hhmm(rg.hora_inicio),fim:hhmm(rg.hora_fim),limite:rg.limite},
          OCUP[iso]||[], tipo);
        if(r.horarios.length){
          (porPrio[rg.prioridade]=porPrio[rg.prioridade]||[]).push(
            {data:iso, local:rg.local, tipo:tipo, horarios:r.horarios.slice(0,3)});
        }
      }
    }
    d.setDate(d.getDate()+1);
  }
  var prios=Object.keys(porPrio).map(Number).sort(function(a,b){return a-b;});

  /* HAG_ALVO_MEDICO_v1: o dia indicado pelo medico sai de QUALQUER prioridade
     antes da concentracao e vai para a frente da lista, marcado.
     DUAS ARMADILHAS que isto resolve, as duas apagavam justamente o dia
     escolhido pelo medico:
     1) a concentracao so desce para a prioridade 2 quando a 1 tem menos de dois
        dias, entao um alvo numa segunda-feira sumia se houvesse duas quartas na
        janela;
     2) a lista e cronologica e o alvo fica no MEIO da janela, entao o teto de
        4 dias cortava o alvo quando havia 4 dias uteis antes dele. */
  var sug=null;
  if(ALVOMED){
    for(var pi=0; pi<prios.length && !sug; pi++){
      var bal=porPrio[prios[pi]];
      for(var k=0;k<bal.length;k++){ if(bal[k].data===ALVO){ sug=bal[k]; bal.splice(k,1); break; } }
    }
    prios=prios.filter(function(pp){ return porPrio[pp].length; });
  }
  if(!prios.length && !sug) return [];

  var lista=prios.length ? porPrio[prios[0]] : [];
  if(lista.length<2 && prios.length>1) lista=lista.concat(porPrio[prios[1]]);
  lista=lista.sort(function(a,b){return a.data<b.data?-1:1;}).slice(0, sug?3:4);
  if(sug){ sug.sugerido=true; lista.unshift(sug); }
  return lista;
}

function telaEscolha(nota){
  var c=CTX, hibrido=c.retorno.modalidade==='hibrido';
  /* Trava: quando o plano define a modalidade, nao existe aba para escolher.
     O paciente nao ve o que nao pode ter, e nao ha como furar a alternancia do
     Reset nem pedir presencial num plano que e so online. */
  var travada = !hibrido;
  var dias=diasOfertados(TAB);
  /* HAG_ALVO_MEDICO_v1: janela apertada pode nao ter nenhum dia util. Antes de
     dizer 'nao ha horarios', alarga uma vez para o padrao do plano. */
  var alargou=false;
  if(!dias.length && ALVOMED){
    var jOrig=JANELA, j2=S.diasElegiveis(ALVO, hojeSP());
    if(j2 && j2.situacao==='aberta'){
      JANELA=j2; dias=diasOfertados(TAB);
      if(dias.length) alargou=true; else JANELA=jOrig;
    }
  }
  var h='<div class="cartao"><div class="destaque">Olá, <b>'+esc(c.paciente.primeiro_nome)+'</b>! '
    +'Sua próxima consulta é <b>'+esc(c.retorno.nome)+'</b>, '
    +(ALVOMED ? 'e o Dr. Henrique indicou <b style="text-transform:capitalize">'+dataBR(ALVO)+'</b> como o melhor dia'
     : c.retorno.data_estimada ? 'prevista para <b>meados de '+dataBR(ALVO).split(', ')[1]+'</b>'
                              : 'prevista para perto de <b>'+dataBR(ALVO)+'</b>')
    +'. Escolha abaixo o melhor horário.</div></div>';
  if(nota) h+='<div class="aviso">'+nota+'</div>';
  if(alargou) h+='<div class="aviso">Não sobrou horário livre exatamente na semana do dia indicado, então abrimos os dias seguintes.</div>';
  if(travada){
    h+='<div class="aviso">'+(c.retorno.modalidade==='online'
        ? 'Esta consulta do seu plano é <b>online</b>.'
        : 'Esta consulta do seu plano é <b>presencial</b>, no consultório.')
      +'</div>';
  }
  if(hibrido){
    h+='<div class="abas">'
      +'<div class="aba'+(TAB==='presencial'?' on':'')+'" onclick="HAGpg.tab(\'presencial\')">Presencial</div>'
      +'<div class="aba'+(TAB==='online'?' on':'')+'" onclick="HAGpg.tab(\'online\')">Online</div></div>';
    if(c.retorno.preferida==='presencial'){
      h+='<div class="aviso">No seu plano o padrão é <b>presencial</b>. Se preferir online desta vez, é só escolher na aba ao lado.</div>';
    }
  }
  h+='<div class="cartao"><h2>'+(TAB==='online'?'Consulta online':'No consultório')+'</h2>';
  if(!dias.length){
    h+='<p style="font-size:14.5px;color:var(--ink3)">Não há horários '+(TAB==='online'?'online':'presenciais')+' disponíveis dentro do período ideal da sua consulta.</p>';
  } else {
    var abriuOutros=false;
    dias.forEach(function(dia,di){
      if(!dia.sugerido && !abriuOutros && dias[0] && dias[0].sugerido){
        abriuOutros=true; h+='<div class="sub-t">Outros dias por perto</div>';
      }
      h+='<div class="dia'+(dia.sugerido?' sug':'')+'"><div class="dia-t">'+dataBR(dia.data)
        +(dia.sugerido?'<span class="dia-tag">dia indicado</span>':'')
        +(TAB!=='online'?'<span class="dia-s">'+LOCAIS[dia.local]+'</span>':'')+'</div><div class="slots">';
      dia.horarios.forEach(function(s,si){
        h+='<button class="slot" onclick="HAGpg.escolher('+di+','+si+')">'+s.hora+'</button>';
      });
      h+='</div></div>';
    });
  }
  h+='</div><button class="btn claro" onclick="HAGpg.ajuda()">Nenhum destes horários funciona para mim</button>';
  el(h);
  window.HAGpg._dias=dias;
}

function telaConfirma(dia,slot){
  var c=CTX;
  el('<div class="cartao"><h2>Confirmar horário</h2>'
    +'<div class="conf-linha"><span>Consulta</span><b>'+esc(c.retorno.nome)+'</b></div>'
    +'<div class="conf-linha"><span>Dia</span><b style="text-transform:capitalize">'+dataBR(dia.data)+'</b></div>'
    +'<div class="conf-linha"><span>Horário</span><b>'+slot.hora+'</b></div>'
    +'<div class="conf-linha"><span>Onde</span><b>'+(TAB==='online'?'Online, o link chega pelo WhatsApp':LOCAIS[dia.local])+'</b></div>'
    +'</div>'
    +'<button class="btn" onclick="HAGpg.reservar()">Confirmar este horário</button>'
    +'<button class="btn claro" onclick="HAGpg.voltar()">Voltar aos horários</button>');
  window.HAGpg._sel={dia:dia,slot:slot};
}

function telaSucesso(ag){
  el('<div class="cartao" style="text-align:center"><div class="ok-selo">✓</div>'
    +'<h2 style="text-align:center">Horário reservado</h2>'
    +'<div class="conf-linha"><span>Dia</span><b style="text-transform:capitalize">'+dataBR(ag.data)+'</b></div>'
    +'<div class="conf-linha"><span>Horário</span><b>'+hhmm(ag.inicio)+'</b></div>'
    +'<div class="conf-linha"><span>Onde</span><b>'+(ag.tipo==='online'?'Online':LOCAIS[ag.local])+'</b></div>'
    +'<p style="font-size:14px;color:var(--ink3);margin:14px 0 0">Você vai receber a confirmação e os lembretes pelo WhatsApp. Para remarcar, é só chamar a equipe.</p></div>');
}

function telaJaAgendado(){
  var a=CTX.agendamento;
  el('<div class="cartao" style="text-align:center"><div class="ok-selo">✓</div>'
    +'<h2 style="text-align:center">Você já tem horário marcado</h2>'
    +'<div class="conf-linha"><span>Dia</span><b style="text-transform:capitalize">'+dataBR(a.data)+'</b></div>'
    +'<div class="conf-linha"><span>Horário</span><b>'+hhmm(a.inicio)+'</b></div>'
    +'<div class="conf-linha"><span>Onde</span><b>'+(a.modalidade==='online'?'Online':LOCAIS[a.local]||'')+'</b></div>'
    +'<p style="font-size:14px;color:var(--ink3);margin:14px 0 0">Para remarcar, fale com a equipe pelo WhatsApp.</p></div>');
}

function telaAjuda(txt){
  el('<div class="cartao"><div class="destaque">'+txt+'</div>'
    +'<p style="font-size:13.5px;color:var(--ink4);margin:12px 0 6px">Se quiser, conte qual período costuma ser melhor para você:</p>'
    +'<textarea id="obsAjuda" placeholder="Ex.: só consigo depois das 18h, ou aos sábados de manhã"></textarea></div>'
    +'<button class="btn" onclick="HAGpg.enviarAjuda()">Pedir ajuda para agendar</button>'
    +(JANELA&&JANELA.situacao==='aberta'?'<button class="btn claro" onclick="HAGpg.voltar()">Voltar aos horários</button>':''));
}

window.HAGpg={
  _dias:[], _sel:null,
  tab:function(m){TAB=m;telaEscolha();},
  escolher:function(di,si){var d=this._dias[di];telaConfirma(d,d.horarios[si]);},
  voltar:function(){telaEscolha();},
  ajuda:function(){telaAjuda('Sem problema. Deixe com a Daniela: ela encontra com você um horário que encaixe.');},
  reservar:function(){
    var s=this._sel; if(!s) return;
    el('<div class="spin">Reservando o seu horário…</div>');
    rpc('hag_reservar_horario',{
      p_patient_id:PID, p_data:s.dia.data, p_local:(TAB==='online'?'online':s.dia.local),
      p_tipo:s.dia.tipo, p_hora_inicio:s.slot.hora,
      p_retorno_id:CTX.retorno.id, p_origem:'paciente'
    }).then(function(r){
      if(r&&r.ok){ telaSucesso(r.agendamento); return; }
      if(r&&(r.erro==='horario_ocupado'||r.erro==='abriria_buraco'||r.erro==='limite_do_dia')){
        carregarAgendaENotificar('Esse horário acabou de ser preenchido. A lista foi atualizada, escolha outro.');
        return;
      }
      if(r&&r.erro==='ja_agendado'){ iniciar(); return; }
      falha((r&&r.mensagem)||'Não consegui concluir agora. Tente de novo em instantes.');
    }).catch(function(){ falha('Não consegui concluir agora. Verifique a internet e tente de novo.'); });
  },
  enviarAjuda:function(){
    var obs=(document.getElementById('obsAjuda')||{}).value||'';
    el('<div class="spin">Enviando…</div>');
    rpc('hag_pedir_ajuda_agendamento',{p_patient_id:PID,
      p_retorno_id:(CTX.retorno?CTX.retorno.id:null), p_obs:obs.slice(0,400)})
    .then(function(r){
      el('<div class="cartao" style="text-align:center"><div class="ok-selo">✓</div>'
        +'<h2 style="text-align:center">Recado enviado</h2>'
        +'<p style="font-size:14.5px;color:var(--ink3)">'+esc((r&&r.mensagem)||'A Daniela vai falar com você pelo WhatsApp para encontrar o melhor horário.')+'</p></div>');
    }).catch(function(){ falha('Não consegui enviar agora. Tente de novo em instantes.'); });
  }
};

function carregarAgendaENotificar(nota){
  rest('v_agenda_ocupacao?data=gte.'+JANELA.inicio+'&data=lte.'+JANELA.fim+'&select=data,hora_inicio,hora_fim,tipo')
  .then(function(oc){
    OCUP={};(oc||[]).forEach(function(o){(OCUP[o.data]=OCUP[o.data]||[]).push({inicio:hhmm(o.hora_inicio),fim:hhmm(o.hora_fim),tipo:o.tipo||'retorno'});});
    telaEscolha(nota);
  });
}

iniciar();
})();
</script>
