      +'</div></section>';
  } else {
    h+='<section class="card vaz"><div class="rot">Próxima consulta</div><p class="vazio" style="margin-top:6px">Nenhuma consulta marcada.</p>'
      +(agd?'<a class="btn" style="margin-top:14px" href="'+agd+'">Agendar</a>':'')+'</section>';
  }

  h+=evolucaoHTML(d);   /* HAG_CENTRAL_EVOLUCAO_v1 */

  /* dia a dia */
  var apps=[];
  if(L.cozinha) apps.push(['coz','Cozinha','Receitas do seu plano','cozinha_HAG.html?t='+encodeURIComponent(L.cozinha)+'&de=central']);
  if(L.treino)  apps.push(['tre','Treino','Programa e registros','treino_HAG.html?t='+encodeURIComponent(L.treino)+'&de=central']);
  if(L.cozinha) apps.push(['ori','Orientações','O que combinamos','orientacoes_HAG.html?t='+encodeURIComponent(L.cozinha)+'&de=central']);
  if(apps.length){
    h+='<h3 class="tit">No seu dia a dia</h3><div class="apps n'+apps.length+'">'+apps.map(function(a){
      return '<a class="app '+a[0]+'" href="'+a[3]+'"><span class="ic">'+IC[a[0]]+'</span><span class="n">'+a[1]+'</span><span class="s">'+a[2]+'</span></a>';
    }).join('')+'</div>';
  }

  /* documentos */
  var docs=d.documentos||[], g={plano_tratamento:[],plano_alimentar:[],receita:[],outros:[]};
  docs.forEach(function(x){ (g[x.categoria]||g.outros).push(x); });
  h+='<h3 class="tit">Seu plano</h3>';
  if(!docs.length){ h+='<div class="card"><p class="vazio">Os seus documentos aparecem aqui assim que o Dr. Henrique concluir o seu plano.</p></div>'; }
  else {
    var dest=[g.plano_tratamento[0],g.plano_alimentar[0]].filter(Boolean);
    if(dest.length){ h+='<div class="planos n'+dest.length+'">'+dest.map(function(x){
      return '<button class="plano" data-doc="'+esc(x.id)+'"><span class="ic">'+IC.doc+'</span><span class="t">'+esc(x.titulo)+'</span><span class="q">Atualizado em '+dataBR(x.data)+'</span><span class="a">Abrir</span></button>';
    }).join('')+'</div>'; }
    /* HAG_CENTRAL_RECEITAS_v1 (11/11/2026): o Dr. pediu que o paciente saiba o que tem em cada receita sem abrir uma por uma.
       Cada receita mostra os itens (lidos da prescrição) e o tipo; agrupadas por data; as datas mais antigas ficam recolhidas. */
    if(g.receita.length){
      var datas=[], porData={}; g.receita.forEach(function(x){ if(!porData[x.data]){ porData[x.data]=[]; datas.push(x.data); } porData[x.data].push(x); });
      var linhaRx=function(x){
        var it=x.itens||[], t=it.length? (it.length>3? it.slice(0,2).join(' · ')+' e mais '+(it.length-2) : it.join(' · ')) : 'Receita';
        var q=it.length? (x.tipo||'') : 'Abra para ver os itens';
        return '<li><button class="doc rx" data-doc="'+esc(x.id)+'"><span class="ic">'+IC.rx+'</span><span class="dt">'+(x.tipo&&it.length?'<span class="tp">'+esc(x.tipo)+'</span>':'')+'<span class="t">'+esc(t)+'</span>'+(!it.length?'<span class="q">'+esc(q)+'</span>':'')+'</span><span class="a">Abrir</span></button></li>';
      };
      var blocoRx=function(dt){ var l=porData[dt]; return '<div class="rxd">'+dataBR(dt)+' · '+l.length+(l.length>1?' receitas':' receita')+'</div><ul class="lista">'+l.map(linhaRx).join('')+'</ul>'; };
      var abertas=datas.slice(0,1), velhas=datas.slice(1);
      h+='<div class="card lst"><div class="grupo">Suas receitas</div>'+abertas.map(blocoRx).join('');
      if(velhas.length){ var nv=0; velhas.forEach(function(dt){ nv+=porData[dt].length; });
        h+='<details class="rxant"><summary>Ainda válidas, de consultas anteriores · '+nv+'</summary>'+velhas.map(blocoRx).join('')+'</details>'; }
      h+='</div>';
    }
    var resto=[];
    /* HAG_CENTRAL_SO_VIGENTE_v1 (12/11/2026, decisão do Dr.): o paciente vê só o plano de tratamento e o plano alimentar atuais; os anteriores ficam com a clínica */
    g.outros.forEach(function(x){ resto.push([x,x.titulo,IC.doc]); });
    if(resto.length){ h+='<div class="card lst"><div class="grupo">Outros documentos</div><ul class="lista">'+resto.map(function(r){
      return '<li><button class="doc" data-doc="'+esc(r[0].id)+'"><span class="ic">'+r[2]+'</span><span class="dt"><span class="t">'+esc(r[1])+'</span><span class="q">'+dataBR(r[0].data)+'</span></span><span class="a">Abrir</span></button></li>';
    }).join('')+'</ul></div>'; }
  }
  h+='<div class="msg" id="mDoc"></div>';

  /* equipe */
  h+='<a class="equipe" href="'+WPP+'" target="_blank" rel="noopener"><span class="ic">'+IC.chat+'</span><span class="dt"><span class="t">Falar com a equipe</span><span class="q">WhatsApp do consultório</span></span><span class="sv">'+IC.seta+'</span></a>';

  if(!VER) h+='<div style="text-align:center;margin-top:26px"><button class="link" id="bSair">Sair deste aparelho</button></div>';
  tela.innerHTML=h;

  tela.querySelectorAll('[data-doc]').forEach(function(b){ b.onclick=function(){ abrirDoc(b.getAttribute('data-doc'), b); }; });
  var bck=$('#bCk'); if(bck) bck.onclick=function(){ telaCheckin(d); };
  /* HAG_CENTRAL_VER_EQUIPE_v2: na visualização da equipe os atalhos levam aos links DO PACIENTE.
     Agendar ali marcaria consulta em nome dele; Treino gravaria registro como se fosse ele. Ficam desligados. */
  if(VER){ tela.querySelectorAll('a[href^="agendar_HAG"],a.app').forEach(function(a){
    a.removeAttribute('href'); a.style.opacity='.55'; a.style.cursor='default';
    a.onclick=function(){ $('#mDoc').textContent='Na visualização da equipe os atalhos ficam desligados: abririam a agenda e os apps em nome do paciente.'; $('#mDoc').scrollIntoView({block:'center'}); };
  }); }
  var bj=$('#bJa'); if(bj) bj.onclick=function(){ ls.set('hagcentral.salvou','1'); $('#avInst').remove(); try{ history.replaceState(null,'',enderecoCom('')); }catch(e){} poeManifesto(''); };
  if($('#bSair')) $('#bSair').onclick=function(){ api({acao:'sair',sessao:SESSAO}).then(function(){ ls.del('hagcentral.s'); SESSAO=''; inicio(); }); };
}

/* HAG_CENTRAL_CHECKIN_v1 (11/11/2026). Fase 1 do Check-in Sob Medida: as perguntas de hoje, curtas, em toques.
   A pergunta aberta alterna por semana (ajudou / atrapalhou). Fase 2 troca estas perguntas pelas do plano de cada um. */
var CK_ESC=[['s_dieta','Alimentação','Seguiu o plano?',['Nada','Pouco','Metade','Quase','Bem','Tudo']],
  ['s_treino','Treino','Cumpriu a meta?',['Nada','Pouco','Metade','Quase','Bem','Tudo']],
  ['s_sono','Sono','Acordou descansado?',['Péssimo','Ruim','Regular','Ok','Bom','Ótimo']],
  ['s_fome','Fome','Controle do apetite e do doce',['Sem controle','Difícil','Regular','Ok','Bom','Ótimo']],
  ['s_energia','Energia','Disposição no dia a dia',['Esgotado','Baixa','Regular','Ok','Boa','Ótima']],
  ['s_med','Medicação e suplementos','Tomou conforme o plano?',['Nada','Pouco','Metade','Quase','Bem','Tudo']]];
function escQ(e){ return '<div class="card ckq" data-k="'+e[0]+'"><div class="ckt"><b>'+e[1]+'</b><span>'+e[2]+'</span></div><div class="ckops">'
      +e[3].map(function(l,i){ return '<button data-v="'+i+'"><b>'+i+'</b><span>'+l+'</span></button>'; }).join('')
      +(e[4]?'<button data-v="na" class="na"><span>'+e[4]+'</span></button>':'')+'</div></div>'; }
/* HAG_CHECKIN_SOB_MEDIDA_v1: com plano, as perguntas saem dele (metas, dieta, exercícios, cada medicação e os efeitos dela) */
function telaCheckin(d){
  var CK=d.checkin||{}, P=CK.plano, R={metas:{},exercicios:{},meds:{}}, ab=CK.semana_par?['acerto','O que mais te ajudou esta semana?']:['obstaculo','O que mais atrapalhou esta semana?'];
  var CINCO=['Nada','Pouco','Metade','Quase','Bem','Tudo'];
  var BAL=!!d._balanco;
  var h='<button class="link" id="ckV">‹ Voltar</button><p class="rot" style="margin-top:10px">'+(BAL?'Balanço antes da consulta':'Check-in da semana')+'</p><h1>'+(BAL?'Como foi a <em>fase</em>?':'Como foi a <em>semana</em>?')+'</h1>'
    +'<p class="sub">'+(P?'Perguntas do seu plano'+(P.data&&!P.teste?' de '+dataBR(P.data):'')+'. ':'')+(BAL?'Leva 2 minutos.':'Leva 1 minuto.')+'</p>'
    +(VER?'<div class="aviso" style="margin-top:12px">Pré-visualização da equipe: é isto que o paciente responde. Nada é enviado.</div>':'');
  if(P){
    h+=escQ(['s_dieta','Alimentação',P.dieta?esc(P.dieta):'Seguiu o plano?',CINCO]);
    (P.metas||[]).forEach(function(m){ h+='<div class="card ckq" data-meta="'+m.id+'"><div class="ckt"><b>Meta da fase</b><span>'+esc(m.texto)+'</span></div><div class="ckops">'
      +['Nada','Pouco','Metade','Quase','Bem','Bati'].map(function(l,i){ return '<button data-v="'+i+'"><b>'+i+'</b><span>'+l+'</span></button>'; }).join('')+'</div></div>'; });
    (P.exercicios||[]).forEach(function(e){ var mx=Math.max(7,(e.meta||0)); var o='';
      for(var i=0;i<=mx;i++) o+='<button data-v="'+i+'"><b>'+i+'</b><span>'+(e.meta&&i===e.meta?'meta':(i===0?'vezes':''))+'</span></button>';
      h+='<div class="card ckq" data-ex="'+e.id+'"><div class="ckt"><b>'+esc(e.nome)+'</b><span>Quantas vezes nesta semana'+(e.meta?' (meta '+e.meta+')':(e.momento?' ('+esc(e.momento)+')':''))+'</span></div><div class="ckops nums">'+o+'</div></div>'; });
  } else {
    h+=escQ(['s_dieta','Alimentação','Seguiu o plano?',CINCO])+escQ(['s_treino','Treino','Cumpriu a meta?',CINCO]);
  }
  h+=escQ(['s_sono','Sono','Acordou descansado?',['Péssimo','Ruim','Regular','Ok','Bom','Ótimo']])
    +escQ(['s_fome','Fome','Controle do apetite e do doce',['Sem controle','Difícil','Regular','Ok','Bom','Ótimo']])
    +escQ(['s_energia','Energia','Disposição no dia a dia',['Esgotado','Baixa','Regular','Ok','Boa','Ótima']]);
  var temMed=false, EFS=[];
  if(P&&(P.meds||[]).length){ temMed=true;
    /* uma lista só de efeitos, juntando as medicações (check-in curto); o servidor sabe de qual remédio é cada um */
    P.meds.forEach(function(m){ (m.efeitos?m.efeitos.ops:[]).forEach(function(o){ if(EFS.indexOf(o)<0) EFS.push(o); }); });
    h+='<div class="card ckmeds"><div class="ckt"><b>Suas medicações</b><span>Como foi o uso nesta semana?</span></div>'
      +P.meds.map(function(m){ return '<div class="ckmed" data-med="'+m.id+'"><div class="mn"><b>'+esc(m.nome)+'</b>'+(m.dose?'<span>'+esc(m.dose)+'</span>':'')+'</div>'
        +'<div class="ckops uso">'+[['sim','Tomei certo'],['esqueci','Esqueci alguma vez'],['parei','Parei']].map(function(u){ return '<button data-uso="'+u[0]+'"><span>'+u[1]+'</span></button>'; }).join('')+'</div></div>'; }).join('')
      +(EFS.length?'<span class="ckl" style="margin:16px 0 8px">Sentiu algo destes?</span><div class="chips">'+EFS.map(function(o){ return '<button data-ef="'+esc(o)+'">'+esc(o)+'</button>'; }).join('')+'<button data-ef="" class="nenhum">Nenhum</button></div>':'')
      +'</div>';
  } else if(!P){ temMed=true; h+=escQ(['s_med','Medicação e suplementos','Tomou conforme o plano?',CINCO,'Não uso']); }
  h+='<div class="card"><label class="ckl">'+(P&&(P.meds||[]).some(function(m){return m.efeitos;})?'Algo mais diferente no corpo ou no intestino?':'Efeitos, sintomas novos ou intestino diferente?')+' <span>(se tiver)</span></label><textarea id="ck_colateral" rows="2"></textarea>'
    +'<label class="ckl">'+ab[1]+' <span>(uma frase)</span></label><textarea id="ck_aberta" rows="2"></textarea>'
    +'<label class="ckl">Peso ou como as roupas estão <span>(opcional)</span></label><input id="ck_peso" type="text" inputmode="decimal">'
    +(temMed?'<label class="ckl">Medicação e suplementos dão para 7 dias?</label><div class="ckops est">'
      +[['Sim, estoque suficiente','Sim'],['Preciso renovar em breve','Renovar em breve'],['Estou sem, preciso com urgência','Estou sem']].map(function(o){ return '<button data-est="'+o[0]+'"><span>'+o[1]+'</span></button>'; }).join('')+'</div>':'')
    +'<label class="ckl">'+(BAL?'O que você quer levar para a consulta?':'Algo para o Dr. Henrique?')+' <span>(opcional)</span></label><textarea id="ck_msg" rows="'+(BAL?3:2)+'"></textarea></div>'
    +'<div class="msg" id="ckM"></div><button class="btn" id="ckEnviar" style="margin-top:14px"'+(VER?' disabled':'')+'>'+(VER?'Pré-visualização':'Enviar check-in')+'</button>';
  tela.innerHTML=h; window.scrollTo(0,0);
  $('#ckV').onclick=function(){ painel(d); };
  function marca(q,b){ q.querySelectorAll(':scope > .ckops > button, :scope > .ckops.uso > button').forEach(function(x){ x.classList.remove('on'); }); b.classList.add('on'); q.classList.add('feita'); }
  tela.querySelectorAll('.ckq').forEach(function(q){ q.querySelectorAll('.ckops button').forEach(function(b){ b.onclick=function(){
    q.querySelectorAll('.ckops button').forEach(function(x){ x.classList.remove('on'); }); b.classList.add('on'); q.classList.add('feita');
    var v=b.getAttribute('data-v');
    if(q.dataset.k){ if(v==='na') delete R[q.dataset.k]; else R[q.dataset.k]=+v; }
    if(q.dataset.meta) R.metas[q.dataset.meta]=+v;
    if(q.dataset.ex) R.exercicios[q.dataset.ex]=+v; }; }); });
  tela.querySelectorAll('.ckmed').forEach(function(q){ var id=q.dataset.med;
    q.querySelectorAll('[data-uso]').forEach(function(b){ b.onclick=function(){ q.querySelectorAll('[data-uso]').forEach(function(x){ x.classList.remove('on'); }); b.classList.add('on'); q.classList.add('feita'); R.meds[id]=b.dataset.uso; }; }); });
  tela.querySelectorAll('[data-ef]').forEach(function(b){ b.onclick=function(){
    if(!b.dataset.ef){ tela.querySelectorAll('[data-ef]').forEach(function(x){ x.classList.remove('on'); }); b.classList.add('on'); R.efeitos_todos=[]; return; }
    var nn=tela.querySelector('[data-ef].nenhum'); if(nn) nn.classList.remove('on'); b.classList.toggle('on');
    R.efeitos_todos=[].slice.call(tela.querySelectorAll('[data-ef].on')).map(function(x){ return x.dataset.ef; }).filter(Boolean); }; });
  var EST=null; tela.querySelectorAll('[data-est]').forEach(function(b){ b.onclick=function(){ tela.querySelectorAll('[data-est]').forEach(function(x){ x.classList.remove('on'); }); b.classList.add('on'); EST=b.getAttribute('data-est'); }; });
  $('#ckEnviar').onclick=function(){
    if(VER) return;
    var base=['s_dieta','s_sono','s_fome','s_energia'].filter(function(k){ return R[k]!=null; }).length + ((P&&(P.exercicios||[]).length)? (Object.keys(R.exercicios).length?1:0) : (R.s_treino!=null?1:0));
    if(base<3){ $('#ckM').textContent='Responda pelo menos alimentação, sono e energia.'; return; }
    var b=this; b.disabled=true; b.textContent='Enviando…';
    var r=Object.assign({},R,{colateral:$('#ck_colateral').value,peso:$('#ck_peso').value,estoque:EST,mensagem:$('#ck_msg').value});
    r[ab[0]]=$('#ck_aberta').value;
    api({acao:'checkin',token:TOKEN,sessao:SESSAO,respostas:r}).then(function(x){
      if(x.fechado) return fechado(x.motivo);
      if(!x.ok){ b.disabled=false; b.textContent='Enviar check-in';
        if(x.erro==='sessao'){ ls.del('hagcentral.s'); return inicio(); }
        $('#ckM').textContent= x.erro==='ja_enviado'?'O check-in desta semana já chegou. Obrigado.':x.erro==='incompleto'?'Responda pelo menos três linhas.':'Não foi possível enviar agora. Tente de novo.'; return; }
      d.checkin=x.checkin; telaCheckinFeito(d, x.score, x.emergencia);
    });
  };
}
function telaCheckinFeito(d, score, emerg){
  var CK=d.checkin||{}, hs=(CK.historico||[]);
  var barras=hs.map(function(c){ var p=Math.max(6,Math.min(100,+c.score||0)); return '<div class="b"><i style="height:'+p+'%"></i><span>'+dataBR(c.data).slice(0,5)+'</span></div>'; }).join('');
  tela.innerHTML='<p class="rot">Check-in recebido</p><h1>Obrigado.</h1><p class="sub">O Dr. Henrique vê as suas respostas antes da próxima consulta.</p>'
    +(emerg?'<div class="aviso" style="margin-top:14px;border-left-color:#8a2e2e"><b>Se for intenso ou piorar, procure um pronto-atendimento.</b></div>':'')
    +(CK.cadencia==='quinzenal'?'<p class="sub" style="font-size:14px;margin-top:8px">Sua fase está estável: o próximo check-in vem em duas semanas.</p>':'')
    +'<div class="card"><div class="ckres"><div><b>'+(CK.sequencia||1)+'</b><span>'+((CK.sequencia||1)>1?'semanas seguidas':'semana')+'</span></div>'
    +(hs.length>1?'<div class="graf">'+barras+'</div>':'')+'</div></div>'
    +'<button class="btn claro" id="ckOk" style="margin-top:14px">Voltar ao início</button>';
  window.scrollTo(0,0); $('#ckOk').onclick=function(){ painel(d); };
}

function abrirDoc(id, b){
  var w=null; try{ w=window.open('', '_blank'); }catch(e){}
  var a=b.querySelector('.a'); a.textContent='Abrindo…';
  api(VER?{acao:'ver_doc',patient_id:VER,doc_id:id}:{acao:'doc',token:TOKEN,sessao:SESSAO,doc_id:id}).then(function(r){
    a.textContent='Abrir';
    if(r.fechado){ if(w) w.close(); return fechado(r.motivo); }
    if(!r.ok){ if(w) w.close(); if(r.erro==='sessao'){ ls.del('hagcentral.s'); return inicio(); } $('#mDoc').textContent='Não foi possível abrir este documento agora.'; return; }
    if(w){ w.location.href=r.url; } else { location.href=r.url; }
  });
}

function inicio(){
  if(VER){
    return sessaoEquipe().then(function(tk){
      if(!tk){ tela.innerHTML='<h1>Entre para continuar.</h1><p class="sub">A visualização da equipe usa o mesmo login do painel.</p>';
        if(window.HAGAuth){ window.HAG_EXIGIR_LOGIN=true; window.HAGAuth.mount(function(){ inicio(); }); } return; }
      return api({acao:'ver',patient_id:VER});
    }).then(function(r){
      if(!r) return;
      if(!r.ok && r.erro==='equipe' && window.HAGAuth && !inicio._tentou){ inicio._tentou=1; return Promise.resolve(window.HAGAuth.refresh()).then(function(){ return inicio(); }); }
      if(!r.ok){ tela.innerHTML='<h1>Não foi possível abrir.</h1><p class="sub">'+(r.erro==='equipe'?'Seu login expirou. Abra o painel e entre de novo.':'Paciente não encontrado.')+'</p>'; return; }
      painel(r.dados);
      if(!r.aberto){ tela.insertAdjacentHTML('afterbegin','<div class="aviso" style="margin:0 0 14px"><b>Para o paciente, a central está fechada</b> (sem ciclo ativo).</div>'); }
    });
  }
  if(!TOKEN){ return fechado('link'); }
  // ícone recém-salvo: abre com a passagem e entra sem código
  if(PONTE && !SESSAO){
    var ap=(navigator.userAgent.match(/iPhone|iPad|Android|Mac|Windows/)||['aparelho'])[0];
    var k=PONTE; PONTE='';
    return api({acao:'usar_ponte',token:TOKEN,ponte:k,aparelho:ap}).then(function(r){
      if(r.fechado) return fechado(r.motivo);
      if(r.ok&&r.sessao){ SESSAO=r.sessao; ls.set('hagcentral.s',SESSAO); ls.set('hagcentral.t',TOKEN); if(STANDALONE) ls.set('hagcentral.salvou','1'); try{ history.replaceState(null,'',enderecoCom('')); }catch(e){} return painel(r.dados); }
      inicio();
    });
  }
  api({acao:'estado',token:TOKEN,sessao:SESSAO}).then(function(r){
    if(r.fechado) return fechado(r.motivo);
    if(!r.ok){ tela.innerHTML='<h1>Sem conexão.</h1><p class="sub">'+esc(ERROS[r.erro]||ERROS.interno)+'</p><div class="card"><button class="btn" onclick="location.reload()">Tentar de novo</button></div>'; return; }
    if(r.entrou){
      painel(r.dados);
      // no Safari do iPhone, já dentro: renova a passagem para o ícone que ainda vai ser salvo
      if(querPonte()) api({acao:'ponte_nova',token:TOKEN,sessao:SESSAO}).then(function(x){ if(x&&x.ok&&x.ponte) aplicaPonte(x.ponte); });
      return;
    }
    if(SESSAO){ ls.del('hagcentral.s'); SESSAO=''; }
    telaEntrar(r);
  });
}
window.HAG_CENTRAL={versao:'HAG_CENTRAL_PACIENTE_v1+PONTE_v1+INICIO_v2+CHECKIN_v1+SOB_MEDIDA_v1'};
inicio();
})();
</script>
