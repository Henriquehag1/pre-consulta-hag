<script>

}

  var b=$('#bPedir'); if(b){b.disabled=true;b.textContent='Enviando…';}

    telaCodigo(r.email);

function telaCodigo(email){
  tela.innerHTML='<p class="rot">Primeiro acesso neste aparelho</p><h1>Digite o <em>código</em>.</h1>'

function confirmar(){
  var i=$('#cod'), b=$('#bOk'); if(!i||i.value.length!==6){ $('#m').textContent='São 6 números.'; return; }

    if(r.fechado) return fechado(r.motivo);
    if(!r.ok){ b.disabled=false; b.textContent='Entrar'; $('#m').textContent=(ERROS[r.erro]||ERROS.interno)+(r.restam!=null&&r.erro==='codigo'?' Restam '+r.restam+' tentativas.':''); i.select(); return; }

function inicio(){
  if(VER){
    if(!jwtEquipe()){ tela.innerHTML='<h1>Entre no painel primeiro.</h1><p class="sub">A visualização da equipe usa o login do painel da central, neste mesmo navegador.</p>'; return; }
    return api({acao:'ver',patient_id:VER}).then(function(r){
      if(!r.ok){ tela.innerHTML='<h1>Não foi possível abrir.</h1><p class="sub">'+(r.erro==='equipe'?'Seu login expirou. Abra o painel e entre de novo.':'Paciente não encontrado.')+'</p>'; return; }
      painel(r.dados);
      if(!r.aberto){ tela.insertAdjacentHTML('afterbegin','<div class="aviso" style="margin:0 0 14px"><b>Para o paciente, a central está fechada</b> (sem ciclo ativo).</div>'); }
    });
  }
  if(!TOKEN){ return fechado('link'); }
  // ícone recém-salvo: abre com a passagem e entra sem código
  if(PONTE && !SESSAO){
    var ap=(navigator.userAgent.match(/iPhone|iPad|Android|Mac|Windows/)||['aparelho'])[0];
    var k=PONTE; PONTE='';
    return api({acao:'usar_ponte',token:TOKEN,ponte:k,aparelho:ap}).then(function(r){
      if(r.fechado) return fechado(r.motivo);
      if(r.ok&&r.sessao){ SESSAO=r.sessao; ls.set('hagcentral.s',SESSAO); ls.set('hagcentral.t',TOKEN); if(STANDALONE) ls.set('hagcentral.salvou','1'); try{ history.replaceState(null,'',enderecoCom('')); }catch(e){} return painel(r.dados); }
      inicio();
    });
  }
  api({acao:'estado',token:TOKEN,sessao:SESSAO}).then(function(r){
    if(r.fechado) return fechado(r.motivo);
    if(!r.ok){ tela.innerHTML='<h1>Sem conexão.</h1><p class="sub">'+esc(ERROS[r.erro]||ERROS.interno)+'</p><div class="card"><button class="btn" onclick="location.reload()">Tentar de novo</button></div>'; return; }
    if(r.entrou){
      painel(r.dados);
      // no Safari do iPhone, já dentro: renova a passagem para o ícone que ainda vai ser salvo
      if(querPonte()) api({acao:'ponte_nova',token:TOKEN,sessao:SESSAO}).then(function(x){ if(x&&x.ok&&x.ponte) aplicaPonte(x.ponte); });
      return;
    }
    if(SESSAO){ ls.del('hagcentral.s'); SESSAO=''; }
    telaEntrar(r);
  });
}
window.HAG_CENTRAL={versao:'HAG_CENTRAL_PACIENTE_v1+PONTE_v1'};
inicio();
})();
</script>
</body>
</html>
