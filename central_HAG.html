<style>
:root{--linho:#F4EEE5;--papel:#FCFAF6;--fio:#E3D8C8;--tinta:#221A16;--suave:#5C4F44;--apoio:#8F8274;--conhaque:#8C4F2B;--camurca:#B98A5E;--choc:#33251E;--floresta:#2E3A2D;
  --d:'Bodoni Moda',Georgia,serif;--t:'Hanken Grotesk',-apple-system,Helvetica,Arial,sans-serif;--r:Jost,'Helvetica Neue',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--linho);color:var(--tinta)}
body{font-family:var(--t);font-weight:300;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 28px)}
.wrap{max-width:560px;margin:0 auto;padding:0 20px}
header{padding:26px 0 18px;display:flex;align-items:center;justify-content:space-between}
.marca{display:flex;align-items:center;gap:10px;font-family:var(--d);font-size:17px;color:var(--tinta)}
.marca svg{height:26px;width:auto}
.rot{font-family:var(--r);font-weight:500;font-size:11.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--conhaque)}
h1{font-family:var(--d);font-weight:400;font-size:38px;line-height:1.08;margin:10px 0 8px}
h1 em{font-style:italic;color:var(--conhaque)}
h2{font-family:var(--d);font-weight:400;font-size:24px;line-height:1.15;margin:0 0 4px}
.sub{color:var(--suave);font-size:16px}
.card{background:var(--papel);border:1px solid var(--fio);border-radius:4px;padding:20px 20px;margin-top:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:3px;background:var(--choc);color:var(--linho);font-family:var(--r);font-weight:500;font-size:13.5px;letter-spacing:.2em;text-transform:uppercase;padding:17px 18px;text-decoration:none;cursor:pointer}
.btn:disabled{opacity:.5}
.btn.claro{background:transparent;color:var(--choc);border:1px solid var(--choc)}
.btn+.btn{margin-top:10px}
.link{background:none;border:0;color:var(--conhaque);font-family:var(--t);font-size:15px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px 0}
.cod{width:100%;font-family:var(--d);font-size:36px;letter-spacing:.35em;text-align:center;padding:14px 8px;border:1px solid var(--fio);background:#fff;border-radius:3px;color:var(--tinta)}
.msg{min-height:22px;margin-top:10px;font-size:14.5px;color:#8a2e2e}
.ok{color:var(--floresta)}
.prox{display:flex;gap:16px;align-items:center}
.dia{min-width:70px;text-align:center;border-right:1px solid var(--fio);padding-right:16px}
.dia b{display:block;font-family:var(--d);font-weight:400;font-size:40px;line-height:1}
.dia span{font-family:var(--r);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--apoio)}
.lista{list-style:none}
.lista li{border-top:1px solid var(--fio)}
.lista li:first-child{border-top:0}
.doc{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:none;border:0;padding:15px 0;text-align:left;cursor:pointer;font-family:var(--t);color:var(--tinta)}
.doc .t{font-size:16.5px;font-weight:400}
.doc .q{font-size:13.5px;color:var(--apoio)}
.doc .a{font-family:var(--r);font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--conhaque);white-space:nowrap}
.grupo{font-family:var(--r);font-weight:500;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--apoio);margin:18px 0 2px}
.grupo:first-child{margin-top:4px}
.apps{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.app{display:block;text-decoration:none;color:var(--linho);border-radius:4px;padding:18px 16px 16px;min-height:104px;position:relative}
.app .n{font-family:var(--d);font-size:22px;line-height:1.1}
.app .s{font-size:13px;opacity:.85;margin-top:4px}
.vazio{color:var(--apoio);font-size:15px;padding:6px 0}
.rodape{margin-top:34px;padding-top:18px;border-top:1px solid var(--fio);font-size:13px;color:var(--apoio);line-height:1.6}
.rodape .rot{color:var(--apoio);font-size:10.5px}
/* HAG_CENTRAL_INSTALAR_v1 */
.inst{display:flex;flex-wrap:wrap;gap:12px 14px;align-items:center;background:var(--papel);border:1px solid var(--fio);border-radius:6px;padding:16px;margin-top:16px}
.inst-ic img{width:52px;height:52px;border-radius:12px;display:block;box-shadow:0 2px 8px rgba(34,26,22,.12)}
.inst-tx{flex:1;min-width:180px;display:flex;flex-direction:column;gap:3px;font-size:14px;color:var(--suave)}
.inst-tx b{font-family:var(--d);font-weight:400;font-size:19px;color:var(--tinta);line-height:1.2}
.inst [hidden]{display:none!important}
.inst-bt{width:100%}.inst-bt .btn{padding:14px 16px}.inst-bt .btn+.btn{margin-top:8px}
.inst-lk{display:flex;justify-content:center;gap:22px;margin-top:10px}
.instov{position:fixed;inset:0;z-index:50;background:rgba(34,26,22,.55);display:flex;align-items:center;justify-content:center;padding:24px}
.instov[hidden]{display:none}
.instov-c{background:var(--linho);border-radius:10px;padding:24px 22px 18px;max-width:380px;width:100%;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.instov-c h2{font-family:var(--d);font-weight:400;font-size:24px;line-height:1.2;margin:10px 0 8px}
.instov-c .sub{margin-bottom:16px}
.instov-ic{width:58px;height:58px;border-radius:14px;background:var(--papel);border:1px solid var(--fio);display:flex;align-items:center;justify-content:center;margin-top:6px}
.instov-ic svg{width:30px;height:30px;fill:none;stroke:var(--conhaque);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.instov-seta{position:fixed;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;color:#fff;font-family:var(--r);font-size:12px;letter-spacing:.2em;text-transform:uppercase;animation:instpula 1.1s ease-in-out infinite}
.instov-seta svg{width:44px;height:44px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.instov-seta.baixo{bottom:calc(10px + env(safe-area-inset-bottom))}
.instov-seta.cima{top:calc(8px + env(safe-area-inset-top));flex-direction:column-reverse}
.instov-seta.cima svg{transform:rotate(180deg)}
@keyframes instpula{0%,100%{margin-bottom:0;margin-top:0}50%{margin-bottom:-8px;margin-top:-8px}}
.aviso{background:#fff;border:1px solid var(--fio);border-left:3px solid var(--camurca);padding:14px 16px;margin-top:16px;font-size:14.5px;color:var(--suave);border-radius:3px}
.aviso b{font-weight:600;color:var(--tinta)}
.esconde{display:none!important}
.carrega{padding:60px 0;text-align:center;color:var(--apoio)}

/* HAG_CENTRAL_INICIO_v2 */
.ciclo{margin:14px 0 4px}
.ciclo .cl{display:flex;justify-content:space-between;font-size:14.5px;color:var(--suave)}
.ciclo .cl span:first-child{color:var(--tinta);font-weight:400}
.barra{height:4px;background:var(--fio);border-radius:4px;margin:9px 0 6px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--conhaque);border-radius:4px}
.ciclo .cq{font-size:13px;color:var(--apoio)}
/* HAG_CENTRAL_CICLO_CONSULTAS_v1 */
.ciclo .renov{display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:14px;color:var(--suave)}
.ciclo .renov svg{width:18px;height:18px;flex:none;fill:none;stroke:var(--floresta);stroke-width:1.6;margin-top:1px}
.ciclo .renov b{color:var(--tinta);font-weight:500}
.cons{margin-top:12px;border-top:1px solid var(--fio);padding-top:10px}
.cons .cr{display:flex;justify-content:space-between;font-size:14px;color:var(--suave)}
.cons .cr b{font-weight:500;color:var(--tinta)}
.cons ul{list-style:none;margin:6px 0 0;padding:0}
.cons li{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:center;padding:6px 0;font-size:14px;color:var(--suave)}
.cons li .pt{width:14px;height:14px;border:1px solid var(--fio);border-radius:50%;display:flex;align-items:center;justify-content:center}
.cons li.feita .pt{border:0}.cons li.feita .pt svg{width:18px;height:18px;fill:none;stroke:var(--conhaque);stroke-width:1.6}
.cons li.feita .nm{color:var(--tinta)}
.cons li .qd{font-size:13px;color:var(--apoio);text-align:right}
.cons li.marcada .qd{color:var(--conhaque)}
.cons .cnota{font-size:13px;color:var(--apoio);margin:6px 0 0}
.hero{background:var(--choc);color:var(--linho);border-radius:6px;padding:20px 20px 16px;margin-top:20px}
.hero .rot{color:var(--camurca)}
.hx{display:flex;gap:16px;align-items:center;margin-top:14px}
.hd{min-width:64px;text-align:center;border-right:1px solid rgba(238,231,220,.18);padding-right:16px}
.hd b{display:block;font-family:var(--d);font-weight:400;font-size:42px;line-height:1}
.hd span{font-family:var(--r);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#C8B49A}
.hh{font-family:var(--d);font-size:21px;line-height:1.2;text-transform:capitalize}
.hl{font-size:14.5px;color:#C8B49A;margin-top:2px}
.hacoes{display:flex;gap:10px;margin-top:18px;border-top:1px solid rgba(238,231,220,.14);padding-top:14px}
.hb{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;color:var(--linho);text-decoration:none;font-family:var(--r);font-weight:500;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;border:1px solid rgba(238,231,220,.28);border-radius:4px;padding:12px 8px}
.hb svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tit{font-family:var(--d);font-weight:400;font-size:23px;margin:30px 0 12px}
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0}
.apps.n2{grid-template-columns:1fr 1fr}.apps.n1{grid-template-columns:1fr}
.app{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--tinta);background:var(--papel);border:1px solid var(--fio);border-radius:6px;padding:14px 12px 13px;min-height:0}
.ic svg{width:22px;height:22px;fill:none;stroke:var(--conhaque);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.app .ic{display:flex;width:40px;height:40px;border-radius:50%;background:var(--linho);align-items:center;justify-content:center;margin-bottom:8px}
.app .n{font-family:var(--d);font-size:18px;line-height:1.15}
.app .s{font-size:12.5px;color:var(--apoio);line-height:1.3}
.planos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.planos.n1{grid-template-columns:1fr}
.plano{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;background:var(--papel);border:1px solid var(--fio);border-radius:6px;padding:16px 14px 14px;cursor:pointer;font-family:var(--t);color:var(--tinta)}
.plano .ic{margin-bottom:10px}
.plano .t{font-family:var(--d);font-size:18px;line-height:1.15}
.plano .q{font-size:12.5px;color:var(--apoio)}
.plano .a{margin-top:auto;padding-top:12px;font-family:var(--r);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--conhaque)}
.card.lst{padding:8px 16px 4px;margin-top:10px;border-radius:6px}
.card.lst .grupo{margin:10px 0 0}
.doc .ic{flex:none;display:flex}
.doc .dt{flex:1;display:flex;flex-direction:column}
/* HAG_CENTRAL_RECEITAS_v1 */
.doc.rx .t{font-size:15.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.doc.rx .tp{font-family:var(--r);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--conhaque);margin-bottom:3px}
.rxd{font-size:13px;color:var(--apoio);padding:12px 0 0}
.rxant{border-top:1px solid var(--fio);margin-top:4px}
.rxant summary{list-style:none;cursor:pointer;padding:14px 0;font-family:var(--r);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--conhaque)}
.rxant summary::-webkit-details-marker{display:none}
/* HAG_CENTRAL_EXAMES_v1 */
.exbtn{margin:12px 0 4px;padding:13px 16px}
.exnota{font-size:14px;color:var(--apoio);margin:10px 0 4px;line-height:1.45}
.exl{display:block;font-size:13.5px;color:var(--apoio);margin-top:12px}
.exl input{display:block;width:100%;margin-top:6px;border:1px solid var(--fio);border-radius:4px;background:#fff;padding:10px 12px;font:inherit;font-size:15.5px;color:var(--tinta)}
.rxant summary::after{content:" ›";letter-spacing:0}
.rxant[open] summary::after{content:" ⌄"}
.equipe{display:flex;align-items:center;gap:14px;margin-top:14px;background:var(--papel);border:1px solid var(--fio);border-radius:6px;padding:14px 16px;text-decoration:none;color:var(--tinta)}
.equipe .dt{flex:1;display:flex;flex-direction:column}
.equipe .t{font-size:16px;font-weight:400}.equipe .q{font-size:13px;color:var(--apoio)}
.equipe .sv svg{width:18px;height:18px;fill:none;stroke:var(--apoio);stroke-width:1.6}
.card.vaz{border-radius:6px}
@media (max-width:360px){.apps{grid-template-columns:1fr 1fr}.planos{grid-template-columns:1fr}}
/* HAG_CENTRAL_CHECKIN_v1 */
/* HAG_CHECKIN_SOB_MEDIDA_v1 */
.ckops.nums button{min-width:34px}.ckops.nums button span{font-size:9.5px;min-height:11px}
.ckops.uso button{padding:11px 6px}.ckops.uso span{font-size:12.5px}
.ckmeds .ckmed{border-top:1px solid var(--fio);padding:12px 0 2px;margin-top:10px}.ckmeds .ckmed:first-of-type{margin-top:12px}
.ckmed .mn b{font-weight:500;font-size:15.5px;display:block}.ckmed .mn span{font-size:12.5px;color:var(--apoio)}
.ckmeds .ckops.uso{margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{background:var(--linho);border:1px solid var(--fio);border-radius:999px;padding:8px 12px;font:inherit;font-size:13.5px;color:var(--tinta);cursor:pointer}
.chips button.on{background:var(--choc);border-color:var(--choc);color:var(--linho)}
.ck{display:flex;align-items:center;gap:14px;width:100%;margin-top:18px;background:var(--papel);border:1px solid var(--camurca);border-radius:6px;padding:15px 16px;text-align:left;cursor:pointer;font-family:var(--t);color:var(--tinta)}
.ck .dt{flex:1;display:flex;flex-direction:column}.ck .t{font-family:var(--d);font-size:19px}.ck .q{font-size:13px;color:var(--apoio)}
.ck .sv svg{width:18px;height:18px;fill:none;stroke:var(--conhaque);stroke-width:1.6}
.ckfeito{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14px;color:var(--suave)}
.ckfeito svg{width:18px;height:18px;fill:none;stroke:#2E3A2D;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ckespera svg{stroke:var(--apoio)}
/* HAG_CENTRAL_EVOLUCAO_v1 */
.evc{padding:16px}
.evg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ev{border:1px solid var(--fio);border-radius:6px;padding:10px 10px 8px;background:var(--papel)}
.ev .er{font-size:12.5px;color:var(--apoio)}
.ev .ev2{display:flex;align-items:baseline;gap:4px;margin-top:2px}
.ev .ev2 b{font-family:var(--d);font-weight:400;font-size:26px;color:var(--tinta)}
.ev .ev2 span{font-size:12.5px;color:var(--apoio)}
.ev .mg{width:100%;height:42px;display:block;margin:4px 0 2px}
.ev .mg polyline{fill:none;stroke:var(--conhaque);stroke-width:1.6;vector-effect:non-scaling-stroke}
.ev .mg circle{fill:var(--conhaque)}
.ev .ed{font-size:12.5px;color:var(--suave)}
.evrec{font-size:14.5px;color:var(--suave);margin:0 0 12px}.evrec b{color:var(--tinta);font-weight:500}
.evnota{font-size:12.5px;color:var(--apoio);margin:10px 0 0}
.ckq{padding:14px 14px 12px}.ckq.feita{border-color:var(--camurca)}
.ckt b{font-family:var(--d);font-weight:400;font-size:18px;display:block}.ckt span{font-size:13px;color:var(--apoio)}
.ckops{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.ckops button{flex:1 1 0;min-width:44px;display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--linho);border:1px solid var(--fio);border-radius:6px;padding:8px 2px;cursor:pointer;font-family:var(--t);color:var(--tinta)}
.ckops button b{font-family:var(--d);font-weight:400;font-size:18px}.ckops button span{font-size:10.5px;color:var(--apoio);line-height:1.15;text-align:center}
.ckops button.on{background:var(--choc);border-color:var(--choc);color:var(--linho)}.ckops button.on span{color:#D8C9B6}
.ckops button.na{flex:0 0 auto;padding:8px 10px}.ckops.est button{padding:11px 6px}.ckops.est span{font-size:12.5px}
.ckl{display:block;font-size:14.5px;margin:14px 0 6px;color:var(--tinta)}.ckl:first-child{margin-top:0}.ckl span{color:var(--apoio);font-size:13px}
.card textarea,.card input[type=text]{width:100%;border:1px solid var(--fio);border-radius:4px;background:#fff;padding:10px 12px;font:inherit;font-size:15.5px;color:var(--tinta)}
.ckres{display:flex;align-items:flex-end;gap:22px}.ckres>div:first-child b{display:block;font-family:var(--d);font-weight:400;font-size:46px;line-height:1}
.ckres>div:first-child span{font-size:13px;color:var(--apoio)}
.graf{flex:1;display:flex;gap:10px;align-items:flex-end;height:90px}.graf .b{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}
.graf .b i{display:block;width:100%;max-width:28px;background:var(--camurca);border-radius:3px 3px 0 0}.graf .b span{font-size:11px;color:var(--apoio);margin-top:4px}

/* HAG_CENTRAL_NIVEL2_v1 (13/11/2026) */
.agora{margin-top:18px}
.agora .ag{display:flex;align-items:center;gap:14px;width:100%;background:var(--papel);border:1px solid var(--fio);border-left:3px solid var(--conhaque);border-radius:4px;padding:15px 16px;margin-top:10px;text-align:left;text-decoration:none;color:var(--tinta);font-family:var(--t);cursor:pointer}

.agora .ag .dt{flex:1;display:flex;flex-direction:column;gap:2px}
.agora .ag .t{font-size:16px;font-weight:400}
.agora .ag .q{font-size:13.5px;color:var(--apoio)}
.agora .ag .sv svg{width:18px;height:18px;fill:none;stroke:var(--apoio);stroke-width:1.6}
.lido{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--suave);margin-top:10px}
.lido svg{width:18px;height:18px;flex:none;fill:none;stroke:var(--floresta);stroke-width:1.6}

      if(!x.ok){ b.disabled=false; b.textContent='Enviar check-in';
        if(x.erro==='sessao'){ ls.del('hagcentral.s'); return inicio(); }
        $('#ckM').textContent= x.erro==='ja_enviado'?'O check-in desta semana já chegou. Obrigado.':x.erro==='incompleto'?'Responda pelo menos três linhas.':'Não foi possível enviar agora. Tente de novo.'; return; }
      d.checkin=x.checkin; telaCheckinFeito(d, x.score, x.emergencia);
    });
  };
}
function telaCheckinFeito(d, score, emerg){
  var CK=d.checkin||{}, hs=(CK.historico||[]);
  var barras=hs.map(function(c){ var p=Math.max(6,Math.min(100,+c.score||0)); return '<div class="b"><i style="height:'+p+'%"></i><span>'+dataBR(c.data).slice(0,5)+'</span></div>'; }).join('');
  tela.innerHTML='<p class="rot">Check-in recebido</p><h1>Obrigado.</h1><p class="sub">O Dr. Henrique vê as suas respostas antes da próxima consulta.</p>'
    +(emerg?'<div class="aviso" style="margin-top:14px;border-left-color:#8a2e2e"><b>Se for intenso ou piorar, procure um pronto-atendimento.</b></div>':'')
    +(CK.cadencia==='quinzenal'?'<p class="sub" style="font-size:14px;margin-top:8px">Sua fase está estável: o próximo check-in vem em duas semanas.</p>':'')
    +'<div class="card"><div class="ckres"><div><b>'+(CK.sequencia||1)+'</b><span>'+((CK.sequencia||1)>1?'semanas seguidas':'semana')+'</span></div>'
    +(hs.length>1?'<div class="graf">'+barras+'</div>':'')+'</div></div>'
    +'<button class="btn claro" id="ckOk" style="margin-top:14px">Voltar ao início</button>';
  window.scrollTo(0,0); $('#ckOk').onclick=function(){ painel(d); };
}

/* HAG_CENTRAL_EXAMES_v1 (12/11/2026, decisões do Dr.): os exames que a clínica já tem (resultados e pedidos) aparecem só
   pelo título, nunca pelo nome do arquivo; o paciente envia exame novo por aqui (PDF ou foto). O arquivo sobe direto para o
   Storage por URL assinada, entra na lista na hora, o Mac arquiva na pasta Exames dele e o Dr. recebe aviso no HAG Dr. */
function grupoExame(x){
  var t=String(x.titulo||'');
  if(x.enviado) return 'env';
  if(x.pedido||/^Pedido/.test(t)) return 'ped';
  if(/Bioimped/.test(t)) return 'bio';
  if(/laborat/i.test(t)) return 'lab';
  if(/Ultrassom|Resson|Tomogr|Raio-x|Mamogr|Densitom|Doppler|Elastogr|Ecocard|imagem/i.test(t)) return 'img';
  return 'out';
}
/* HAG_CENTRAL_PEDIDO_ATENDIDO_v1 (12/11/2026, pedido do Dr.): o pedido de exame fica visível só até chegar o resultado.
   Sai quando existe resultado com data DEPOIS da data do pedido (no mesmo dia não: costuma ser exame antigo trazido à
   consulta em que o pedido foi feito). Pedido com tipo no título ("Pedido de exames: ultrassom") só sai com resultado
   daquele tipo ou com exame enviado pelo paciente; pedido genérico sai com qualquer resultado, menos bioimpedância
   (que é feita no consultório, não vem de pedido). */
function pedidosAbertos(L){
  L=L||[];
  var res=L.filter(function(x){ return grupoExame(x)!=='ped'; });
  return L.filter(function(x){
    if(grupoExame(x)!=='ped') return true;
    var m=String(x.titulo||'').match(/^Pedido de exames:\s*(.+)$/i), alvo=m?m[1].toLowerCase():'';
    return !res.some(function(r){
      if(!(String(r.data||'')>String(x.data||''))) return false;
      var gr=grupoExame(r); if(gr==='bio') return false;
      return !alvo || gr==='env' || String(r.titulo||'').toLowerCase().indexOf(alvo)>=0;
    });
  });
}
var GRUPOS_EX=[['ped','Pedidos de exame'],['lab','Laboratoriais'],['bio','Bioimpedância'],['img','Imagem'],['out','Outros exames'],['env','Enviados por você']];
function linhaDoc(x){ return '<li><button class="doc" data-doc="'+esc(x.id)+'"><span class="ic">'+IC.doc+'</span><span class="dt"><span class="t">'+esc(x.titulo||'Exame')+'</span><span class="q">'+dataBR(x.data)+'</span></span><span class="a">Abrir</span></button></li>'; }
function telaSub(d, rot, tit, corpo){
  window.scrollTo(0,0);
  tela.innerHTML=VOLTA_DR+'<button class="link" id="subV">‹ Voltar</button><p class="rot" style="margin-top:10px">'+rot+'</p><h1>'+tit+'</h1>'+corpo+'<div class="msg" id="mDoc"></div>';
  $('#subV').onclick=function(){ painel(d); };
  tela.querySelectorAll('[data-doc]').forEach(function(b){ b.onclick=function(){ abrirDoc(b.getAttribute('data-doc'), b); }; });
}
function telaReceitas(d){
  var L=(d._g&&d._g.receita)||[], datas=[], porData={};
  L.forEach(function(x){ if(!porData[x.data]){ porData[x.data]=[]; datas.push(x.data); } porData[x.data].push(x); });
  var linhaRx=function(x){
    var it=x.itens||[], t=it.length? (it.length>3? it.slice(0,2).join(' · ')+' e mais '+(it.length-2) : it.join(' · ')) : 'Receita';
    return '<li><button class="doc rx" data-doc="'+esc(x.id)+'"><span class="ic">'+IC.rx+'</span><span class="dt">'+(x.tipo&&it.length?'<span class="tp">'+esc(x.tipo)+'</span>':'')+'<span class="t">'+esc(t)+'</span>'+(!it.length?'<span class="q">Toque para ver os itens e como usar</span>':'')+'</span><span class="a">Abrir</span></button></li>';
  };
  var corpo=datas.map(function(dt,i){ var l=porData[dt];
    return '<div class="card lst"><div class="grupo">'+(i===0?'Da última consulta':'Ainda válidas')+' · '+dataBR(dt)+'</div><ul class="lista">'+l.map(linhaRx).join('')+'</ul></div>'; }).join('');
  telaSub(d,'Seu plano','Suas receitas.', '<p class="sub">Só as receitas válidas. Use cada uma como o Dr. Henrique orientou.</p>'+(corpo||'<div class="card"><p class="vazio">Nenhuma receita válida no momento.</p></div>'));
}
function telaExames(d){
  var L=(d._g&&d._g.exame)||[], por={};
  L.forEach(function(x){ var k=grupoExame(x); (por[k]=por[k]||[]).push(x); });
  var corpo=(VER?'<p class="exnota">O paciente vê aqui o botão para enviar exame.</p>':'<button class="btn" id="bExEnv">Enviar um exame</button>');
  if(!L.length) corpo+='<div class="card"><p class="vazio">Quando você fizer exames, envie por aqui. Eles ficam guardados neste lugar para você e para o Dr. Henrique.</p></div>';
  GRUPOS_EX.forEach(function(gx){ var l=por[gx[0]]; if(!l||!l.length) return;
    l.sort(function(a,b){ return String(b.data||'').localeCompare(String(a.data||'')); });
    if(gx[0]==='env') l=l.map(function(x){ return Object.assign({},x,{titulo:String(x.titulo||'').replace(/^Enviado por você:?\s*/,'')||'Exame enviado'}); });
    corpo+='<div class="card lst"><div class="grupo">'+gx[1]+' · '+l.length+'</div><ul class="lista">'+l.slice(0,4).map(linhaDoc).join('')+'</ul>'
      +(l.length>4?'<details class="rxant"><summary>Mais '+(l.length-4)+'</summary><ul class="lista">'+l.slice(4).map(linhaDoc).join('')+'</ul></details>':'')+'</div>'; });
  telaSub(d,'Seu plano','Seus exames.','<p class="sub">Pedidos e resultados, separados por tipo. A leitura clínica é feita em consulta.</p>'+corpo);
  var bex=$('#bExEnv'); if(bex) bex.onclick=function(){ formExame(d); };
}
function formExame(d){
  window.scrollTo(0,0);
  var hoje=new Date(new Date().toLocaleString('en-US',{timeZone:'America/Sao_Paulo'})), mx=hoje.getFullYear()+'-'+String(hoje.getMonth()+1).padStart(2,'0')+'-'+String(hoje.getDate()).padStart(2,'0');
  tela.innerHTML='<p class="rot">Seus exames</p><h1>Enviar um exame.</h1><p class="sub">PDF ou foto do resultado. Se tiver várias páginas em fotos, envie uma de cada vez.</p>'
    +'<div class="card"><label class="exl">Arquivo<input type="file" id="exArq" accept="application/pdf,image/jpeg,image/png,image/heic,.pdf,.jpg,.jpeg,.png,.heic"></label>'
    +'<label class="exl">Data do exame (se souber)<input type="date" id="exData" max="'+mx+'"></label>'
    +'<label class="exl">O que é (opcional)<input type="text" id="exDesc" maxlength="120" placeholder="Ex.: hemograma, ultrassom de abdômen"></label>'
    +'<button class="btn" id="exEnviar" style="margin-top:16px">Enviar</button><button class="btn claro" id="exVoltar">Voltar</button><p class="msg" id="exMsg"></p></div>';
  $('#exVoltar').onclick=function(){ telaExames(d); };
  $('#exEnviar').onclick=function(){
    var f=($('#exArq').files||[])[0], m=$('#exMsg'), bt=$('#exEnviar');
    if(!f){ m.textContent='Escolha o arquivo do exame.'; return; }
    if(f.size>25*1024*1024){ m.textContent='O arquivo passa de 25 MB. Envie um PDF menor ou uma foto.'; return; }
    var tipo=(f.type||'').toLowerCase(); if(!tipo&&/\.heic$/i.test(f.name)) tipo='image/heic'; if(tipo==='image/heif') tipo='image/heic';
    bt.disabled=true; bt.textContent='Enviando…'; m.textContent='';
    var falha=function(t){ bt.disabled=false; bt.textContent='Enviar'; m.textContent=t||'Não foi possível enviar agora. Tente de novo em alguns minutos.'; };
    api({acao:'exame_url',token:TOKEN,sessao:SESSAO,tipo:tipo,tamanho:f.size,nome:f.name}).then(function(r){
      if(r.fechado) return fechado(r.motivo);
      if(!r.ok){ if(r.erro==='sessao'){ ls.del('hagcentral.s'); return inicio(); }
        return falha(r.erro==='tipo'?'Envie em PDF, JPG, PNG ou HEIC.':r.erro==='tamanho'?'O arquivo passa de 25 MB.':r.erro==='limite'?'Você já enviou muitos arquivos hoje. Fale com a equipe pelo WhatsApp.':null); }
      return fetch(r.url,{method:'PUT',headers:{'Content-Type':r.tipo||tipo||'application/octet-stream','x-upsert':'false'},body:f}).then(function(up){
        if(!up.ok) return falha();
        return api({acao:'exame_ok',token:TOKEN,sessao:SESSAO,path:r.path,data:$('#exData').value||'',descricao:$('#exDesc').value||''}).then(function(k){
          if(!k.ok) return falha();
          tela.innerHTML='<p class="rot">Seus exames</p><h1>Exame recebido.</h1><p class="sub">Ele já está na sua lista, e o Dr. Henrique foi avisado. A leitura do resultado é feita em consulta.</p>'
            +'<button class="btn" id="exMais">Enviar outro</button><button class="btn claro" id="exFim">Ver meus exames</button>';
          var volta=function(fn){ api({acao:'dados',token:TOKEN,sessao:SESSAO}).then(function(x){ var nd=(x&&x.ok&&x.dados)||d; fn(nd); }); };
          $('#exMais').onclick=function(){ volta(formExame); }; $('#exFim').onclick=function(){ volta(function(nd){ painel(nd); var ce=$('#cEx'); if(ce) ce.click(); }); };
        });
      });
    }).catch(function(){ falha(); });
  };
}

function abrirDoc(id, b){
  var w=null; try{ w=window.open('', '_blank'); }catch(e){}
  var a=b.querySelector('.a'); a.textContent='Abrindo…';
  api(VER?{acao:'ver_doc',patient_id:VER,doc_id:id}:{acao:'doc',token:TOKEN,sessao:SESSAO,doc_id:id}).then(function(r){
    a.textContent='Abrir';
    if(r.fechado){ if(w) w.close(); return fechado(r.motivo); }
    if(!r.ok){ if(w) w.close(); if(r.erro==='sessao'){ ls.del('hagcentral.s'); return inicio(); } $('#mDoc').textContent='Não foi possível abrir este documento agora.'; return; }
    if(w){ w.location.href=r.url; } else { location.href=r.url; }
  });
}

function inicio(){
  if(VER){
    return sessaoEquipe().then(function(tk){
      if(!tk){ tela.innerHTML='<h1>Entre para continuar.</h1><p class="sub">A visualização da equipe usa o mesmo login do painel.</p>';
        if(window.HAGAuth){ window.HAG_EXIGIR_LOGIN=true; window.HAGAuth.mount(function(){ inicio(); }); } return; }
      return api({acao:'ver',patient_id:VER});
    }).then(function(r){
      if(!r) return;
      if(!r.ok && r.erro==='equipe' && window.HAGAuth && !inicio._tentou){ inicio._tentou=1; return Promise.resolve(window.HAGAuth.refresh()).then(function(){ return inicio(); }); }
      if(!r.ok){ tela.innerHTML=VOLTA_DR+'<h1>Não foi possível abrir.</h1><p class="sub">'+(r.erro==='equipe'?'Seu login expirou. Abra o painel e entre de novo.':'Paciente não encontrado.')+'</p>'; return; }
      painel(r.dados);
      if(!r.aberto){ tela.insertAdjacentHTML('afterbegin','<div class="aviso" style="margin:0 0 14px"><b>Para o paciente, a central está fechada</b> (sem ciclo ativo).</div>'); }
    });
  }
  if(!TOKEN){ return fechado('link'); }
  // ícone recém-salvo: abre com a passagem e entra sem código
  if(PONTE && !SESSAO){
    var ap=(navigator.userAgent.match(/iPhone|iPad|Android|Mac|Windows/)||['aparelho'])[0];
    var k=PONTE; PONTE='';
    return api({acao:'usar_ponte',token:TOKEN,ponte:k,aparelho:ap}).then(function(r){
      if(r.fechado) return fechado(r.motivo);
      if(r.ok&&r.sessao){ SESSAO=r.sessao; ls.set('hagcentral.s',SESSAO); ls.set('hagcentral.t',TOKEN); if(STANDALONE) ls.set('hagcentral.salvou','1'); try{ history.replaceState(null,'',enderecoCom('')); }catch(e){} return painel(r.dados); }
      inicio();
    });
  }
  api({acao:'estado',token:TOKEN,sessao:SESSAO}).then(function(r){
    if(r.fechado) return fechado(r.motivo);
    if(!r.ok){ tela.innerHTML='<h1>Sem conexão.</h1><p class="sub">'+esc(ERROS[r.erro]||ERROS.interno)+'</p><div class="card"><button class="btn" onclick="location.reload()">Tentar de novo</button></div>'; return; }
    if(r.entrou){
      painel(r.dados);
      // no Safari do iPhone, já dentro: renova a passagem para o ícone que ainda vai ser salvo
      if(querPonte()) api({acao:'ponte_nova',token:TOKEN,sessao:SESSAO}).then(function(x){ if(x&&x.ok&&x.ponte) aplicaPonte(x.ponte); });
      return;
    }
    if(SESSAO){ ls.del('hagcentral.s'); SESSAO=''; }
    telaEntrar(r);
  });
}
window.HAG_CENTRAL={versao:'HAG_CENTRAL_PACIENTE_v1+PONTE_v1+INICIO_v2+CHECKIN_v1+SOB_MEDIDA_v1'};
inicio();
})();
</script>
