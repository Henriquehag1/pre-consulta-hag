<script>
(function(){
'use strict';
var URL_ = window.SUPA_URL, KEY = window.SUPA_KEY, DR = 'drhenrique@clinicahag.com';
var ABA = 'hoje', DIA = null, AG = [], BR = {}, ABERTO = null, OCULTO = false, MSG = {};
var NOMEPLANO = { ciclo_essencial:'Ciclo Essencial', ciclo_reset:'Ciclo Reset', ciclo_transformar:'Ciclo Transforma', manutencao_intermediario:'Manutenção Plus',
  manutencao_premium:'Manutenção Premium', smart_90:'Protocolo Smart 90', ciclo_manutencao:'Manutenção Base', smart_continuidade:'Protocolo Smart Continuidade',
  particular_bimestrais:'Consultas particulares' };
var TIPO = { fechamento:'Fechamento', retorno:'Retorno', diagnostica:'Diagnóstica', procedimento:'Procedimento' };

function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function hojeISO(off){ var d = new Date(Date.now() + (off||0)*86400000); return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function dm(iso){ var m = String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3] + '/' + m[2] : ''; }
var SEM = ['dom','seg','ter','qua','qui','sex','sáb'];
function diaRot(iso){ if(iso === hojeISO()) return 'Hoje'; if(iso === hojeISO(1)) return 'Amanhã'; var d = new Date(iso + 'T12:00:00'); return SEM[d.getDay()] + ' ' + dm(iso); }
function brl(n){ return n == null || isNaN(+n) ? '—' : 'R$ ' + Math.round(+n).toLocaleString('pt-BR'); }
function api(path, init){
  init = init || {};
  init.headers = Object.assign({ apikey:KEY, Authorization:'Bearer ' + KEY, 'Content-Type':'application/json' }, init.headers || {});
  return fetch(URL_ + '/rest/v1/' + path, init).then(function(r){
    if(!r.ok) return r.text().then(function(t){ throw new Error('HTTP ' + r.status + (t ? ': ' + t.slice(0,140) : '')); });
    return r.status === 204 ? null : r.text().then(function(t){ return t ? JSON.parse(t) : null; });
  });
}
function rpc(nome, corpo){ return api('rpc/' + nome, { method:'POST', body: JSON.stringify(corpo || {}) }); }
function emailLogado(){
  try{ var tk = window.HAGAuth && window.HAGAuth.token && window.HAGAuth.token(); if(!tk) return '';
    var p = JSON.parse(atob(tk.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))); return String(p.email || '').toLowerCase(); }catch(e){ return ''; }
}
function md2html(md){
  var linhas = String(md||'').split(/\r?\n/), out = [], emUl = false, cab = [], iniciou = false;
  function fechaUl(){ if(emUl){ out.push('</ul>'); emUl = false; } }
  function inl(t){ return esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>'); }
  for(var i = 0; i < linhas.length; i++){
    var L = linhas[i].trim();
    if(!iniciou && /^#\s+/.test(L)){ cab.push(inl(L.replace(/^#\s+/,''))); continue; }
    if(!iniciou && /^([-*_])\1{2,}$/.test(L)) continue;
    if(!iniciou && L && L.indexOf('#') !== 0){ cab.push(inl(L)); continue; }
    if(/^#{2,3}\s/.test(L)) iniciou = true;
    if(!L){ fechaUl(); continue; }
    if(/^([-*_])\1{2,}$/.test(L)){ fechaUl(); continue; }
    var h = L.match(/^#{1,3}\s*(.+)$/);
    if(h){ fechaUl(); out.push('<h2>' + inl(h[1]) + '</h2>'); continue; }
    if(/^[-*•]\s+/.test(L)){ if(!emUl){ out.push('<ul>'); emUl = true; } out.push('<li>' + inl(L.replace(/^[-*•]\s+/,'')) + '</li>'); continue; }
    fechaUl(); out.push('<p>' + inl(L) + '</p>');
  }
  fechaUl();
  return (cab.length ? '<div class="cab">' + cab.join('<br>') + '</div>' : '') + out.join('');
}
function W(h){ document.getElementById('wrap').innerHTML = h; }
function falha(e){ W('<div class="msg erro">Não consegui ler: ' + esc(e && e.message || e) + '</div>'); }

/* ── AGENDA + BRIEFING ─────────────────────────────────────────────── */
function abaHoje(){
  W('<div class="vazio">Carregando a agenda…</div>');
  return rpc('hag_agenda_briefing', { p_de: hojeISO(), p_ate: hojeISO(7) }).then(function(rows){
    AG = (rows || []).slice().sort(function(a,b){ return (a.data_consulta + (a.hora||'')).localeCompare(b.data_consulta + (b.hora||'')); });
    var dias = []; AG.forEach(function(r){ if(dias.indexOf(r.data_consulta) < 0) dias.push(r.data_consulta); });
    if(!DIA || dias.indexOf(DIA) < 0) DIA = dias[0] || hojeISO();
    var doDia = AG.filter(function(r){ return r.data_consulta === DIA; });
    var ids = doDia.map(function(r){ return r.patient_id; });

function pedirBriefing(k, tipo){
  var p = k.split('|'), pid = p[0], data = p[1];
  MSG[k] = 'Pedido enviado. O Mac começa em até 1 minuto; ele precisa estar ligado.'; pintaAtual();
  return api('briefing_pedidos', { method:'POST', headers:{ Prefer:'return=representation' }, body: JSON.stringify({ patient_id: pid, data_consulta: data, tipo: tipo }) })
    .then(function(rows){
      var ped = (rows || [])[0]; if(!ped || !ped.id) throw new Error('o pedido não voltou do banco');
      var t0 = Date.now();
      return new Promise(function(fim){
        (function olha(){
          if(Date.now() - t0 > 6*60000){ MSG[k] = 'Ainda não terminou. O pedido continua na fila; toque em Atualizar daqui a pouco.'; pintaAtual(); return fim(); }
          setTimeout(function(){
            api('briefing_pedidos?select=status,resumo,erro&id=eq.' + encodeURIComponent(ped.id)).then(function(r){
              var st = (r || [])[0] || {};
              if(st.status === 'feito'){ MSG[k] = 'Briefing atualizado. ' + esc(st.resumo || ''); abaHoje().then(fim); return; }
              if(st.status === 'erro'){ MSG[k] = 'Não atualizou: ' + esc(st.erro || ''); pintaAtual(); return fim(); }
              if(st.status === 'processando'){ MSG[k] = 'O Mac está gerando o briefing…'; pintaAtual(); }
              else if(Date.now() - t0 > 90000){ MSG[k] = 'O Mac ainda não pegou o pedido. Ele precisa estar ligado e acordado; o pedido fica na fila.'; pintaAtual(); }
              olha();
            }).catch(olha);
          }, 4000);
        })();
      });
    }).catch(function(e){ MSG[k] = 'Não foi possível pedir: ' + esc(e.message); pintaAtual(); });
}
function pintaAtual(){
  if(ABA !== 'hoje') return;
  var dias = []; AG.forEach(function(r){ if(dias.indexOf(r.data_consulta) < 0) dias.push(r.data_consulta); });
  pintaHoje(dias, AG.filter(function(r){ return r.data_consulta === DIA; }));
}

var CAT = { m1:'Consulta', m2c:'Plano', m3:'Injetável', m4:'Implante', plano:'Plano', injetavel:'Injetável', implante:'Implante', consulta:'Consulta' };
function folha(tit, html){ document.getElementById('fTit').textContent = tit; document.getElementById('fCorpo').innerHTML = html; document.getElementById('veu').hidden = false; document.getElementById('fCorpo').scrollTop = 0; }
function fechaFolha(){ document.getElementById('veu').hidden = true; }
function li(nome, sub, vl, din){ return '<div class="li"><div class="q"><div class="nome" style="font-weight:500">' + nome + '</div>' + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>' + (vl != null ? '<div class="vl' + (din ? ' din' : '') + '">' + vl + '</div>' : '') + '</div>'; }
function plano(t){ return esc(NOMEPLANO[t] || t || ''); }
function detalhe(tipo, mes, tit, momento){
  folha(tit, '<div class="vazio">Carregando…</div>');
  return rpc('hag_dr_detalhe', { p_tipo: tipo, p_mes: mes || null, p_momento: momento || null }).then(function(d){
    var h = '', soma = 0;
    if(tipo === 'renovacoes'){
      var ini = d.iniciadas || [], ven = d.venceram || [];
      h += '<h2>Ciclos renovados que começaram no mês (' + ini.length + ')</h2>' + (ini.length ? ini.map(function(x){ return li(esc(x.nome), plano(x.tipo_ciclo) + ' · começou ' + dm(x.inicio)); }).join('') : '<div class="vazio">Nenhum.</div>');
      h += '<h2>Ciclos que venceram no mês (' + ven.length + ')</h2>' + (ven.length ? ven.map(function(x){ return li(esc(x.nome), plano(x.tipo_ciclo) + ' · venceu ' + dm(x.fim), x.renovou ? '<span class="tag aceita">renovou</span>' : '<span class="tag atrasada">não renovou</span>'); }).join('') : '<div class="vazio">Nenhum.</div>');
      folha(tit, h); return;
    }
    d = d || [];
    if(!d.length){ folha(tit, '<div class="vazio">Nada neste período.</div>'); return; }
    d.forEach(function(x){ soma += +x.valor || 0; });
    if(tipo === 'receita') h = d.map(function(x){ return li(esc(x.nome), dm(x.data) + ' · ' + esc(x.servico || '') + (x.forma ? ' · ' + esc(x.forma) : '') + (x.nfse === 'pendente' ? ' · NFSe pendente' : ''), brl(x.valor), true); }).join('');
    else if(tipo === 'ativos') h = d.map(function(x){ return li(esc(x.nome), plano(x.tipo_ciclo) + ' · ' + dm(x.inicio) + ' a ' + dm(x.fim)); }).join('');
    else if(tipo === 'consultas') h = d.map(function(x){ return li(esc(x.nome), dm(x.data) + ' · ' + esc(x.consulta || '') + (x.local ? ' · ' + esc(x.local) : ''), '<span class="tag ' + (x.status === 'faltou' ? 'atrasada' : 'aceita') + '">' + esc(STRET[x.status] || x.status) + '</span>'); }).join('');
    else if(tipo === 'entradas' || tipo === 'saidas') h = d.map(function(x){ var cat = { receita_pix:'Pix', receita_maquininha:'repasse do cartão' }[x.categoria] || String(x.categoria || '').replace(/_/g,' '); return li(esc(x.nome || 'sem nome'), dm(x.data) + ' · ' + esc(cat), brl(Math.abs(+x.valor)), true); }).join('');
    else if(tipo === 'nfse') h = d.map(function(x){ return li(esc(x.nome), dm(x.data) + ' · ' + esc(x.servico || '') + (x.prazo && x.prazo !== 'normal' ? ' · <b style="color:var(--verm)">fora do prazo</b>' : ''), brl(x.valor), true); }).join('');
    else if(tipo === 'propostas') h = d.map(function(x){ return li(esc(x.nome), dm(x.data) + ' · ' + esc(x.resumo || '') + (x.motivo ? ' · ' + esc(x.motivo) : ''), '<span class="tag ' + esc(x.status) + '">' + esc(STP[x.status] || x.status) + '</span>'); }).join('');
    var comValor = ['receita','entradas','saidas','nfse'].indexOf(tipo) >= 0;
    folha(tit, h + (comValor ? '<div class="tot"><span>' + d.length + ' lançamentos</span><span class="din">' + brl(Math.abs(soma)) + '</span></div>' : '<div class="meta" style="margin-top:8px">' + d.length + ' no total</div>'));
  }).catch(function(e){ folha(tit, '<div class="msg erro">Não consegui abrir: ' + esc(e.message) + '</div>'); });
}
function itensHtml(itens){
  return (Array.isArray(itens) ? itens : []).map(function(i){ return li(esc(i.nome || ''), esc(CAT[i.cat] || i.cat || ''), (i.pix != null ? 'Pix ' + brl(i.pix) : '') + (i.cartao != null ? '<br>cartão ' + brl(i.cartao) : ''), true); }).join('');
}
function pacienteCiclo(pid, nome){
  folha(nome || 'Paciente', '<div class="vazio">Carregando…</div>');
  return rpc('hag_dr_paciente_ciclo', { p_patient_id: pid }).then(function(d){
    d = d || {}; var c = d.ciclo, h = '';
    h += c ? '<div class="card" style="padding:10px 12px"><div class="nome">' + plano(c.tipo_ciclo) + '</div><div class="sub">de ' + dm(c.inicio) + ' a ' + dm(c.fim) + '</div></div>' : '<div class="vazio">Sem ciclo ativo.</div>';
    var cs = d.consultas || [];
    if(cs.length) h += '<h2>Consultas do ciclo</h2>' + cs.map(function(x){
      var st = x.status || 'pendente', cls = st === 'realizada' ? 'aceita' : st === 'faltou' || st === 'cancelada' ? 'atrasada' : x.fechamento ? 'fechamento' : '';
      return li(esc(x.nome || ''), (x.data ? diaRot(String(x.data).slice(0,10)) : 'sem data') + (x.local ? ' · ' + esc(x.local) : '') + (x.fechamento ? ' · fechamento' : ''), '<span class="tag ' + cls + '">' + esc(STRET[st] || st) + '</span>');
    }).join('');
    var p = d.proposta;
    h += '<h2>Última proposta</h2>' + (p ? '<div class="card" style="padding:10px 12px"><div class="nome">' + esc(p.resumo || '') + ' <span class="tag ' + esc(p.status) + '">' + esc(STP[p.status] || p.status) + '</span></div><div class="sub">' + dm(p.data) + (p.pagamento ? ' · ' + esc(p.pagamento) : '') + (p.motivo ? ' · ' + esc(p.motivo) : '') + '</div>' + itensHtml(p.itens)
         + '<div class="tot"><span>Total</span><span class="din">' + brl(p.valor_cobrado != null ? p.valor_cobrado : p.valor_pix) + '</span></div></div>' : '<div class="vazio">Nenhuma proposta registrada ainda.</div>');
    var k = d.checkin, t = d.triagem;
    h += '<h2>Último check-in</h2>' + (k ? li(dm(k.data) + ' · ' + esc(k.tipo || ''), (k.peso ? 'peso ' + esc(k.peso) : '') + (t && t.motivo ? (k.peso ? ' · ' : '') + esc(t.motivo) : ''), t && t.status === 'pendente' ? '<a class="tag responder" style="text-decoration:none" href="triagem_HAG.html?id=' + encodeURIComponent(t.id) + '&de=dr">responder ›</a>' : null) : '<div class="vazio">Sem check-in.</div>');
    folha(nome || 'Paciente', h);
  }).catch(function(e){ folha(nome || 'Paciente', '<div class="msg erro">Não consegui abrir: ' + esc(e.message) + '</div>'); });
}
function propostaDet(id, nome){
  folha(nome || 'Proposta', '<div class="vazio">Carregando…</div>');
  return api('propostas?select=*&id=eq.' + encodeURIComponent(id)).then(function(r){
    var p = (r || [])[0]; if(!p){ folha(nome, '<div class="vazio">Proposta não encontrada.</div>'); return; }
    var MOMP = { entrada:'entrada', renovacao:'renovação', dia:'no dia' };
    folha(nome || p.patient_nome, '<div class="card" style="padding:10px 12px"><div class="nome">' + esc(p.resumo || '') + '</div><div class="sub">' + dm(p.criado_em) + ' · ' + esc(MOMP[p.momento] || p.momento || '') + ' · ' + esc(STP[p.status] || p.status) + '</div>'
      + itensHtml(p.itens) + '<div class="tot"><span>Total no Pix</span><span class="din">' + brl(p.valor_pix) + '</span></div>' + (p.valor_cartao != null ? '<div class="li"><div class="q">Total no cartão</div><div class="vl din">' + brl(p.valor_cartao) + '</div></div>' : '') + '</div>'
      + (p.observacoes ? '<div class="msg">' + esc(p.observacoes) + '</div>' : '')
      + '<div class="meta" style="margin-top:8px">O desfecho (aceitou ou não seguiu) é registrado no Mac, na tela Propostas.</div>');
  }).catch(function(e){ folha(nome, '<div class="msg erro">Não consegui abrir: ' + esc(e.message) + '</div>'); });
}

/* ── navegação ─────────────────────────────────────────────────────── */
function abrir(aba){
  ABA = aba; ABERTO = null;
  document.getElementById('titAba').textContent = ({ hoje:'Agenda', checkins:'Check-ins', vendas:'Vendas', fin:'Financeiro' })[aba] || 'HAG Dr';
  document.querySelectorAll('#tabs button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-aba') === aba); });
  try{ sessionStorage.setItem('hagdr_aba', aba); }catch(e){}
  window.scrollTo(0, 0);
  return ({ hoje:abaHoje, checkins:abaCheckins, vendas:abaVendas, fin:abaFin })[aba]();
}
document.addEventListener('click', function(e){
  var t = e.target, a;
  if(!t.closest) return;
  if((a = t.closest('#fFecha')) || t.id === 'veu'){ fechaFolha(); return; }
  if((a = t.closest('[data-det="areceber"]'))){ areceberDet(); return; }
  if((a = t.closest('[data-det="entradas"]'))){ detalhe('entradas', a.getAttribute('data-mes'), 'Entrou na conta'); return; }
  if((a = t.closest('[data-det]'))){ detalhe(a.getAttribute('data-det'), a.getAttribute('data-mes'), a.getAttribute('data-tit')); return; }
  if((a = t.closest('[data-mesdin]'))){ mesDinheiro(a.getAttribute('data-mesdin')); return; }
  if((a = t.closest('[data-pac]'))){ pacienteCiclo(a.getAttribute('data-pac'), a.getAttribute('data-nome')); return; }
  if((a = t.closest('[data-prop]'))){ propostaDet(a.getAttribute('data-prop'), a.getAttribute('data-nome')); return; }
  if((a = t.closest('[data-conv]'))){ var cv = a.getAttribute('data-conv').split('|'); detalhe('propostas', cv[0], a.getAttribute('data-nome'), cv[1]); return; }
  if((a = t.closest('#tabs [data-aba]'))){ abrir(a.getAttribute('data-aba')); return; }
  if((a = t.closest('#recarregar'))){ abrir(ABA); contaCheckins(); return; }
  if((a = t.closest('[data-dia]'))){ DIA = a.getAttribute('data-dia'); ABERTO = null; abaHoje(); return; }
  if((a = t.closest('[data-pedir]'))){ pedirBriefing(a.getAttribute('data-k'), a.getAttribute('data-pedir')); return; }
  if((a = t.closest('[data-abre]'))){ var k = a.getAttribute('data-abre'); ABERTO = ABERTO === k ? null : k; pintaAtual(); return; }
  if((a = t.closest('#olho'))){ OCULTO = !OCULTO; try{ localStorage.setItem('hagdr_oculto', OCULTO ? '1' : ''); }catch(x){} abaFin(); return; }
});
document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'visible'){ contaCheckins(); } });

function dataLonga(){ var d = new Date(); var S = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
  var M = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro']; return S[d.getDay()] + ', ' + d.getDate() + ' de ' + M[d.getMonth()]; }
function iniciar(){
  document.getElementById('hojeDt').textContent = dataLonga();
  var em = emailLogado();
  if(em && em !== DR){ W('<div class="nego">Este app é do Dr. Henrique. A equipe usa o app Tarefas.</div>'); document.getElementById('tabs').hidden = true; return; }
  try{ OCULTO = localStorage.getItem('hagdr_oculto') === '1'; }catch(e){}
  document.body.classList.toggle('oculto', OCULTO);
  var ini = 'hoje'; try{ ini = sessionStorage.getItem('hagdr_aba') || 'hoje'; }catch(e){}
  if(/[?&]aba=(\w+)/.test(location.search)) ini = RegExp.$1;
  abrir(ini); contaCheckins();
}
if(window.HAGAuth && window.HAGAuth.valid && window.HAGAuth.valid()) iniciar();
else if(window.HAGAuth) window.HAGAuth.mount(iniciar);
window.HAG_DR = { abrir: abrir };
})();
</script>
