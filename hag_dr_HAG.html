function md2html(md){
  var linhas = String(md||'').split(/\r?\n/), out = [], emUl = false, cab = [], iniciou = false;
  function fechaUl(){ if(emUl){ out.push('</ul>'); emUl = false; } }
  function inl(t){ return esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>'); }
  for(var i = 0; i < linhas.length; i++){
    var L = linhas[i].trim();
    if(!iniciou && /^#\s+/.test(L)){ cab.push(inl(L.replace(/^#\s+/,''))); continue; }
    if(!iniciou && /^([-*_])\1{2,}$/.test(L)) continue;
    if(!iniciou && L && L.indexOf('#') !== 0){ cab.push(inl(L)); continue; }
    if(/^#{2,3}\s/.test(L)) iniciou = true;
    if(!L){ fechaUl(); continue; }
    if(/^([-*_])\1{2,}$/.test(L)){ fechaUl(); continue; }
    var h = L.match(/^#{1,3}\s*(.+)$/);
    if(h){ fechaUl(); out.push('<h2>' + inl(h[1]) + '</h2>'); continue; }
    if(/^[-*•]\s+/.test(L)){ if(!emUl){ out.push('<ul>'); emUl = true; } out.push('<li>' + inl(L.replace(/^[-*•]\s+/,'')) + '</li>'); continue; }
    fechaUl(); out.push('<p>' + inl(L) + '</p>');
  }
  fechaUl();
  return (cab.length ? '<div class="cab">' + cab.join('<br>') + '</div>' : '') + out.join('');
}

function pedirBriefing(k, tipo){
  var p = k.split('|'), pid = p[0], data = p[1];

  return api('briefing_pedidos', { method:'POST', headers:{ Prefer:'return=representation' }, body: JSON.stringify({ patient_id: pid, data_consulta: data, tipo: tipo }) })
    .then(function(rows){
      var ped = (rows || [])[0]; if(!ped || !ped.id) throw new Error('o pedido não voltou do banco');
      var t0 = Date.now();
      return new Promise(function(fim){
        (function olha(){
          if(Date.now() - t0 > 6*60000){ MSG[k] = 'Ainda não terminou. O pedido continua na fila; toque em Atualizar daqui a pouco.'; pintaAtual(); return fim(); }
          setTimeout(function(){
            api('briefing_pedidos?select=status,resumo,erro&id=eq.' + encodeURIComponent(ped.id)).then(function(r){
              var st = (r || [])[0] || {};

              if(st.status === 'erro'){ MSG[k] = 'Não atualizou: ' + esc(st.erro || ''); pintaAtual(); return fim(); }
              if(st.status === 'processando'){ MSG[k] = 'O Mac está gerando o briefing…'; pintaAtual(); }

            }).catch(olha);

        })();
      });
    }).catch(function(e){ MSG[k] = 'Não foi possível pedir: ' + esc(e.message); pintaAtual(); });
}

  return h;

/* ── 2. NFS-e PELO CELULAR ───────────────────────────────────────────── */
/* O texto e o mesmo do "Gerar pedido para o contador" do Financeiro do Mac
   (_construirTextoPedido), sem travessao. CPF e endereco so sao lidos na hora
   de montar o e-mail, nunca ficam na tela. */
var NFS = [], NFSSEL = {};
function fmtCPF(c){ var d = String(c || '').replace(/\D/g,''); return d.length === 11 ? d.slice(0,3) + '.' + d.slice(3,6) + '.' + d.slice(6,9) + '-' + d.slice(9) : (c || ''); }
function docFmt(doc){ var d = String(doc || '').replace(/\D/g,''); return d.length === 14 ? d.slice(0,2) + '.' + d.slice(2,5) + '.' + d.slice(5,8) + '/' + d.slice(8,12) + '-' + d.slice(12) : fmtCPF(doc); }
function moeda(v){ return (Number(v) || 0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' }); }
function pedidoNfse(){
  folha('Pedir notas à Malgo', '<div class="vazio">Carregando…</div>');
  var ult = new Date(); ult = new Date(ult.getFullYear(), ult.getMonth() + 1, 0);
  var lim = ult.getFullYear() + '-' + String(ult.getMonth() + 1).padStart(2,'0') + '-' + String(ult.getDate()).padStart(2,'0');
  api('v_nfse_pendentes?select=id,patient_nome,servico_nome,valor_bruto,data_pagamento,prazo_status,dados_completos&data_pagamento=lte.' + lim + '&order=data_pagamento.asc').then(function(l){
    NFS = l || []; NFSSEL = {}; NFS.forEach(function(n){ if(n.data_pagamento <= hojeISO()) NFSSEL[n.id] = true; });
    pintaNfse();
  }).catch(function(e){ folha('Pedir notas à Malgo', '<div class="msg erro">' + esc(e.message) + '</div>'); });
}
function pintaNfse(){
  if(!NFS.length){ folha('Pedir notas à Malgo', '<div class="vazio">Nenhuma nota pendente até o fim do mês.</div>'); return; }
  var sel = NFS.filter(function(n){ return NFSSEL[n.id]; }), tot = sel.reduce(function(s, n){ return s + (+n.valor_bruto || 0); }, 0);
  folha('Pedir notas à Malgo', '<p class="sub">Marcadas: as já pagas. As do resto do mês ficam desmarcadas.</p>'
    + NFS.map(function(n){ return '<label class="li chk"><input type="checkbox" data-nfsid="' + esc(n.id) + '"' + (NFSSEL[n.id] ? ' checked' : '') + '><div class="q"><div class="nome" style="font-weight:500">' + esc(n.patient_nome) + '</div><div class="sub">' + dm(n.data_pagamento) + ' · ' + esc(n.servico_nome || '') + (n.prazo_status && n.prazo_status !== 'normal' ? ' · <b style="color:var(--verm)">fora do prazo</b>' : '') + (n.dados_completos === false ? ' · <b style="color:var(--amb)">cadastro incompleto</b>' : '') + '</div></div><div class="vl din">' + brl(n.valor_bruto) + '</div></label>'; }).join('')
    + '<div class="tot"><span>' + sel.length + ' notas</span><span class="din">' + brl(tot) + '</span></div>'
    + '<div class="acoes"><button class="pri" data-nfsmail' + (sel.length ? '' : ' disabled') + '>Montar o e-mail</button><button data-nfsmarca' + (sel.length ? '' : ' disabled') + '>Marcar como pedidas</button></div>'
    + '<div class="meta" style="margin-top:8px">"Montar o e-mail" abre o Mail com o pedido pronto; escolha a Malgo como destinatário e envie. Depois toque em "Marcar como pedidas".</div>');
}
function textoPedido(l){
  var hoje = new Date().toLocaleDateString('pt-BR'), eq = [];
  l.forEach(function(n, i){ if(n.equiparacao_hospitalar) eq.push('Item ' + String(i + 1).padStart(2,'0')); });
  var L = ['Olá, tudo bem?', '', 'Encaminho as solicitações para emissão das notas fiscais médicas, conforme dados detalhados abaixo em cada solicitação.', ''];
  if(eq.length){ L.push('Peço atenção especial às descrições dos serviços: ' + (eq.length === 1 ? 'a nota referente ao ' + eq[0] : 'as notas referentes aos ' + eq.join(', ')) + ' ' + (eq.length === 1 ? 'refere-se a procedimento médico terapêutico' : 'referem-se a procedimentos médicos terapêuticos') + ' com possibilidade de enquadramento em equiparação hospitalar. Fico à disposição caso entendam necessário algum ajuste ou validação adicional.'); L.push(''); }
  L.push('Solicitação de notas fiscais, ' + hoje);
  L.push('Total: ' + l.length + (l.length === 1 ? ' nota' : ' notas') + ' | Valor total: ' + moeda(l.reduce(function(s, n){ return s + Number(n.valor_bruto); }, 0)));
  L.push('');
  l.forEach(function(n, i){
    var outro = n.tomador_tipo === 'pj_outro' || n.tomador_tipo === 'responsavel';
    L.push('Item ' + String(i + 1).padStart(2,'0')); L.push('SOLICITAÇÃO DE EMISSÃO DE NOTA FISCAL'); L.push(''); L.push('Dados do Tomador (Cliente):');
    if(outro){
      L.push('Nome ou Razão Social: ' + (n.tomador_nome || '___'));
      L.push((String(n.tomador_documento || '').replace(/\D/g,'').length === 14 ? 'CNPJ' : 'CPF') + ': ' + (docFmt(n.tomador_documento) || '___'));
      if(n.tomador_ie) L.push('Inscrição Estadual: ' + n.tomador_ie);
      if(n.tomador_im) L.push('Inscrição Municipal: ' + n.tomador_im);
    } else {
      L.push('Nome ou Razão Social: ' + (n.patient_nome || '___'));
      L.push('CPF: ' + (fmtCPF(n.patient_cpf) || '___'));
    }
    L.push('Endereço completo com CEP: ' + (n.endereco_completo_str || '___'));
    L.push('E-mail para envio da nota: ' + (n.email_destinatario || '___'));
    L.push(''); L.push('Dados do Serviço:');
    L.push('Descrição detalhada do procedimento: ' + n.descricao_nfse);
    L.push('Local da prestação do serviço, cidade e estado: São Paulo, SP');
    L.push('Valor total ou unitário do serviço: ' + moeda(n.valor_bruto));
    var ob = [];
    if(outro && n.patient_nome) ob.push('Atendimento referente ao paciente ' + n.patient_nome + (n.patient_cpf ? ', CPF ' + fmtCPF(n.patient_cpf) : '') + '.');
    if(n.nfse_observacao) ob.push(n.nfse_observacao);
    if(n.equiparacao_hospitalar) ob.push('Atenção: procedimento com possibilidade de enquadramento em equiparação hospitalar.');
    L.push('Observações adicionais, se houver: ' + (ob.join(' ') || 'Não há.'));
    L.push(''); L.push('───────────────────────────────────────────'); L.push('');
  });
  return L.join('\n');
}

/* ── 12. GRAVAR CONSULTA PELO IPHONE ─────────────────────────────────── */
/* O audio NAO vai para o banco nem para servidor nenhum: o iPhone grava, e o
   arquivo e salvo pelo "Salvar em Arquivos" do iPhone na pasta
   HAG_Consultas/_gravacoes_iphone do iCloud. O Mac (hag_mac_pedidos.py) tira o
   arquivo do iCloud, transcreve no whisper local pelo servico da Escuta e deixa
   a gravacao pronta no motor do paciente, para "Parar e preencher". */
var REC = null;
function gravar(pid, nome){
  ESCOLHIDO = pid ? { id: pid, nome: nome } : (ESCOLHIDO || null);
  if(REC && REC.mr && REC.mr.state !== 'inactive'){ pintaGrav(); return; }
  REC = { blob: null, ini: 0, dur: 0, ok: false };
  pintaGrav();
}
function pintaGrav(){
  var ativo = REC && REC.mr && REC.mr.state === 'recording', pausado = REC && REC.mr && REC.mr.state === 'paused';
  var h = '<div class="campo"><label>Paciente</label><button type="button" class="escolhe" data-escolher="grava"' + (ativo || pausado ? ' disabled' : '') + '>' + (ESCOLHIDO ? esc(ESCOLHIDO.nome) : 'Escolher paciente') + '</button></div>';
  if(!ativo && !pausado && !(REC && REC.blob)){
    h += '<div class="msg">Peça a autorização: "Posso gravar a consulta para o meu registro? O áudio não fica guardado; uso só para escrever o prontuário."</div>'
      + '<div class="campo"><label><input type="checkbox" id="gAut"' + (REC && REC.ok ? ' checked' : '') + '> O paciente autorizou a gravação</label></div>'
      + '<div class="acoes"><button class="pri rec" data-grav-ini>● Começar a gravar</button></div>'
      + '<div class="meta" style="margin-top:8px">Deixe o app aberto e a tela ligada durante a consulta. Se o iPhone travar a tela, a gravação para.</div>';
  } else if(ativo || pausado){
    h += '<div class="relogio" id="gRel">' + mmss(tempoGrav()) + '</div><div class="meta" style="text-align:center">' + (ativo ? 'Gravando' : 'Pausado') + '</div>'
      + '<div class="acoes" style="justify-content:center"><button data-grav-pausa>' + (ativo ? 'Pausar' : 'Continuar') + '</button><button class="pri" data-grav-fim>Parar</button></div>';
  } else {
    h += '<div class="msg">Gravação pronta: ' + mmss(REC.dur) + '. Salve no iCloud para o Mac transcrever.</div>'
      + '<div class="acoes"><button class="pri" data-grav-salva>Salvar no iCloud</button><button data-grav-descarta>Descartar</button></div>'
      + '<div class="meta" style="margin-top:8px">Na janela que abre, toque em <b>Salvar em Arquivos</b> e escolha <b>iCloud Drive › Profissional › HAG_Consultas › _gravacoes_iphone</b> (o iPhone lembra a pasta). Em até 2 minutos o Mac transcreve e a gravação aparece no motor deste paciente, pronta para "Parar e preencher".</div>';
  }
  folha('Gravar consulta', h);
}
function mmss(s){ s = Math.max(0, Math.round(s || 0)); var m = Math.floor(s / 60), x = s % 60; return m + ':' + (x < 10 ? '0' : '') + x; }
function tempoGrav(){ return REC ? REC.dur + (REC.ini ? (Date.now() - REC.ini) / 1000 : 0) : 0; }
function gravIni(){
  if(!ESCOLHIDO){ aviso('Escolha o paciente', true); return; }
  if(!document.getElementById('gAut').checked){ aviso('Só grava com a autorização do paciente', true); return; }
  if(!navigator.mediaDevices || !window.MediaRecorder){ aviso('Este aparelho não grava pelo navegador', true); return; }
  REC.ok = true;
  navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: false, noiseSuppression: true } }).then(function(st){
    var tipo = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'].filter(function(t){ return MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t); })[0] || '';
    var mr = new MediaRecorder(st, tipo ? { mimeType: tipo, audioBitsPerSecond: 48000 } : undefined);
    REC.mr = mr; REC.st = st; REC.partes = []; REC.tipo = mr.mimeType || tipo || 'audio/mp4'; REC.inicio = new Date(); REC.ini = Date.now(); REC.dur = 0;
    mr.ondataavailable = function(e){ if(e.data && e.data.size) REC.partes.push(e.data); };
    mr.onstop = function(){ REC.blob = new Blob(REC.partes, { type: REC.tipo }); try{ REC.st.getTracks().forEach(function(t){ t.stop(); }); }catch(x){} soltaTela(); pintaGrav(); };
    mr.start(10000);
    prendeTela();
    REC.timer = setInterval(function(){ var r = document.getElementById('gRel'); if(r) r.textContent = mmss(tempoGrav()); }, 1000);
    pintaGrav();
  }).catch(function(e){ aviso('Microfone não liberado: ' + e.message, true); });
}
function gravPausa(){
  if(!REC || !REC.mr) return;
  if(REC.mr.state === 'recording'){ REC.mr.pause(); REC.dur += (Date.now() - REC.ini) / 1000; REC.ini = 0; }
  else if(REC.mr.state === 'paused'){ REC.mr.resume(); REC.ini = Date.now(); }
  pintaGrav();
}
function gravFim(){
  if(!REC || !REC.mr) return;
  if(REC.ini){ REC.dur += (Date.now() - REC.ini) / 1000; REC.ini = 0; }
  clearInterval(REC.timer);
  REC.mr.stop();
}
function nomeArquivo(){
  var d = REC.inicio || new Date(), p = function(n){ return String(n).padStart(2, '0'); };
  var ext = /webm/.test(REC.tipo) ? 'webm' : 'm4a';
  return 'HAGREC_' + ESCOLHIDO.id + '_' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + '_aut_' + Math.round(REC.dur) + 's.' + ext;
}
function gravSalva(){
  if(!REC || !REC.blob || !ESCOLHIDO) return;
  var f = new File([REC.blob], nomeArquivo(), { type: REC.tipo });
  if(navigator.canShare && navigator.canShare({ files: [f] })){
    navigator.share({ files: [f], title: 'Gravação da consulta' }).then(function(){ aviso('Salvo. O Mac transcreve em até 2 minutos.'); REC = null; fechaFolha(); })
      .catch(function(e){ if(e && e.name === 'AbortError') return; aviso('Não salvou: ' + e.message, true); });
  } else {
    var a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
    aviso('Baixado. Mova o arquivo para a pasta _gravacoes_iphone do HAG_Consultas.');
  }
}
var TRAVA = null;
function prendeTela(){ try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').then(function(t){ TRAVA = t; }).catch(function(){}); }catch(e){} }
function soltaTela(){ try{ if(TRAVA) TRAVA.release(); }catch(e){} TRAVA = null; }
