/* HAG_COZINHA_v1 · núcleo sem tela: leitor do Plano Alimentar, conta de porções, receita na medida, doce, resumo do médico.
   Função pura, testada fora da página. Nenhuma chamada de rede e nenhuma IA aqui. */
var HC=(function(){
"use strict";
const norm=s=>String(s==null?"":s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
const FR={"½":.5,"¼":.25,"¾":.75};
function num(v){ if(v==null) return 0; if(typeof v==="number") return isFinite(v)?v:0; v=String(v).trim();
  if(!v||/^[—–-]$/.test(v)||/livre|vontade/i.test(v)) return 0;
  const m=v.match(/^(\d+)?\s*([½¼¾])$/); if(m) return (+(m[1]||0))+FR[m[2]];
  const x=parseFloat(v.replace(",",".")); return isFinite(x)?x:0; }
const fmt=x=>{ x=Math.round(x*100)/100; return String(x).replace(".",","); };
const GR=["p","c","f","g"], SIG={p:"P",c:"C",f:"F",g:"G"}, NOME={p:"proteína",c:"carboidrato",f:"fruta",g:"gordura"}, NOMES={p:"proteínas",c:"carboidratos",f:"frutas",g:"gorduras"};
const codigo=r=>GR.filter(k=>num(r[k])>0).map(k=>fmt(num(r[k]))+SIG[k]).join(" ")+(r.v?" · vegetais livres":"");
const porcoes=(n,k)=>fmt(n)+" "+(n===1?"porção":"porções")+" de "+NOME[k];

/* ---------- leitor do texto do Plano Alimentar (pdftotext) ---------- */
const VAL=/^(—|–|-|livre|\d+(,\d+)?|\d*\s?[½¼¾])$/i;
const RODAPE=/·\s*PLANO ALIMENTAR\s*$|^MÉTODO HAG\s*·|TABELA DE PORÇÕES\s*·\s*\d|^\[RODAPE\]/i;
const REF_NOME=/^(caf[eé] da manh[aã]|almo[cç]o|lanche|jantar|ceia|ao acordar|antes de dormir|pr[eé][- ]treino|p[oó]s[- ]treino|desjejum|cola[cç][aã]o)/i;
function lerGrade(texto){
  const tk=texto.split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean);
  let i=tk.findIndex((t,k)=>/^REFEIÇÃO$/i.test(t)&&tk.slice(k+1,k+7).some(x=>/^P PROTEÍNA$/i.test(x)));
  if(i<0) return null;
  while(i<tk.length&&!/VEGETAIS$/i.test(tk[i])) i++;
  i++; const out=[]; let vazio=0;
  for(;i<tk.length&&vazio<14&&out.length<12;){
    const t=tk[i];
    if(/^Total do dia/i.test(t)) break;
    const vs=tk.slice(i+1,i+6);
    if(/[a-zà-ú]/i.test(t)&&!VAL.test(t)&&!/^livre$/i.test(t)&&vs.length===5&&vs.every(x=>VAL.test(x))){
      out.push({nome:t.replace(/\s+/g," "),p:num(vs[0]),c:num(vs[1]),f:num(vs[2]),g:num(vs[3]),v:/livre/i.test(vs[4])}); i+=6; vazio=0;
    } else { i++; vazio++; }
  }
  return out.length?out:null;
}
function lerCabecalhos(texto){
  const ls=texto.split(/\n/).map(s=>s.trim()).filter(Boolean), out=[], vistos={};
  for(let i=0;i<ls.length;i++){
    if(!REF_NOME.test(ls[i])||ls[i].length>40||/[.:]$/.test(ls[i])) continue;
    const r={nome:ls[i],p:0,c:0,f:0,g:0,v:false}; let achou=0;
    for(let j=i+1;j<Math.min(ls.length,i+10);j++){
      const l=ls[j]; if(/^OPÇÃO/i.test(l)||REF_NOME.test(l)) break;
      const m=l.match(/^(\d+(?:,\d+)?|\d*\s?[½¼¾])\s+(prote[ií]na|carboidrato|fruta|gordura)s?$/i);
      if(m){ r[{p:"p",c:"c",f:"f",g:"g"}[norm(m[2])[0]]]=num(m[1]); achou++; }
      else if(/^vegetais [àa] vontade$/i.test(l)) r.v=true;
      else if(/^\d{1,2}\s?H(\d{2})?(\s?[ÀA]S\s?\d{1,2}\s?H(\d{2})?)?/i.test(l)&&!r.hora) r.hora=l.split("·")[0].trim().toLowerCase();
    }
    if(achou&&!vistos[norm(r.nome)]){ vistos[norm(r.nome)]=1; out.push(r); }
  }
  return out.length?out:null;
}
function lerTabela(texto,casa){
  const ini=texto.search(/TROQUE DENTRO DO MESMO GRUPO/); if(ini<0) return null;
  let corpo=texto.slice(ini); const fim=corpo.search(/\n\s*DOCES,?\s*\n|NENHUM É PROIBIDO/); if(fim>0) corpo=corpo.slice(0,fim);
  const idx={}; (casa||[]).forEach(a=>{ idx[norm(a.nome)]=a.grupo; });
  const ls=corpo.split(/\n/).map(s=>s.trim()).filter(Boolean), tab=[], defs={}, HDR={PROTEINAS:"P",CARBOIDRATOS:"C",FRUTAS:"F",GORDURAS:"G"};
  let cur=null, prev=null;
  const ehNome=l=>l.length<60&&!/[.]$/.test(l)&&!/^[A-Z]$/.test(l)&&!RODAPE.test(l)&&!/^(ALIMENTO|QUANTIDADE|MEDIDA CASEIRA)$/i.test(l)&&!/1 por[cç][aã]o =/i.test(l);
  for(let i=0;i<ls.length;i++){
    const l=ls[i], h=l.match(/^(PROTEÍNAS|CARBOIDRATOS|FRUTAS|GORDURAS)\b/);
    if(h){ cur=HDR[norm(h[1]).toUpperCase()]; prev=null; }
    const d=l.match(/1 por[cç][aã]o = (\d+(?:,\d+)?) g de (prote[ií]na|carboidrato|gordura)/i);
    if(d&&cur){ defs[cur.toLowerCase()]=num(d[1]); continue; }
    if(h) continue;
    const g=l.match(/^(\d+(?:,\d+)?)\s?g(?![a-zà-ú])\s*(.*)$/i)||l.match(/^(\d+(?:,\d+)?) g([a-zà-ú].*)$/i), rot=l.match(/^ver rótulo\s*(.*)$/i);
    if((g||rot)&&prev&&!/[.]$/.test(l)&&!(g&&/^,/.test(g[2]))){
      let med=(g?g[2]:rot[1]).trim();
      if(!med&&ls[i+1]&&!/^(\d+(?:,\d+)?)\s?g\b/i.test(ls[i+1])&&!/^(PROTEÍNAS|CARBOIDRATOS|FRUTAS|GORDURAS)\b/.test(ls[i+1])&&!RODAPE.test(ls[i+1])){ med=ls[i+1]; i++; }
      const k=idx[norm(prev)], grupo=k&&k!=="X"?k:cur;
      if(grupo) tab.push({g:grupo,nome:prev,gramas:g?num(g[1]):null,medida:med,duvida:!k});
      prev=null; continue;
    }
    if(ehNome(l)) prev=l;
  }
  const notas=corpo.split(/\n\s*\n/).map(b=>b.replace(/\s*\n\s*/g," ").trim()).filter(b=>b.length>60&&/^(Feijão|Vegetais|Uma concha|Alface|Cenoura)/.test(b));
  if(notas.some(n=>/110 g[^.]*meia\s+porção de proteína e meia de\s+carboidrato/i.test(n))&&!/não gosta do grão/i.test(notas.join(" ")))
    tab.push({g:"X",nome:"Feijão cozido",gramas:110,medida:"1 concha média",vale:{p:.5,c:.5}});
  return tab.length?{tabela:tab,defs,notas}:null;
}
function lerPlano(texto,casa){
  const avisos=[]; texto=String(texto||"");
  let refs=lerGrade(texto);
  if(!refs){ refs=lerCabecalhos(texto); if(refs) avisos.push("Este plano não tem a grade de porções. As refeições foram lidas dos cabeçalhos: confira uma a uma."); }
  if(!refs){ refs=[]; avisos.push("Não encontrei as refeições em porções neste documento. Preencha a grade à mão."); }
  const t=lerTabela(texto,casa);
  if(!t) avisos.push("Não encontrei a tabela de porções neste documento. Use a tabela da casa e ajuste.");
  else { const d=t.tabela.filter(x=>x.duvida).length; if(d) avisos.push(d+(d===1?" alimento não está":" alimentos não estão")+" na tabela da casa: confira o grupo (marcados em amarelo)."); }
  const defs=Object.assign({p:10,c:15,f:15,g:8},t?t.defs:{});
  return {refeicoes:refs,tabela:t?t.tabela:[],defs,notas:t?t.notas:[],avisos};
}

/* ---------- conta de porções ---------- */
function slotDe(nome){ const n=norm(nome); if(/cafe|desjejum|acordar/.test(n)) return "cafe"; if(/almoco/.test(n)) return "almoco"; if(/jantar/.test(n)) return "jantar"; if(/ceia|dormir/.test(n)) return "ceia"; return "lanche"; }
/* meta da refeição hoje = plano menos o que um doce já descontou */
function metaHoje(plano,idx,eventos){ const r=plano.refeicoes[idx], m={p:num(r.p),c:num(r.c),f:num(r.f),g:num(r.g),v:!!r.v};
  ajustesDoces(eventos).forEach(a=>{ if(a.idx===idx){ m.c=Math.max(0,m.c-a.c); m.g=Math.max(0,m.g-a.g); } }); return m; }
function ajustesDoces(eventos){ const desf={}, out=[]; (eventos||[]).forEach(e=>{ if(e.tipo==="doce_desfeito") desf[e.chave]=1; });
  (eventos||[]).forEach(e=>{ if(e.tipo==="doce"&&!desf[e.cid]&&e.detalhe) (e.detalhe.ajustes||[]).forEach(a=>out.push({idx:a.idx,c:num(a.c),g:num(a.g),doce:e.chave})); }); return out; }
const docesHoje=ev=>{ const desf={}; (ev||[]).forEach(e=>{ if(e.tipo==="doce_desfeito") desf[e.chave]=1; }); return (ev||[]).filter(e=>e.tipo==="doce"&&!desf[e.cid]); };
function gramas(item,por){ return item&&item.gramas!=null?Math.round(num(item.gramas)*por):null; }
function acharAlimento(tabela,nome,grupo){ const n=norm(nome); let a=tabela.find(x=>norm(x.nome)===n);
  if(!a&&/whey|proteina em po/.test(n)) a=tabela.find(x=>x.g==="P"&&/whey|proteina em po/.test(norm(x.nome)));
  return a||null; }
/* prato montado: escolhas = [{nome, por}] ; devolve o que falta por grupo */
function contaPrato(meta,tabela,escolhas){ const tem={p:0,c:0,f:0,g:0};
  (escolhas||[]).forEach(e=>{ const a=acharAlimento(tabela,e.nome); if(!a) return;
    if(a.g==="X"){ const v=a.vale||{}; GR.forEach(k=>{ tem[k]+=num(v[k])*e.por; }); } else tem[a.g.toLowerCase()]+=e.por; });
  const falta={}, sobra={}; let fechado=true, algum=false;
  GR.forEach(k=>{ const d=Math.round((meta[k]-tem[k])*100)/100; if(d>0.01){ falta[k]=d; fechado=false; } else if(d<-0.01) sobra[k]=-d; if(tem[k]>0) algum=true; });
  return {tem,falta,sobra,fechado,algum}; }
/* receita na medida da refeição: cada grupo da receita é escalado para as porções que a refeição pede */
function receitaPara(rec,meta,tabela,regras,naoGosta){
  regras=regras||{}; const mn=regras.escala_min||.5, mx=regras.escala_max||2, soma={p:0,c:0,f:0,g:0}, ng=(naoGosta||[]).map(norm);
  const ing=(rec.ing||[]).map(i=>({alimento:i.alimento,k:String(i.grupo||"").toLowerCase(),por:num(i.por),item:acharAlimento(tabela,i.alimento)}));
  const semItem=ing.find(i=>!i.item); if(semItem) return {serve:"fora",motivo:"usa "+semItem.alimento.toLowerCase()+", que não está na sua tabela"};
  const ruim=ing.find(i=>ng.includes(norm(i.item.nome))); if(ruim) return {serve:"fora",motivo:"usa "+ruim.item.nome.toLowerCase()+", que você marcou como fora"};
  ing.forEach(i=>{ soma[i.k]+=i.por; });
  if(!soma.p||!meta.p) return {serve:"nao",motivo:meta.p?"a receita não tem proteína":"esta refeição não tem proteína no plano"};
  const linhas=[], avisos=[], fator={};
  for(const k of GR){ if(!soma[k]) continue;
    if(!meta[k]){ avisos.push("faça sem "+ing.filter(i=>i.k===k).map(i=>i.item.nome.toLowerCase()).join(" e ")+": esta refeição não tem "+NOME[k]); fator[k]=0; continue; }
    fator[k]=meta[k]/soma[k];
    if(fator[k]<mn-1e-9||fator[k]>mx+1e-9) return {serve:"nao",motivo:"a receita não fecha na medida desta refeição ("+NOME[k]+")"}; }
  ing.forEach(i=>{ if(!fator[i.k]) return; const por=Math.round(i.por*fator[i.k]*100)/100; linhas.push({nome:i.item.nome,k:i.k,por,gramas:gramas(i.item,por),medida:i.item.medida,rotulo:i.item.gramas==null}); });
  GR.forEach(k=>{ if(meta[k]>0&&!soma[k]) avisos.push((k==="f"?"a fruta":"o "+NOME[k])+" da refeição fica à parte: "+porcoes(meta[k],k)); });
  return {serve:avisos.length?"ajuste":"ok",linhas,avisos};
}
/* doce: de onde sai o C e o G. Tira das refeições ainda não feitas, da última para a primeira. */
function encaixarDoce(doce,plano,eventos,feitas){
  let c=num(doce.c), g=num(doce.g); const aj=[];
  if(!c&&!g) return {ok:true,livre:true,ajustes:[]};
  for(let i=plano.refeicoes.length-1;i>=0&&(c>0||g>0);i--){ if(feitas&&feitas[i]) continue; const m=metaHoje(plano,i,eventos);
    const tc=Math.min(c,m.c), tg=Math.min(g,m.g); if(tc>0||tg>0){ aj.push({idx:i,c:tc,g:tg}); c=Math.round((c-tc)*100)/100; g=Math.round((g-tg)*100)/100; } }
  return {ok:c<=0&&g<=0,ajustes:aj,falta:{c,g}}; }

const DS=["domingo","segunda","terça","quarta","quinta","sexta","sábado"];

}

const pega=(o,p)=>p.split(".").reduce((a,k)=>a==null?a:a[k],o);
function poe(o,p,v){ const ks=p.split("."); let a=o; ks.slice(0,-1).forEach(k=>{ a[k]=Object.assign({},a[k]); a=a[k]; }); a[ks[ks.length-1]]=v; }
const LISTAS={
  fora:{tabela:"cozinha_guias",dados:()=>D.guias.filter(g=>g.tipo==="fora"),novo:()=>({tipo:"fora",chave:"fora_"+Date.now(),titulo:"",conteudo:{},ordem:50,aprovado:false,ativo:true}),aprova:true,
    campos:[["titulo","Lugar","text"],["conteudo.melhor","Melhor escolha","area"],["conteudo.boa","Boa escolha","area"],["conteudo.ajuste","Possível com ajuste","area"]]},
  sos:{tabela:"cozinha_guias",dados:()=>D.guias.filter(g=>g.tipo==="sos"),novo:()=>({tipo:"sos",chave:"sos_"+Date.now(),titulo:"",conteudo:{destino:""},ordem:150,aprovado:false,ativo:true}),aprova:true,
    campos:[["titulo","Situação","text"],["conteudo.texto","O que o paciente lê","area"],["conteudo.destino","Para onde leva","sel",[["","só o texto"],["fora","guia de comer fora"],["receitas:rápida","receitas rápidas"],["doces","doces em porções"]]]]},
  doces:{tabela:"cozinha_doces",dados:()=>D.doces,novo:()=>({nome:"",medida:"",c:0,g:0,categoria:"",ordem:99,aprovado:false,ativo:true}),aprova:true,linha:true,
    campos:[["nome","Doce","text"],["medida","Medida","text"],["c","Custa em C","num"],["g","Custa em G","num"],["categoria","Categoria","text"]]},
  casa:{tabela:"cozinha_alimentos",dados:()=>D.casa,novo:()=>({grupo:"P",nome:"",gramas:null,medida:"",lactose:false,ordem:999,ativo:true}),linha:true,
    campos:[["grupo","Grupo","sel",[["P","Proteína"],["C","Carboidrato"],["F","Fruta"],["G","Gordura"],["X","Dois grupos"]]],["nome","Alimento","text"],["gramas","Gramas por porção","num"],["medida","Medida caseira","text"],["lactose","Tem lactose","bool"]]}
};
function campoHTML(it,[p,rot,tipo,op]){ const v=pega(it,p), at=`data-p="${p}" data-t="${tipo}"`;
  if(tipo==="area") return `<div><label class="lbl">${rot}</label><textarea ${at} rows="2">${esc(v||"")}</textarea></div>`;
  if(tipo==="bool") return `<label class="row note" style="gap:5px"><input type="checkbox" ${at} ${v?"checked":""}> ${rot}</label>`;
  if(tipo==="sel") return `<div><label class="lbl">${rot}</label><select ${at}>${op.map(o=>`<option value="${esc(o[0])}" ${String(v||"")===o[0]?"selected":""}>${esc(o[1])}</option>`).join("")}</select></div>`;
  return `<div><label class="lbl">${rot}</label><input ${at} ${tipo==="num"?'inputmode="decimal"':""} value="${esc(tipo==="num"?(v==null?"":fmt(num(v))):(v||""))}"></div>`; }
function listaHTML(chave,titulo,sub){ const L=LISTAS[chave], its=L.dados(), pendN=L.aprova?its.filter(x=>x.ativo&&!x.aprovado).length:0;
  return `<div class="row between"><div><h2>${titulo}</h2><p class="sub">${sub}</p></div><div class="row">${pendN?`<button class="btn small" data-a="aprovartodos" data-l="${chave}">Aprovar os ${pendN} pendentes</button>`:""}<button class="btn small ghost" data-a="novoitem" data-l="${chave}">＋ novo</button></div></div>
    ${its.map((it,i)=>`<div class="item${L.aprova&&!it.aprovado&&it.ativo?" pend":""}" data-l="${chave}" data-id="${esc(it.id||"")}" data-i="${i}" style="${it.ativo?"":"opacity:.55"}">
      <div class="${L.linha?"cols":""}" style="${L.linha?"":"display:flex;flex-direction:column;gap:8px"}">${L.campos.map(c=>campoHTML(it,c)).join("")}</div>
      <div class="row between"><div class="row">${L.aprova?`<label class="row" style="gap:5px"><input type="checkbox" data-p="aprovado" data-t="bool" ${it.aprovado?"checked":""}> aprovado, o paciente vê</label>`:""}<label class="row note" style="gap:5px"><input type="checkbox" data-p="ativo" data-t="bool" ${it.ativo?"checked":""}> ativo</label></div><button class="btn small" data-a="salvaritem">Salvar</button></div></div>`).join("")||`<p class="note">Nada aqui ainda.</p>`}`; }
function lerItem(el){ const L=LISTAS[el.dataset.l], base=el.dataset.id?L.dados().find(x=>x.id===el.dataset.id):L.novo(), o=JSON.parse(JSON.stringify(base));
  el.querySelectorAll("[data-p]").forEach(c=>{ const t=c.dataset.t; poe(o,c.dataset.p,t==="bool"?c.checked:t==="num"?(c.value.trim()===""?null:num(c.value)):c.value.trim()); }); return o; }

/* ---------- receitas ---------- */
const SLOTS=[["cafe","café da manhã"],["almoco","almoço"],["lanche","lanche"],["jantar","jantar"],["ceia","ceia"]];
function receitaVetor(r){ const v={p:0,c:0,f:0,g:0}; (r.ingredientes||[]).forEach(i=>{ v[String(i.grupo).toLowerCase()]+=num(i.por); }); return HC.codigo(v); }
function recEditorHTML(){ const r=S.recEd;
  return `<div class="card" id="receditor"><div class="row between"><h3>${r.id?"Editar receita":"Receita nova"}</h3><button class="link" data-a="fecharrec">fechar sem salvar</button></div>
    <div class="cols" style="margin-top:8px"><div><label class="lbl">Nome</label><input id="rnome" value="${esc(r.nome||"")}"></div><div><label class="lbl">Tempo (min)</label><input id="rtempo" inputmode="numeric" value="${r.tempo_min||""}"></div><div><label class="lbl">Etiquetas (vírgula)</label><input id="rtags" value="${esc((r.tags||[]).join(", "))}"></div></div>
    <div class="row" style="margin-top:8px">${SLOTS.map(s=>`<label class="row note" style="gap:4px"><input type="checkbox" data-slot="${s[0]}" ${(r.slots||[]).includes(s[0])?"checked":""}> ${s[1]}</label>`).join("")}</div>
    <label class="lbl" style="margin-top:10px">Por que esta receita (uma frase para o paciente)</label><input id="rporque" value="${esc(r.porque||"")}">
    <label class="lbl" style="margin-top:10px">Ingredientes que contam porção: uma linha cada, no formato  porções | grupo | alimento da tabela da casa</label>
    <textarea id="ring" rows="5" class="mono">${esc((r.ingredientes||[]).map(i=>fmt(num(i.por))+" | "+i.grupo+" | "+i.alimento).join("\n"))}</textarea>
    <p class="note" style="margin:4px 0 0">O paciente não vê estas porções: o app recalcula cada grupo para a refeição dele e mostra os gramas da tabela dele.</p>
    <div class="cols" style="margin-top:10px"><div><label class="lbl">Livres e temperos (um por linha)</label><textarea id="rlivres" rows="3">${esc((r.livres||[]).join("\n"))}</textarea></div><div><label class="lbl">Preparo (um passo por linha)</label><textarea id="rprep" rows="3">${esc((r.preparo||[]).join("\n"))}</textarea></div></div>
    <label class="lbl" style="margin-top:10px">Como guardar</label><input id="rcons" value="${esc(r.conservacao||"")}">
    <div class="row between" style="margin-top:12px"><div class="row"><label class="row" style="gap:5px"><input type="checkbox" id="raprov" ${r.aprovado?"checked":""}> aprovada, o paciente vê</label><label class="row note" style="gap:5px"><input type="checkbox" id="rativo" ${r.ativo!==false?"checked":""}> ativa</label></div><button class="btn" data-a="salvarrec">Salvar receita</button></div></div>`; }
function lerReceita(){ const g=id=>document.getElementById(id), linhas=s=>s.split("\n").map(x=>x.trim()).filter(Boolean), er=[];
  const ing=linhas(g("ring").value).map(l=>{ const a=l.split("|").map(x=>x.trim()); const o={alimento:a.slice(2).join("|"),grupo:(a[1]||"").toUpperCase(),por:num(a[0])};
    if(!o.por||!"PCFG".includes(o.grupo)||o.grupo.length!==1||!o.alimento) er.push("Linha de ingrediente fora do formato: "+l); else if(!D.casa.some(c=>HC.norm(c.nome)===HC.norm(o.alimento))) er.push("\""+o.alimento+"\" não está na tabela da casa."); return o; });
  const r={nome:g("rnome").value.trim(),tempo_min:Math.round(num(g("rtempo").value))||null,tags:g("rtags").value.split(",").map(x=>x.trim()).filter(Boolean),slots:[...document.querySelectorAll("[data-slot]")].filter(c=>c.checked).map(c=>c.dataset.slot),
    porque:g("rporque").value.trim(),ingredientes:ing,livres:linhas(g("rlivres").value),preparo:linhas(g("rprep").value),conservacao:g("rcons").value.trim(),aprovado:g("raprov").checked,ativo:g("rativo").checked,atualizado_em:new Date().toISOString()};
  if(!r.nome) er.push("Falta o nome."); if(!ing.some(i=>i.grupo==="P")) er.push("A receita precisa de pelo menos um ingrediente de proteína."); if(!r.slots.length) er.push("Marque em qual refeição ela entra.");
  return {r,er}; }
function renderRec(){ const pn=pend().rec;
  main.innerHTML=`${flash()}<div class="row between"><div><h2>Receitas</h2><p class="sub">Escritas em porções. O paciente só vê as aprovadas, já recalculadas para a refeição e a tabela dele.</p></div><div class="row">${pn?`<button class="btn small" data-a="aprovarrecs">Aprovar as ${pn} pendentes</button>`:""}<button class="btn small ghost" data-a="novarec">＋ nova</button></div></div>
    ${S.recEd?recEditorHTML():""}
    ${D.receitas.map(r=>`<div class="item${r.ativo&&!r.aprovado?" pend":""}" style="${r.ativo?"":"opacity:.55"}"><div class="row between"><div><b>${esc(r.nome)}</b> <span class="mono">${esc(receitaVetor(r))}</span><div class="note">${(r.slots||[]).map(s=>(SLOTS.find(x=>x[0]===s)||[0,s])[1]).join(", ")}${r.tempo_min?" · "+r.tempo_min+" min":""}${(r.tags||[]).length?" · "+r.tags.map(esc).join(", "):""}</div></div>
      <div class="row"><span class="tag ${r.aprovado?"g":"y"}">${r.aprovado?"aprovada":"a aprovar"}</span><button class="btn small ghost" data-a="editarrec" data-v="${esc(r.id)}">Abrir</button>${r.aprovado?"":`<button class="btn small" data-a="aprovarrec" data-v="${esc(r.id)}">Aprovar</button>`}</div></div></div>`).join("")}`; }
function renderRegras(){ const R=D.regras;
  main.innerHTML=`${flash()}<div><h2>Regras em vigor</h2><p class="sub">Tudo o que o app decide sozinho está aqui, e é conta. Nada é liberado por fora do plano, da tabela e das receitas que você aprovou.</p></div>
    <div class="card"><div class="cols">
      <div><label class="lbl">Receita: menor escala por grupo</label><input id="g_min" inputmode="decimal" value="${fmt(num(R.escala_min||.5))}"><p class="note" style="margin:4px 0 0">Abaixo disso a receita não é oferecida para a refeição.</p></div>
      <div><label class="lbl">Receita: maior escala por grupo</label><input id="g_max" inputmode="decimal" value="${fmt(num(R.escala_max||2))}"><p class="note" style="margin:4px 0 0">Ex.: receita de 2 porções de proteína serve refeições de 1 a 4.</p></div>
    </div>
    <div class="row" style="margin-top:12px"><label class="row" style="gap:6px"><input type="checkbox" id="g_sac" ${R.perguntar_saciedade!==false?"checked":""}> perguntar como ficou depois de comer (opcional para o paciente)</label></div>
    <div class="row" style="margin-top:6px"><label class="row" style="gap:6px"><input type="checkbox" id="g_doce" ${R.perguntar_doce!==false?"checked":""}> perguntar da vontade de doce depois do jantar e da ceia</label></div>
    <button class="btn" data-a="salvarregras" style="margin-top:12px">Salvar</button></div>
    <div class="card"><h3>O que é fixo, por desenho</h3><ul class="hist">
      <li><b>Prato montado:</b> o paciente só soma porções de alimentos da tabela do plano dele, até o que a refeição pede. O app multiplica os gramas, não estima nada.</li>
      <li><b>Receita:</b> cada grupo é recalculado para as porções da refeição. Ingrediente fora da tabela do paciente esconde a receita para ele.</li>
      <li><b>Doce:</b> só para quem você ligou no plano. Sai do carboidrato e da gordura de uma refeição do mesmo dia, da última para a primeira. Proteína e fruta nunca entram.</li>

      <li><b>IA:</b> nenhuma. Nenhuma chamada paga.</li></ul></div>`; }
function render(){
  renderTabs();
  if(S.aba==="pac") return renderPac();
  if(S.aba==="rec") return renderRec();
  if(S.aba==="regras") return renderRegras();
  if(S.aba==="guias") return void(main.innerHTML=flash()+listaHTML("sos","Não consigo seguir o plano agora","As saídas que o paciente vê quando aperta o botão. Escritas por você, uma vez.")+`<div style="height:10px"></div>`+listaHTML("fora","Comer fora","Três saídas por tipo de lugar."));
  if(S.aba==="doces") return void(main.innerHTML=flash()+listaHTML("doces","Doces em porções","Quanto cada doce custa em carboidrato e gordura. Só aparece para o paciente que tem doces ligados no plano."));
  if(S.aba==="casa") return void(main.innerHTML=flash()+listaHTML("casa","Tabela de porções da casa","A tabela-mãe. Serve para reconhecer os alimentos na leitura do PDF, para as receitas e para o plano preenchido à mão. A tabela de cada paciente é a do plano dele."));
}

  if(a==="copiar"){ const txt=v==="msg"?mensagemDaniela():S.link; (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>{ S.msg=v==="msg"?"Mensagem copiada. Ela sai da Daniela.":"Link copiado."; S.erro=null; render(); }).catch(()=>{ S.erro="O navegador não deixou copiar. Selecione o texto e copie à mão."; render(); }); return; }
  if(a==="novoitem"){ const L=LISTAS[b.dataset.l], it=L.novo(); if(L.tabela==="cozinha_guias") D.guias.unshift(it); else if(L.tabela==="cozinha_doces") D.doces.unshift(it); else D.casa.unshift(it); return render(); }
  if(a==="salvaritem"){ const el=b.closest(".item"), L=LISTAS[el.dataset.l], o=lerItem(el); const nomeK=L.campos.find(c=>c[0]==="nome"||c[0]==="titulo")[0];
    if(!pega(o,nomeK)){ S.erro="Falta o nome."; return render(); }
    return tentar(async()=>{ const id=o.id; delete o.id; o.atualizado_em=new Date().toISOString(); if(id) await api(L.tabela+'?id=eq.'+id,{method:'PATCH',body:o}); else await api(L.tabela,{method:'POST',body:o}); await carregarBase(); S.msg="Salvo."; }); }
  if(a==="aprovartodos"){ const L=LISTAS[b.dataset.l], tipo=b.dataset.l; return tentar(async()=>{ await api(L.tabela+'?aprovado=eq.false&ativo=eq.true'+(L.tabela==="cozinha_guias"?'&tipo=eq.'+tipo:''),{method:'PATCH',body:{aprovado:true,atualizado_em:new Date().toISOString()}}); await carregarBase(); S.msg="Aprovados. O paciente passa a ver."; }); }
  if(a==="novarec"){ S.recEd={slots:[],tags:[],ingredientes:[],livres:[],preparo:[],ativo:true,aprovado:false}; return render(); }
  if(a==="editarrec"){ S.recEd=JSON.parse(JSON.stringify(D.receitas.find(r=>r.id===v))); render(); return window.scrollTo(0,0); }
  if(a==="fecharrec"){ S.recEd=null; return render(); }
  if(a==="salvarrec"){ const {r,er}=lerReceita(); if(er.length){ S.erro=er.join(" "); S.msg=null; S.recEd=Object.assign(S.recEd,r); return render(); }
    return tentar(async()=>{ if(S.recEd.id) await api('cozinha_receitas?id=eq.'+S.recEd.id,{method:'PATCH',body:r}); else await api('cozinha_receitas',{method:'POST',body:r}); S.recEd=null; await carregarBase(); S.msg="Receita salva."; }); }
  if(a==="aprovarrec") return tentar(async()=>{ await api('cozinha_receitas?id=eq.'+v,{method:'PATCH',body:{aprovado:true,atualizado_em:new Date().toISOString()}}); await carregarBase(); });
  if(a==="aprovarrecs") return tentar(async()=>{ await api('cozinha_receitas?aprovado=eq.false&ativo=eq.true',{method:'PATCH',body:{aprovado:true,atualizado_em:new Date().toISOString()}}); await carregarBase(); S.msg="Receitas aprovadas. O paciente passa a ver."; });
  if(a==="salvarregras"){ const g=id=>document.getElementById(id), R=Object.assign({},D.regras,{escala_min:num(g("g_min").value)||.5,escala_max:num(g("g_max").value)||2,perguntar_saciedade:g("g_sac").checked,perguntar_doce:g("g_doce").checked});
    return tentar(async()=>{ await api('cozinha_config?id=eq.1',{method:'PATCH',body:{regras:R,atualizado_em:new Date().toISOString()}}); D.regras=R; S.msg="Regras salvas."; }); }
});
async function boot(){
  for(let k=0;k<8 && !(Auth.valid&&Auth.valid());k++) await new Promise(r=>setTimeout(r,400));
  if(!(Auth.valid&&Auth.valid())){ main.innerHTML=`<div class="card"><h3>Acesso restrito à equipe</h3><p class="note">Faça login para abrir o painel. Se a tela de login não apareceu, recarregue a página.</p></div>`; return; }
  try{ await carregarBase(); const p=new URLSearchParams(location.search).get("p"); render(); if(p&&D.pacientes.some(x=>x.id===p)) await tentar(()=>abrirPaciente(p)); }
  catch(e){ main.innerHTML=`<div class="erro">Não foi possível carregar: ${esc(e.message)}. Se a sessão expirou, recarregue a página e entre de novo.</div>`; } }
boot();
})();
</script>
