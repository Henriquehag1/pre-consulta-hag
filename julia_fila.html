<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Fila de Agendamento · mudou de lugar</title>
<meta name="robots" content="noindex">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#1e2233;color:#f7f5f0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;padding:24px}
  .cx{max-width:420px;text-align:center}
  .k{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#b8922a;font-weight:700;margin-bottom:14px}
  h1{font-size:24px;line-height:1.2;margin:0 0 12px;font-weight:600}
  p{font-size:15px;line-height:1.5;color:#c9c5bc;margin:0 0 22px}
  a{display:inline-block;background:#b8922a;color:#fff;text-decoration:none;border-radius:8px;
    padding:13px 26px;font-weight:600;font-size:15px}
</style>
</head>
<body>
<div class="cx">
  <div class="k">Método HAG</div>
  <h1>A fila agora vive dentro do Tarefas</h1>
  <p>Esta página saiu do ar. Tudo o que ficava aqui, mais a busca de paciente e o remarcar,
     está no aplicativo de Tarefas. Você vai ser levado para lá.</p>
  <a href="tarefas_HAG.html" id="ir">Ir para o Tarefas</a>
</div>
<script>
/* HAG_FILA_APOSENTADA_v1 (20/08/2026)
   A fila foi substituida pelo Tarefas. Em vez de devolver 404, que deixaria um
   icone morto na tela de inicio de quem instalou, esta pagina redireciona.
   Tambem remove o service worker antigo, senao ele fica registrado para sempre
   num endereco que nao existe mais. */
(function(){
  'use strict';
  try {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(rs){
        rs.forEach(function(r){ r.unregister(); });
      }).catch(function(){});
    }
  } catch(e){}
  setTimeout(function(){ location.replace('tarefas_HAG.html'); }, 2200);
})();
</script>
</body>
