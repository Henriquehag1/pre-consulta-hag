<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fila HAG">
<title>Fila de Agendamento · HAG</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1B2340; --navy-2:#232C4E; --gold:#8A7B4F; --gold-soft:#B8A76E;
    --bg:#F6F4EF; --surface:#FFFFFF; --line:#E4DFD4; --ink:#23201A; --ink-soft:#5B5647; --ink-faint:#98917F;
    --green:#2D7A45; --green-bg:#EAF4ED; --amber:#8A6D00; --amber-bg:#FBF3DA; --red:#B3261E;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:'Space Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
  .mono{font-family:'IBM Plex Mono',monospace}

  /* ===== LOGIN ===== */
  #login{display:none;min-height:100vh;background:var(--navy);align-items:center;justify-content:center;padding:24px}
  #login.show{display:flex}
  .lg-card{background:#fff;border-radius:18px;padding:30px 26px;width:100%;max-width:360px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
  .lg-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:.6rem;letter-spacing:.18em;color:var(--gold);text-transform:uppercase;margin-bottom:6px}
  .lg-title{font-size:1.5rem;font-weight:700;color:var(--navy);margin-bottom:4px}
  .lg-sub{font-size:.85rem;color:var(--ink-soft);margin-bottom:20px}
  .lg-lbl{font-size:.75rem;font-weight:600;color:var(--ink-soft);margin:12px 0 5px}
  .lg-inp{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;font-size:1rem;font-family:inherit;background:#FAF8F4}
  .lg-btn{width:100%;margin-top:20px;padding:14px;border:none;border-radius:11px;background:var(--gold);color:#fff;font-size:1rem;font-weight:600;font-family:inherit;cursor:pointer}
  .lg-err{margin-top:12px;font-size:.8rem;color:var(--red);display:none}

  /* ===== APP ===== */
  #app{display:none;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 14px 90px}
  #app.show{display:block}
  .hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
  .hdr-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:.58rem;letter-spacing:.16em;color:var(--gold);text-transform:uppercase}
  .hdr-title{font-size:1.45rem;font-weight:700;color:var(--navy);line-height:1.15}
  .hdr-sub{font-size:.78rem;color:var(--ink-faint);margin-top:3px}
  .btn-sair{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;font-size:.75rem;color:var(--ink-soft);font-family:inherit}

  .tabs{display:flex;gap:8px;margin:14px 0}
  .tab{flex:1;padding:11px 6px;text-align:center;border:1px solid var(--line);background:#fff;border-radius:11px;font-size:.85rem;font-weight:600;color:var(--ink-soft);font-family:inherit;cursor:pointer}
  .tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .tab .n{display:block;font-size:1.15rem;font-weight:700}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:16px 15px;margin-bottom:12px;box-shadow:0 2px 10px rgba(35,32,26,.04)}
  .card.atrasada{border-color:#E4C6C3}
  .c-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .c-nome{font-size:1.08rem;font-weight:700;color:var(--navy);line-height:1.2}
  .c-tipo{font-family:'IBM Plex Mono',monospace;font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:20px;background:#EFEBE0;color:var(--gold);white-space:nowrap}
  .c-janela{margin-top:8px;font-size:.85rem;color:var(--ink-soft)}
  .c-janela b{color:var(--ink)}
  .c-janela .late{color:var(--red);font-weight:600}
  .c-obs{margin-top:6px;font-size:.8rem;color:var(--ink-faint)}
  .c-status{margin-top:8px;font-size:.72rem;font-weight:600}
  .c-status.pendente{color:var(--amber)}
  .c-status.andamento{color:#1D4ED8}
  .c-status.concluida{color:var(--green)}
  .c-acts{display:flex;gap:8px;margin-top:13px}
  .act{flex:1;padding:12px 6px;border-radius:11px;border:1px solid var(--line);background:#fff;font-size:.83rem;font-weight:600;font-family:inherit;color:var(--ink-soft);cursor:pointer;text-align:center;text-decoration:none}
  .act.wa{background:var(--green-bg);border-color:#BFDCC8;color:var(--green)}
  .act.ok{background:var(--navy);border-color:var(--navy);color:#fff}
  .act.undo{flex:0 0 auto;padding:12px 14px}
  .empty{padding:60px 20px;text-align:center;color:var(--ink-faint)}
  .empty .big{font-size:2rem;margin-bottom:8px}
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%) translateY(80px);background:var(--navy);color:#fff;padding:12px 22px;border-radius:12px;font-size:.85rem;transition:transform .25s;z-index:60;max-width:90vw;text-align:center}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .foot{margin-top:26px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:.58rem;letter-spacing:.1em;color:var(--ink-faint);text-transform:uppercase}
</style>
</head>
<body>

<div id="login">
  <div class="lg-card">
    <div class="lg-eyebrow">Método HAG</div>
    <div class="lg-title">Fila de Agendamento</div>
    <div class="lg-sub">Acesso restrito à equipe.</div>
    <div class="lg-lbl">E-mail</div>
    <input class="lg-inp" id="lgEmail" type="email" autocomplete="username" inputmode="email">
    <div class="lg-lbl">Senha</div>
    <input class="lg-inp" id="lgSenha" type="password" autocomplete="current-password">
    <button class="lg-btn" id="lgBtn" onclick="entrar()">Entrar</button>
    <div class="lg-err" id="lgErr"></div>
  </div>
</div>

<div id="app">
  <div class="hdr">
    <div>
      <div class="hdr-eyebrow">Método HAG</div>
      <div class="hdr-title">Fila de Agendamento</div>
      <div class="hdr-sub" id="hdrSub">—</div>
    </div>
    <button class="btn-sair" onclick="sair()">Sair</button>
  </div>
  <div class="tabs">
    <button class="tab on" id="tabAbertas" onclick="setTab('abertas')"><span class="n" id="nAbertas">—</span>a agendar</button>
    <button class="tab" id="tabFeitas" onclick="setTab('feitas')"><span class="n" id="nFeitas">—</span>agendadas</button>
  </div>
  <div id="lista"></div>
  <div class="foot">HAG OS · Fila da Julia</div>
</div>

<div class="toast" id="toast"></div>

<script>
var SUPA_URL='https://yutcnphwovqeiwcwzzhs.supabase.co';
var SUPA_KEY='sb_publishable_V-tdeq_qDKLAPYzN2vQuMA_okwPaOPi';
var db=window.supabase.createClient(SUPA_URL,SUPA_KEY);

var STATE={tarefas:[],fones:{},tab:'abertas'};
var TIPO_LABEL={retorno:'Retorno',diagnostica:'Consulta diagnóstica',procedimento:'Procedimento',injetavel:'Injetável',geral:'Agendamento'};
var TIPO_MSG={retorno:'sua consulta de retorno',diagnostica:'sua consulta com o Dr. Henrique',procedimento:'o seu procedimento',injetavel:'a sua aplicação'};

function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2400);}
function firstName(n){return String(n||'').trim().split(/\s+/)[0]||'';}
function norm(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();}
function fmtBR(iso){if(!iso)return '';var p=String(iso).slice(0,10).split('-');return p[2]+'/'+p[1];}
function hojeISO(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

/* ===== AUTH ===== */
async function boot(){
  var s=await db.auth.getSession();
  if(s && s.data && s.data.session){mostrarApp(s.data.session);}else{document.getElementById('login').classList.add('show');}
}
async function entrar(){
  var email=document.getElementById('lgEmail').value.trim();
  var senha=document.getElementById('lgSenha').value;
  var err=document.getElementById('lgErr');
  err.style.display='none';
  if(!email||!senha){err.textContent='Preencha e-mail e senha.';err.style.display='block';return;}
  document.getElementById('lgBtn').textContent='Entrando…';
  var r=await db.auth.signInWithPassword({email:email,password:senha});
  document.getElementById('lgBtn').textContent='Entrar';
  if(r.error){err.textContent='Não foi possível entrar. Confira e-mail e senha.';err.style.display='block';return;}
  mostrarApp(r.data.session);
}
async function sair(){await db.auth.signOut();location.reload();}
function mostrarApp(sess){
  document.getElementById('login').classList.remove('show');
  document.getElementById('app').classList.add('show');
  var u=(sess&&sess.user&&sess.user.email)||'';
  document.getElementById('hdrSub').textContent=u?('Logada como '+u):'';
  carregar();
}

/* ===== DADOS ===== */
async function carregar(){
  var r=await db.from('tarefas').select('*').eq('tipo','agendamento').order('janela_data',{ascending:true,nullsFirst:false});
  if(r.error){toast('Erro ao carregar: '+r.error.message);return;}
  var todos=r.data||[];
  var corte=new Date(Date.now()-14*86400000).toISOString();
  STATE.tarefas=todos.filter(function(t){
    if(t.status!=='concluida')return true;
    return (t.concluido_em||t.atualizado_em||t.criado_em||'')>=corte;   /* concluidas recentes */
  });
  var ids=STATE.tarefas.map(function(t){return t.patient_id;}).filter(Boolean);
  STATE.fones={};
  if(ids.length){
    var pr=await db.from('patients').select('id, nome, whatsapp, telefone').in('id',ids);
    (pr.data||[]).forEach(function(p){STATE.fones[p.id]=p.whatsapp||p.telefone||'';});
  }
  await reconciliarCalendar();
  render();
}

/* Rede de seguranca: quando aberto no Mac (mesma pasta do HAG OS), le o export do
   Calendar e marca como agendada a tarefa cujo paciente ja tem evento futuro. */
async function reconciliarCalendar(){
  try{
    var resp=await fetch('_agenda/agenda_hag.js',{cache:'no-store'});
    if(!resp.ok)return;
    var txt=await resp.text();
    var i=txt.indexOf('{');if(i<0)return;
    var ag=JSON.parse(txt.slice(i).replace(/;\s*$/,''));
    var evs=(ag&&ag.eventos)||[];
    var hoje=hojeISO();
    for(var k=0;k<STATE.tarefas.length;k++){
      var t=STATE.tarefas[k];
      if(t.status==='concluida')continue;
      var alvo=norm(t.patient_nome);
      if(!alvo)continue;
      var hit=evs.find(function(e){return norm(e.titulo)===alvo && String(e.inicio).slice(0,10)>=hoje;});
      if(hit){
        await db.from('tarefas').update({status:'concluida',concluido_em:new Date().toISOString(),obs:((t.obs||'')+' [auto: Calendar '+String(hit.inicio).slice(0,10)+']').trim()}).eq('id',t.id);
        t.status='concluida';t.concluido_em=new Date().toISOString();
      }
    }
  }catch(e){/* hospedado: sem export local, segue manual */}
}

/* ===== UI ===== */
function setTab(t){STATE.tab=t;
  document.getElementById('tabAbertas').classList.toggle('on',t==='abertas');
  document.getElementById('tabFeitas').classList.toggle('on',t==='feitas');
  render();
}
function msgWhats(t){
  var nome=firstName(t.patient_nome);
  var oque=TIPO_MSG[t.tipo_evento]||'sua próxima consulta';
  var quando=t.janela_data?(' por volta de '+fmtBR(t.janela_data)):'';
  return 'Olá '+nome+'! Aqui é a Julia, do consultório do Dr. Henrique.\n\n'+
    'O Dr. pediu para já deixarmos agendada '+oque+quando+'.\n\n'+
    'Me diga os melhores dias e horários para você que eu organizo por aqui.';
}
function render(){
  var abertas=STATE.tarefas.filter(function(t){return t.status!=='concluida';});
  var feitas=STATE.tarefas.filter(function(t){return t.status==='concluida';});
  document.getElementById('nAbertas').textContent=abertas.length;
  document.getElementById('nFeitas').textContent=feitas.length;
  var lista=(STATE.tab==='abertas')?abertas:feitas;
  var el=document.getElementById('lista');
  if(!lista.length){
    el.innerHTML='<div class="empty"><div class="big">'+(STATE.tab==='abertas'?'✓':'—')+'</div>'+
      (STATE.tab==='abertas'?'Nenhum paciente aguardando agendamento.':'Nada agendado nos últimos dias.')+'</div>';
    return;
  }
  var hoje=hojeISO();
  el.innerHTML=lista.map(function(t){
    var late=t.janela_data && t.janela_data<hoje && t.status!=='concluida';
    var fone=(t.patient_id&&STATE.fones[t.patient_id])||'';
    var foneDig=fone.replace(/\D/g,'');
    if(foneDig && foneDig.length<=11) foneDig='55'+foneDig;
    var wa=foneDig?('https://wa.me/'+foneDig+'?text='+encodeURIComponent(msgWhats(t))):'';
    var stTxt={pendente:'A agendar',andamento:'Contatado, aguardando resposta',aguardando:'Contatado, aguardando resposta',concluida:'Agendado'}[t.status]||t.status;
    return '<div class="card'+(late?' atrasada':'')+'">'+
      '<div class="c-top"><div class="c-nome">'+esc(t.patient_nome||'—')+'</div>'+
      '<span class="c-tipo">'+(TIPO_LABEL[t.tipo_evento]||'Agendamento')+'</span></div>'+
      '<div class="c-janela">Janela: <b>'+(t.janela_data?('semana de '+fmtBR(t.janela_data)):'a combinar')+'</b>'+(late?' <span class="late">· atrasada</span>':'')+'</div>'+
      (t.obs||t.descricao?'<div class="c-obs">'+esc(t.obs||t.descricao)+'</div>':'')+
      '<div class="c-status '+t.status+'">'+stTxt+'</div>'+
      (t.status!=='concluida'
        ? '<div class="c-acts">'+
            (wa?'<a class="act wa" href="'+wa+'" target="_blank" onclick="marcar(\''+t.id+'\',\'andamento\',true)">WhatsApp</a>':'<span class="act" style="opacity:.5">Sem WhatsApp</span>')+
            '<button class="act ok" onclick="marcar(\''+t.id+'\',\'concluida\')">Agendado ✓</button>'+
          '</div>'
        : '<div class="c-acts"><button class="act undo" onclick="marcar(\''+t.id+'\',\'pendente\')">↺ Reabrir</button></div>')+
      '</div>';
  }).join('');
}
function esc(s){return String(s||'').replace(/[<>&"]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c];});}
async function marcar(id,status,silencioso){
  var body={status:status,atualizado_em:new Date().toISOString()};
  if(status==='concluida')body.concluido_em=new Date().toISOString();
  var r=await db.from('tarefas').update(body).eq('id',id);
  if(r.error){toast('Erro: '+r.error.message);return;}
  var t=STATE.tarefas.find(function(x){return String(x.id)===String(id);});
  if(t){t.status=status;if(body.concluido_em)t.concluido_em=body.concluido_em;}
  if(!silencioso)toast(status==='concluida'?'Agendado ✓':'Status atualizado');
  render();
}
document.getElementById('lgSenha').addEventListener('keydown',function(e){if(e.key==='Enter')entrar();});
boot();
</script>
</body>
</html>
