     Painel da coleção do HAG Cozinha. Exige login da equipe: as duas linhas abaixo ficam ANTES de qualquer chamada,
     o hag_auth.js remenda o fetch e injeta o token. Aqui o médico importa a coleção, confere, aprova, define o que é
     aberto e o que é só de paciente, põe a foto e gera o link pessoal. Nada chega ao paciente sem o clique dele. Sem IA. -->
<script>window.SUPA_URL='https://yutcnphwovqeiwcwzzhs.supabase.co';window.SUPA_KEY='sb_publishable_V-tdeq_qDKLAPYzN2vQuMA_okwPaOPi';window.HAG_EXIGIR_LOGIN=true;</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caladea:wght@400;700&family=Carlito:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#F6F4EF;--surface:#FFFFFF;--cream:#FAF7F1;--ink:#1B2745;--ink-2:#4A5568;--muted:#6F7585;--line:#E3DED3;--gold:#9C7A36;--gold-ui:#B8924A;--gold-soft:#EFE3C8;--navy:#1B2745;--on-navy:#F4EEDF;
  --good:#2F7D5B;--warn:#A86A12;--crit:#B4413A;--good-bg:#E4F1EA;--warn-bg:#F7EDDC;--crit-bg:#F6E3E1;--btn:#1B2745;--on-btn:#F4EEDF;
  --display:"Caladea",Georgia,serif;--body:"Carlito","Lato","Helvetica Neue",Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold-ui);outline-offset:2px}
header.top{background:var(--navy);color:var(--on-navy);padding:14px 20px}
header.top .in,main{max-width:980px;margin:0 auto}
.brand{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-ui)}
h1{font-family:var(--display);font-size:24px;margin:2px 0 0}
main{padding:18px 20px 80px;display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--display);font-size:21px;margin:0}
h3{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0;font-weight:500}
p{margin:0}
.note{font-size:14px;color:var(--ink-2)}
.card{background:var(--surface);border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{background:var(--btn);color:var(--on-btn);border:0;padding:10px 14px;font-weight:700}
.btn.sec{background:none;color:var(--ink);border:1px solid var(--ink);font-weight:400}
.btn.peq{padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);padding:10px 12px}
.kpi b{display:block;font-family:var(--display);font-size:26px;line-height:1.1}
.kpi span{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.msg{background:var(--good-bg);border-left:3px solid var(--good);padding:8px 12px}
.erro{background:var(--crit-bg);border-left:3px solid var(--crit);padding:8px 12px}
.filtros button{background:var(--surface);border:1px solid var(--line);padding:6px 10px;font-size:14.5px}
.filtros button[aria-pressed="true"]{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}
.grp{display:flex;flex-direction:column;gap:6px}
.it{display:grid;grid-template-columns:72px 1fr auto;gap:12px;background:var(--surface);border:1px solid var(--line);padding:10px;align-items:start}
.it.pend{border-left:3px solid var(--warn)}
.it .th{aspect-ratio:4/3;width:72px;background:var(--cream);border:1px dashed var(--gold-ui);display:grid;place-items:center;font-family:var(--mono);font-size:9px;color:var(--gold);overflow:hidden;position:relative}
.it .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.it .tx{min-width:0;display:flex;flex-direction:column;gap:3px}
.it .nm{font-family:var(--display);font-size:17px;font-weight:700;line-height:1.2}
.it .rs{font-size:13.5px;color:var(--ink-2)}
.it .mt{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.it .ac{display:flex;flex-direction:column;gap:6px;align-items:stretch;min-width:150px}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border:1px solid var(--line);color:var(--muted)}
.tag.ok{border-color:var(--good);color:var(--good)} .tag.pd{border-color:var(--warn);color:var(--warn)} .tag.ab{border-color:var(--gold-ui);color:var(--gold)}
.prev{grid-column:1/-1;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.prev table{border-collapse:collapse;width:100%;font-size:13.5px}
.prev td{padding:3px 6px;border-bottom:1px solid var(--line)}
.prev ul,.prev ol{margin:0;padding-left:20px}
textarea{width:100%;min-height:96px;border:1px solid var(--line);padding:10px;font:inherit;background:var(--cream)}
select,input[type=text]{border:1px solid var(--line);padding:8px 10px;background:var(--surface);min-width:0}
@media (max-width:640px){.it{grid-template-columns:56px 1fr}.it .th{width:56px}.it .ac{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}}
</style>

<body>
<header class="top"><div class="in"><div class="brand">Método HAG · equipe</div><h1>Cozinha, coleção</h1></div></header>
<main id="main"><div class="card">Abrindo…</div></main>
<script>
(function(){
"use strict";
var SURL=window.SUPA_URL, SKEY=window.SUPA_KEY, Auth=window.HAGAuth||{};
var APP=location.href.replace(/[^\/]*$/,'')+'cozinha_HAG.html';
var main=document.getElementById('main');
function hd(extra){ var t=(Auth.token&&Auth.token())||SKEY; return Object.assign({'apikey':SKEY,'Authorization':'Bearer '+t,'Content-Type':'application/json'},extra||{}); }
async function api(path,opt){ opt=opt||{}; var r=await fetch(SURL+'/rest/v1/'+path,{method:opt.method||'GET',headers:hd(opt.prefer?{'Prefer':opt.prefer}:null),body:opt.body?JSON.stringify(opt.body):undefined});
  if(!r.ok){ var m='erro '+r.status; try{ var j=await r.json(); m=j.message||j.hint||m; }catch(e){} throw new Error(m); }
  var t=await r.text(); return t?JSON.parse(t):null; }
var rpc=function(n,a){return api('rpc/'+n,{method:'POST',body:a})};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var fmt=function(v,d){return Number(v).toLocaleString('pt-BR',{minimumFractionDigits:d||0,maximumFractionDigits:d||0})};

var D={itens:[],meta:null,pacientes:[]};
var S={lote:null,filtro:'pendentes',tipo:'receita',aberto:null,dados:{},msg:null,erro:null,ocupado:false,pid:new URLSearchParams(location.search).get('p')||'',link:null,imp:null};

// Fotos que já estão na pasta cozinha_fotos/ do site (lista.json). A foto subida aqui (foto_url) manda sobre elas.
var FOTOS={};
function fotoDe(i){ return i.foto_url||(FOTOS[i.id]?'cozinha_fotos/p/'+i.id+'.jpg':null); }
async function carregarFotos(){ try{ var r=await fetch('cozinha_fotos/lista.json',{cache:'no-cache'}); if(!r.ok) return; var l=await r.json(); FOTOS={}; if(Array.isArray(l)) l.forEach(function(id){ if(/^[a-z0-9-]+$/.test(id)) FOTOS[id]=1; }); }catch(e){} }
async function carregar(){
  await carregarFotos();
  var r=await Promise.all([api('cozinha_itens?select=id,tipo,grupo,ordem,acesso,aprovado,resumo,foto_url,atualizado_em&order=ordem,id'),api('cozinha_colecao_meta?id=eq.1&select=dados'),api('patients?select=id,nome,status,interno&order=nome')]);
  D.itens=r[0]||[]; D.meta=(r[1]&&r[1][0]&&r[1][0].dados)||null; D.pacientes=(r[2]||[]);
}
function nomeGrupo(tipo,g){ var l=D.meta?(tipo==='guia'?D.meta.grupos_guia:D.meta.situacoes):[]; var x=(l||[]).filter(function(s){return s.id===g})[0]; return x?x.nome:g; }
function ordemGrupos(tipo){ var l=D.meta?(tipo==='guia'?D.meta.grupos_guia:D.meta.situacoes):[]; return (l||[]).map(function(s){return s.id}); }
function visiveis(){ return D.itens.filter(function(i){ return i.tipo===S.tipo && (S.filtro==='todos'||(S.filtro==='pendentes'&&!i.aprovado)||(S.filtro==='aprovados'&&i.aprovado)||(S.filtro==='semfoto'&&!fotoDe(i))); }); }

function previa(i){
  var d=S.dados[i.id]; if(!d) return '<div class="prev">Abrindo…</div>';
  if(i.tipo==='guia') return '<div class="prev">'+d.blocos.map(function(b){return '<div><b>'+esc(b.t)+'</b><ul>'+b.itens.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div>'}).join('')+(d.nota?'<p class="note">'+esc(d.nota)+'</p>':'')+'</div>';
  var n=d.n, h='<div class="prev">';
  if(d.aviso) h+='<div class="erro">'+esc(d.aviso)+'</div>';
  h+='<p><b>Porção:</b> '+esc(d.porcao)+', cerca de '+d.peso+' g · rende '+d.rende+' · '+d.tempo+' min</p>';
  h+='<p><b>Por porção:</b> '+fmt(n.kcal.v)+' kcal · proteína '+fmt(n.ptn.v,1)+' g · carboidrato '+fmt(n.cho.v,1)+' g · gordura '+fmt(n.lip.v,1)+' g · fibra '+fmt(n.fibra.v,1)+' g · sódio '+fmt(n.sodio_mg.v)+' mg</p>';
  h+='<div><b>Ingredientes</b><table>'+d.ing.map(function(x){return '<tr><td>'+esc(x.nome)+'</td><td>'+fmt(x.g,x.g<5?1:0)+' g</td><td>'+esc(x.med)+'</td></tr>'}).join('')+'</table>'+(d.tempero.length?'<p class="note">Também: '+esc(d.tempero.join(', '))+'</p>':'')+'</div>';
  h+='<div><b>Preparo</b><ol>'+d.preparo.map(function(p){return '<li>'+esc(p)+'</li>'}).join('')+'</ol></div>';
  h+='<p><b>O detalhe:</b> '+esc(d.truque)+'</p><p><b>Guardar:</b> '+esc(d.guardar)+'</p>';
  if(d.var.length) h+='<div><b>Variações</b><ul>'+d.var.map(function(v){return '<li><b>'+esc(v.nome)+'</b>: '+esc(v.ideia)+' ('+fmt(v.n.kcal.v)+' kcal, '+fmt(v.n.ptn.v,1)+' g de proteína'+(v.poe.length?'; entra '+v.poe.map(function(x){return esc(x.nome)+' '+fmt(x.g)+' g'}).join(', '):'')+(v.tira.length?'; sai '+esc(v.tira.join(', ')):'')+')</li>'}).join('')+'</ul></div>';
  return h+'</div>';
}

function render(){
  var rec=D.itens.filter(function(i){return i.tipo==='receita'}), gui=D.itens.filter(function(i){return i.tipo==='guia'});
  var ap=D.itens.filter(function(i){return i.aprovado}).length, ab=D.itens.filter(function(i){return i.aprovado&&i.acesso==='aberta'}).length, sf=rec.filter(function(i){return !fotoDe(i)}).length;
  var h='';
  if(S.msg) h+='<div class="msg">'+esc(S.msg)+'</div>';
  if(S.erro) h+='<div class="erro">'+esc(S.erro)+'</div>';
  h+='<div class="kpis"><div class="kpi"><b>'+rec.length+'</b><span>receitas</span></div><div class="kpi"><b>'+gui.length+'</b><span>guias</span></div><div class="kpi"><b>'+ap+'</b><span>aprovados, no ar</span></div><div class="kpi"><b>'+(D.itens.length-ap)+'</b><span>a aprovar</span></div><div class="kpi"><b>'+ab+'</b><span>abertos ao público</span></div><div class="kpi"><b>'+sf+'</b><span>receitas sem foto</span></div></div>';

  h+='<div class="card"><h3>1. Trazer a coleção</h3><p class="note">Escolha o arquivo <b>colecao.json</b> (pasta Scripts/HAG/hag_cozinha_colecao). O que é novo entra como "a aprovar". O que mudou de conteúdo volta para "a aprovar". O que não mudou fica como está, com a sua aprovação, o acesso e a foto.</p><div class="row"><input type="file" id="arq" accept=".json,application/json"><button class="btn" data-a="importar" '+(S.ocupado?'disabled':'')+'>Importar</button></div>'+(S.imp?'<p class="note">'+esc(S.imp)+'</p>':'')+'</div>';

  h+='<div class="card"><h3>2. Conferir, aprovar e pôr a foto</h3><div class="row filtros">'+
     [['receita','Receitas'],['guia','Guias']].map(function(x){return '<button data-a="tipo" data-v="'+x[0]+'" aria-pressed="'+(S.tipo===x[0])+'">'+x[1]+'</button>'}).join('')+'<span class="note">|</span>'+
     [['pendentes','A aprovar'],['aprovados','Aprovados'],['semfoto','Sem foto'],['todos','Todos']].map(function(x){return '<button data-a="filtro" data-v="'+x[0]+'" aria-pressed="'+(S.filtro===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>';
  h+='<div class="row"><label class="btn sec">Subir várias fotos de uma vez<input type="file" id="lote" accept="image/*" multiple hidden></label><span class="note">O nome de cada arquivo precisa ser o código da receita, como <b>mingau-clara.jpg</b>. É o nome que está no roteiro de fotos.</span></div>'+(S.lote?'<p class="note">'+esc(S.lote)+'</p>':'');
  var vis=visiveis(), pend=vis.filter(function(i){return !i.aprovado});
  if(pend.length) h+='<div class="row"><button class="btn" data-a="aprovartodos" '+(S.ocupado?'disabled':'')+'>Aprovar os '+pend.length+' desta lista</button><span class="note">Aprovado vai para o ar na hora, na página da coleção.</span></div>';
  if(!D.itens.length) h+='<p class="note">Ainda não há nada. Importe o arquivo da coleção no passo 1.</p>';
  else if(!vis.length) h+='<p class="note">Nada nesta lista.</p>';
  var grupos=ordemGrupos(S.tipo); vis.forEach(function(i){ if(grupos.indexOf(i.grupo)<0) grupos.push(i.grupo); });
  grupos.forEach(function(g){
    var l=vis.filter(function(i){return i.grupo===g}); if(!l.length) return;
    h+='<div class="grp"><h2>'+esc(nomeGrupo(S.tipo,g))+' <span class="note">('+l.length+')</span></h2>';
    l.forEach(function(i){ var r=i.resumo||{};
      h+='<div class="it '+(i.aprovado?'':'pend')+'"><div class="th">'+(fotoDe(i)?'<img alt="" src="'+esc(fotoDe(i))+'">':(i.tipo==='receita'?'foto':'guia'))+'</div>'+
         '<div class="tx"><span class="nm">'+esc(r.nome)+'</span><span class="rs">'+esc(r.resumo)+'</span>'+(i.tipo==='receita'?'<span class="mt">'+esc(i.id)+' · '+r.tempo+' min · '+fmt(r.kcal)+' kcal · '+fmt(r.ptn)+' g proteína · '+r.nvar+' variações</span>':'')+
         '<span class="row"><span class="tag '+(i.aprovado?'ok':'pd')+'">'+(i.aprovado?'aprovado':'a aprovar')+'</span><span class="tag '+(i.acesso==='aberta'?'ab':'')+'">'+(i.acesso==='aberta'?'aberto ao público':'só paciente')+'</span></span></div>'+
         '<div class="ac"><button class="btn peq sec" data-a="ver" data-v="'+i.id+'">'+(S.aberto===i.id?'Fechar':'Conferir')+'</button>'+
         '<button class="btn peq'+(i.aprovado?' sec':'')+'" data-a="aprovar" data-v="'+i.id+'">'+(i.aprovado?'Tirar do ar':'Aprovar')+'</button>'+
         '<button class="btn peq sec" data-a="acesso" data-v="'+i.id+'">'+(i.acesso==='aberta'?'Tornar só paciente':'Abrir ao público')+'</button>'+
         (i.tipo==='receita'?'<label class="btn peq sec" style="text-align:center">'+(fotoDe(i)?'Trocar foto':'Pôr foto')+'<input type="file" accept="image/*" data-foto="'+i.id+'" hidden></label>':'')+'</div>'+
         (S.aberto===i.id?previa(i):'')+'</div>'; });
    h+='</div>';
  });
  h+='</div>';

  h+='<div class="card"><h3>3. Link pessoal do paciente</h3><p class="note">Quem abre a página sem link vê só o que está "aberto ao público". O link pessoal libera também o que é "só paciente". O envio é da Daniela.</p><div class="row"><select id="pac"><option value="">Escolha o paciente</option>'+
     D.pacientes.map(function(p){return '<option value="'+esc(p.id)+'" '+(S.pid===p.id?'selected':'')+'>'+esc(p.nome)+(p.interno?' (interno)':'')+'</option>'}).join('')+'</select><button class="btn" data-a="gerarlink">Gerar link</button></div>';
  if(S.link){ var p=D.pacientes.filter(function(x){return x.id===S.pid})[0]||{}, pn=String(p.nome||'').split(' ')[0];
    h+='<p class="note">Link de '+esc(p.nome||'')+':</p><textarea id="linktxt" readonly>'+esc(S.link)+'</textarea>'+
       '<p class="note">Mensagem pronta para a Daniela:</p><textarea id="msgtxt" readonly>Oi '+esc(pn)+', tudo bem? O Dr. Henrique liberou para você o acesso à Cozinha do Método HAG: receitas e guias práticos para o dia a dia, com as porções e os números de cada uma. O link é pessoal:\n\n'+esc(S.link)+'\n\nDá para salvar na tela inicial do celular e abrir sempre que precisar.</textarea>'+
       '<div class="row"><button class="btn sec" data-a="copiar" data-v="linktxt">Copiar o link</button><button class="btn sec" data-a="copiar" data-v="msgtxt">Copiar a mensagem</button></div>'; }
  h+='</div>';
  h+='<div class="card"><h3>Atalhos</h3><div class="row"><a class="btn sec" style="text-decoration:none" href="cozinha_HAG.html" target="_blank" rel="noopener">Abrir a coleção como o público vê</a><a class="btn sec" style="text-decoration:none" href="orientacoes_painel_HAG.html'+(S.pid?'?p='+encodeURIComponent(S.pid):'')+'">Orientações por condição</a><a class="btn sec" style="text-decoration:none" href="cozinha_plano_painel_HAG.html">Painel do plano (estacionado)</a></div></div>';
  main.innerHTML=h;
}

async function tentar(fn){ S.erro=null; S.ocupado=true; try{ await fn(); }catch(e){ S.erro='Não deu certo: '+e.message+'. Se a sessão expirou, recarregue a página e entre de novo.'; } S.ocupado=false; render(); }
function reduzir(file){ return new Promise(function(ok,falha){ var img=new Image(), url=URL.createObjectURL(file);
  img.onload=function(){ var max=1400, k=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); c.toBlob(function(b){ b?ok(b):falha(new Error('não foi possível ler a imagem')); },'image/jpeg',0.84); };
  img.onerror=function(){ falha(new Error('arquivo de imagem inválido')); }; img.src=url; }); }

main.addEventListener('click',function(e){
  var t=e.target.closest('[data-a]'); if(!t) return; var a=t.dataset.a, v=t.dataset.v; S.msg=null;
  if(a==='tipo'){ S.tipo=v; S.aberto=null; return render(); }
  if(a==='filtro'){ S.filtro=v; S.aberto=null; return render(); }
  if(a==='ver'){ if(S.aberto===v){ S.aberto=null; return render(); } S.aberto=v; render();
    if(!S.dados[v]) return tentar(async function(){ var r=await api('cozinha_itens?id=eq.'+encodeURIComponent(v)+'&select=dados'); S.dados[v]=r[0].dados; }); return; }
  if(a==='aprovar') return tentar(async function(){ var i=D.itens.filter(function(x){return x.id===v})[0]; await api('cozinha_itens?id=eq.'+encodeURIComponent(v),{method:'PATCH',body:{aprovado:!i.aprovado,atualizado_em:new Date().toISOString()}}); i.aprovado=!i.aprovado; S.msg=i.aprovado?'Aprovado. Já aparece na coleção.':'Tirado do ar.'; });
  if(a==='acesso') return tentar(async function(){ var i=D.itens.filter(function(x){return x.id===v})[0], n=i.acesso==='aberta'?'paciente':'aberta'; await api('cozinha_itens?id=eq.'+encodeURIComponent(v),{method:'PATCH',body:{acesso:n,atualizado_em:new Date().toISOString()}}); i.acesso=n; });
  if(a==='aprovartodos') return tentar(async function(){ var ids=visiveis().filter(function(i){return !i.aprovado}).map(function(i){return i.id}); if(!ids.length) return;
    for(var k=0;k<ids.length;k+=40){ var lote=ids.slice(k,k+40); await api('cozinha_itens?id=in.('+lote.map(function(x){return '"'+x+'"'}).join(',')+')',{method:'PATCH',body:{aprovado:true,atualizado_em:new Date().toISOString()}}); }
    D.itens.forEach(function(i){ if(ids.indexOf(i.id)>=0) i.aprovado=true; }); S.msg=ids.length+' itens aprovados. Já aparecem na coleção.'; });
  if(a==='importar'){ var f=document.getElementById('arq').files[0]; if(!f){ S.erro='Escolha o arquivo colecao.json antes.'; return render(); }
    return tentar(async function(){ var c=JSON.parse(await f.text()); if(!c||!Array.isArray(c.itens)||!c.meta) throw new Error('este arquivo não é a coleção do HAG Cozinha');
      var tot={novos:0,alterados:0,iguais:0};
      for(var k=0;k<c.itens.length;k+=12){ S.imp='Importando '+Math.min(k+12,c.itens.length)+' de '+c.itens.length+'…'; render();
        var r=await rpc('hag_cozinha_importar',{p_itens:c.itens.slice(k,k+12),p_meta:k===0?c.meta:null}); tot.novos+=r.novos; tot.alterados+=r.alterados; tot.iguais+=r.iguais; }
      await carregar(); S.dados={}; S.imp=null; S.msg='Importado: '+tot.novos+' novos, '+tot.alterados+' alterados (voltaram para "a aprovar"), '+tot.iguais+' sem mudança.'; }); }
  if(a==='gerarlink'){ S.pid=document.getElementById('pac').value; if(!S.pid){ S.erro='Escolha o paciente.'; return render(); }
    return tentar(async function(){ var tk=await rpc('hag_cozinha_link',{p_patient_id:S.pid}); S.link=APP+'?t='+tk; }); }
  if(a==='copiar'){ var el=document.getElementById(v); el.select(); try{ navigator.clipboard.writeText(el.value).then(function(){ S.msg='Copiado.'; render(); },function(){}); }catch(er){} return; }
});
async function subirFoto(id,file){
  var blob=await reduzir(file), nome=id+'-'+Date.now()+'.jpg';
  var r=await fetch(SURL+'/storage/v1/object/cozinha/'+nome,{method:'POST',headers:{'apikey':SKEY,'Authorization':'Bearer '+((Auth.token&&Auth.token())||SKEY),'Content-Type':'image/jpeg','x-upsert':'true'},body:blob});
  if(!r.ok){ var m='erro '+r.status; try{ var j=await r.json(); m=j.message||j.error||m; }catch(er){} throw new Error('a foto não subiu ('+m+')'); }
  var url=SURL+'/storage/v1/object/public/cozinha/'+nome;
  await api('cozinha_itens?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:{foto_url:url,atualizado_em:new Date().toISOString()}});
  D.itens.filter(function(x){return x.id===id})[0].foto_url=url;
}
main.addEventListener('change',function(e){
  var t=e.target; S.msg=null;
  if(t.id==='lote'&&t.files&&t.files.length){ var arqs=Array.prototype.slice.call(t.files);
    return tentar(async function(){ var ok=0, sem=[], falhou=[];
      for(var k=0;k<arqs.length;k++){ var f=arqs[k], id=f.name.replace(/\.[^.]+$/,'').trim().toLowerCase();
        var it=D.itens.filter(function(x){return x.id===id&&x.tipo==='receita'})[0];
        if(!it){ sem.push(f.name); continue; }
        S.lote='Enviando '+(k+1)+' de '+arqs.length+'…'; render();
        try{ await subirFoto(id,f); ok++; }catch(er){ falhou.push(f.name+' ('+er.message+')'); } }
      S.lote=null; S.msg=ok+' fotos salvas.'+(sem.length?' Sem receita com esse nome: '+sem.join(', ')+'.':'')+(falhou.length?' Não subiram: '+falhou.join(', ')+'.':''); }); }
  if(!t.dataset||!t.dataset.foto||!t.files||!t.files[0]) return; var id=t.dataset.foto, file=t.files[0];
  tentar(async function(){ await subirFoto(id,file); S.msg='Foto salva. Já aparece na coleção.'; });
});

async function boot(){
  for(var k=0;k<8 && !(Auth.valid&&Auth.valid());k++) await new Promise(function(r){setTimeout(r,400)});
  if(!(Auth.valid&&Auth.valid())){ main.innerHTML='<div class="card"><h2>Acesso restrito à equipe</h2><p class="note">Faça login para abrir o painel. Se a tela de login não apareceu, recarregue a página.</p></div>'; return; }
  try{ await carregar(); if(D.itens.length && !D.itens.some(function(i){return !i.aprovado})) S.filtro='todos'; render(); }
  catch(e){ main.innerHTML='<div class="erro">Não foi possível carregar: '+esc(e.message)+'. Se a sessão expirou, recarregue a página e entre de novo.</div>'; }
}
boot();
})();
</script>
