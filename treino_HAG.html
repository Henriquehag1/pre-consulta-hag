<style>

<body>
<header class="top"><div class="in">
  <div class="brand">Método HAG · Treino</div>

  <nav class="tabs" role="tablist">

<div class="timer" id="timer" hidden></div>

<script>
(function(){
"use strict";
var SURL='https://yutcnphwovqeiwcwzzhs.supabase.co';
var SKEY='sb_publishable_V-tdeq_qDKLAPYzN2vQuMA_okwPaOPi';
var H={'apikey':SKEY,'Authorization':'Bearer '+SKEY,'Content-Type':'application/json'};
function rpc(nome,args){ return fetch(SURL+'/rest/v1/rpc/'+nome,{method:'POST',headers:H,body:JSON.stringify(args)}).then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.json(); }); }

/* ---------- armazenamento local (token, contexto em cache, fila offline) ---------- */
const store = { get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }, del(k){ try{ localStorage.removeItem(k);}catch(e){} } };
const q = new URLSearchParams(location.search);
let TOKEN = String(q.get('t')||'').replace(/[^a-f0-9]/gi,'').slice(0,64);
if(TOKEN) store.set('hagtreino.token',TOKEN); else TOKEN = store.get('hagtreino.token','')||'';
let CTX = store.get('hagtreino.ctx',null);
let FILA = store.get('hagtreino.fila',[]); if(!Array.isArray(FILA)) FILA=[];

/* ---------- utilidades ---------- */
const MUSC = {quad:"Quadríceps", glut:"Glúteos", post:"Posteriores", peito:"Peitoral", costas:"Costas", ombro:"Ombros", tric:"Tríceps", bic:"Bíceps", core:"Core", pant:"Panturrilha"};
const ALVO = {quad:[8,16], glut:[8,14], post:[8,14], peito:[8,16], costas:[8,18], ombro:[6,14], tric:[4,12], bic:[4,12], core:[4,10], pant:[4,10]};
const e1rm = (kg,reps,rir) => (!kg || !reps || (reps+(rir||0))>15) ? null : kg*(1+(reps+(rir||0))/30);
const roundTo = (x,step) => Math.round(x/step)*step;
const fmt = (x,d=1) => (+x).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
const fkg = x => fmt(x, Number.isInteger(+x)?0:1);
const br = s => String(s).slice(8,10)+"/"+String(s).slice(5,7);
const diaSem = s => ["domingo","segunda","terça","quarta","quinta","sexta","sábado"][new Date(s+"T12:00:00Z").getUTCDay()];
const mmss = s => { s=Math.max(0,Math.round(s)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hojeLocal = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : (Date.now()+"-"+Math.random().toString(16).slice(2)));
const EX = id => (CTX && CTX.exercicios && CTX.exercicios[id]) || {nome:id, mod:"forca", m:{}, inc:2.5, un:"kg", subs:[]};
const HOJE = () => hojeLocal();
/* histórico = o que o servidor tem + o que ainda está na fila deste aparelho */
function historico(){ const h=(CTX&&CTX.historico)||[]; const ids=new Set(h.map(s=>s.client_id)); return h.concat(FILA.map(p=>({data:p.data, dia_id:p.dia_id, dia:p.dia, tipo:p.tipo, dur:p.dur, rpe:p.rpe, pront:p.pront, cv:p.cv, series:p.series||[], cardio:p.cardio||[], hyrox:p.hyrox||[], pendente:true}))); }

/* ---------- regra de progressão, com o motivo escrito ---------- */
function travado(exId){
  const h=historico().filter(s=>s.series.some(x=>x.ex===exId)); const ult=h.at(-1); if(!ult) return null;
  const ser=ult.series.filter(x=>x.ex===exId); if(!ser.some(x=>x.dor>=4)) return null;
  const lib=((CTX&&CTX.liberacoes)||[]).some(l=>l.ex===exId && String(l.em)>=String(ult.data));
  return lib?null:{data:ult.data, dor:Math.max(...ser.map(x=>x.dor))};
}
function sugestao(it){
  const exId=it.id, ex=EX(exId), lo=it.min||1, hi=it.max||lo, regra=it.regra||"dupla", inc=+ex.inc||2.5, un=ex.un||"kg";
  const h=historico().filter(s=>s.series.some(x=>x.ex===exId)); const ult=h.at(-1);
  const u = un==="seg" ? "seg" : "reps";
  if(!ult){ const kg=+it.carga||0; return {kg, reps:lo, primeira:true, motivo: (un==="kg"&&!kg) ? "Primeira vez neste exercício: escolha uma carga com que sobrem umas 2 ou 3 repetições." : "Primeira vez neste exercício."}; }
  const ser=ult.series.filter(x=>x.ex===exId), kg=+ser[0].kg||0, quando=br(ult.data), feito=ser.map(x=>x.reps).join(", ");
  const tr=travado(exId);
  if(tr) return {kg, reps:ser[0].reps, trava:true, motivo:`Dor ${tr.dor} em ${quando}: a carga fica igual até o Dr. Henrique liberar.`};
  const topo=ser.every(x=>x.reps>=hi && (x.rir==null || x.rir>=(it.rir==null?2:it.rir)));
  if(un!=="kg"){ /* peso do corpo ou tempo: só sobe a repetição ou o tempo */
    if(topo) return {kg, reps:hi, motivo:`Em ${quando} você fez ${feito} ${u}: topo da faixa. Mantenha, e avise na consulta para subir a dificuldade.`};
    const passo = un==="seg"?5:1; const r=Math.min(hi, Math.max(...ser.map(x=>x.reps))+passo);
    return {kg, reps:r, motivo:`Em ${quando} você fez ${feito} ${u}. Agora buscar ${r}.`};
  }
  if(regra==="reab"){
    const duas=h.slice(-2); const semDor=duas.every(s=>s.series.filter(x=>x.ex===exId).every(x=>(x.dor||0)<=2));
    if(!semDor) return {kg, reps:Math.min(hi,Math.max(lo,ser[0].reps)), motivo:`Dor acima de 2 em uma das duas últimas sessões: a carga fica em ${fkg(kg)} kg.`};
  }
  if(topo){
    let novo;
    if(regra==="forca"){ const best=Math.max(...ser.map(x=>e1rm(x.kg,x.reps,x.rir)||0)); const alvo=best/(1+(lo+(it.rir==null?2:it.rir))/30); novo=roundTo(Math.min(Math.max(alvo,kg+inc),kg*1.05+inc/2),inc); if(novo<=kg) novo=kg+inc;
      return {kg:novo, reps:lo, sobe:true, de:kg, motivo:`Em ${quando} você fez ${ser.length} × ${feito} com ${fkg(kg)} kg, força estimada de ${fmt(best,0)} kg: a carga sobe para ${fkg(novo)} kg e as repetições voltam a ${lo}.`}; }
    novo=roundTo(Math.max(kg+inc,kg*1.025),inc);
    return {kg:novo, reps:lo, sobe:true, de:kg, motivo:`Em ${quando} você fez ${ser.length} × ${feito} com 2 ou mais repetições sobrando: a carga sobe de ${fkg(kg)} para ${fkg(novo)} kg e as repetições voltam a ${lo}.`};
  }
  const r=Math.min(hi, Math.max(lo, Math.max(...ser.map(x=>x.reps))+1));
  return {kg, reps:r, motivo:`Em ${quando} você fez ${ser.length} × ${feito} com ${fkg(kg)} kg. Mesma carga, buscando ${r} (a carga sobe quando todas chegarem a ${hi}).`};
}

/* ---------- estado da sessão ---------- */
const vHoje=document.getElementById("v-hoje"), vEvo=document.getElementById("v-evo"), elTimer=document.getElementById("timer");
const novoEstado = () => ({fase:"inicio", diaId:null, pront:{sono:null,energia:null,musc:null,art:null}, prontPulou:false, i:0, sub:{}, feitas:{}, cardio:{}, voltas:{}, crono:null, ajuste:null, abrirAjuste:false, verPq:false, verVideo:false, inicio:null, cv:false, salvo:null, nota:""});
let S = novoEstado();
let wakeLock=null, audio=null, tick=null, descanso=null, tickCrono=null;

const prog = () => CTX && CTX.programa;
function diaSugerido(){
  const p=prog(); if(!p||!p.dias.length) return null;
  const ult=historico().filter(s=>s.dia_id && p.dias.some(d=>d.id===s.dia_id)).at(-1);
  if(!ult) return p.dias[0].id;
  const k=p.dias.findIndex(d=>d.id===ult.dia_id); return p.dias[(k+1)%p.dias.length].id;
}
const diaAtual = () => { const p=prog(); return p.dias.find(d=>d.id===S.diaId) || p.dias[0]; };
function itens(){ return diaAtual().itens.map(it=>{ const id=S.sub[it.ex]||it.ex; return {...it, orig:it.ex, id, mod:EX(id).mod, ns:it.series||1}; }); }
function minutosEstimados(){ return Math.round(itens().reduce((a,it)=>a+(it.mod==="forca"||it.mod==="mobilidade" ? it.ns*(40+(it.desc||60)) : 600),0)/60)+5; }
function semanaBloco(){ const p=prog(); if(!p.bloco_inicio) return null; const d=(new Date(HOJE()+"T12:00:00Z")-new Date(p.bloco_inicio+"T12:00:00Z"))/864e5; const n=(p.bloco_papeis||[]).length||4; return ((Math.floor(d/7)%n)+n)%n+1; }

const scorePront = p => p.sono+p.energia+(5-p.musc)+(5-p.art);
function semaforo(){
  const p=S.pront; if([p.sono,p.energia,p.musc,p.art].some(v=>v==null)) return null;
  const ant=historico().filter(s=>s.pront).slice(-8).map(s=>scorePront(s.pront)); const sc=scorePront(p);
  const b=ant.length>=3 ? ant.reduce((a,x)=>a+x,0)/ant.length : 14;
  if(p.art>=4 || sc<b-4) return {c:"r", t:"Bem abaixo do seu habitual, ou dor articular forte.", s:"O treino não muda sozinho. Siga a orientação do seu plano e avise o consultório se a dor articular continuar."};
  if(sc<b-1.5) return {c:"y", t:"Hoje sua prontidão está abaixo do habitual.", s:"Siga a orientação definida no seu plano. Se precisar ajustar, ajuste a carga, não o exercício."};
  return {c:"g", t:"Prontidão normal para você.", s:"Bom treino."};
}

/* ---------- descanso: relógio por horário, tela acesa, som e cor ao terminar ---------- */
function bip(){ try{ if(!audio) return; const o=audio.createOscillator(), g=audio.createGain(); o.frequency.value=880; g.gain.value=.15; o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime+.3); }catch(e){} try{ navigator.vibrate && navigator.vibrate([200,80,200]); }catch(e){} }
function iniciarDescanso(seg, proxima){ if(!seg||seg<=0) return; descanso={fim:Date.now()+seg*1000, proxima, avisou:false}; elTimer.hidden=false; document.body.classList.add("descansando"); clearInterval(tick); tick=setInterval(desenharTimer,250); desenharTimer(); }
function desenharTimer(){
  if(!descanso) return; const rest=(descanso.fim-Date.now())/1000;
  if(rest<=0 && !descanso.avisou){ descanso.avisou=true; bip(); }
  const pronto=rest<=0; elTimer.classList.toggle("pronto",pronto);
  elTimer.innerHTML=`<div class="in"><div><div class="lb">${pronto?"Próxima série pronta":"Descanso"}</div><div class="t">${pronto?"0:00":mmss(rest)}</div></div><div class="sp"></div>${pronto?`<button type="button" data-t="fechar">OK</button>`:`<button type="button" data-t="mais">+30 s</button><button type="button" data-t="pular">PULAR</button>`}<div class="nx">${esc(descanso.proxima)}</div></div>`;
}
function pararDescanso(){ clearInterval(tick); descanso=null; elTimer.hidden=true; elTimer.classList.remove("pronto"); document.body.classList.remove("descansando"); }
elTimer.addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b||!descanso) return; if(b.dataset.t==="mais") descanso.fim+=30000; if(b.dataset.t==="pular") descanso.fim=Date.now(); if(b.dataset.t==="fechar") return pararDescanso(); desenharTimer(); });
async function manterTelaAcesa(){ try{ if("wakeLock" in navigator) wakeLock=await navigator.wakeLock.request("screen"); }catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ if(S.fase==="treino") manterTelaAcesa(); desenharTimer(); enviarFila(); } });
function somPronto(){ if(!audio){ try{ audio=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }

function avancar(descansoSeg, deIt){
  const its=itens(); S.abrirAjuste=false; S.verPq=false; S.verVideo=false; S.ajuste=null;
  if(S.i<its.length-1){ S.i++; const nx=its[S.i]; let txt="Próximo: "+EX(nx.id).nome; if(nx.mod==="forca"||nx.mod==="mobilidade"){ const sg=sugestao(nx); if(EX(nx.id).un==="kg"&&sg.kg) txt+=` · ${fkg(sg.kg)} kg × ${sg.reps}`; } iniciarDescanso(descansoSeg, txt); }
  else { pararDescanso(); S.fase="fim"; }
}
function registrar(rir){
  const its=itens(), it=its[S.i], a=S.ajuste; somPronto();
  (S.feitas[S.i] ||= []).push({ex:it.id, orig:it.orig!==it.id?it.orig:null, kg:a.kg, reps:a.reps, rir, dor:a.dor, local:a.local, lado:a.lado, tipo:a.tipo, sug:a.sug, um:!a.mexeu});
  S.abrirAjuste=false; salvarRascunho();
  const n=S.feitas[S.i].length;
  if(n>=it.ns) avancar(it.desc, it); else { const kgTxt=EX(it.id).un==="kg"?`${fkg(a.kg)} kg × ${a.reps}`:`${a.reps}`; S.ajuste=null; iniciarDescanso(it.desc, `Próxima: série ${n+1} · ${kgTxt}`); }
  render();
}

/* ---------- salvar: fila neste aparelho, envio quando houver rede ---------- */
function salvarRascunho(){ store.set("hagtreino.rascunho",{dia:HOJE(), S:{...S, crono:null, ajuste:null}}); }
function enviarFila(){
  if(!FILA.length || enviarFila.ocupado || !TOKEN) return Promise.resolve(false);
  enviarFila.ocupado=true; const p=FILA[0];
  return rpc("hag_treino_salvar",{p_token:TOKEN,p:p}).then(r=>{
    enviarFila.ocupado=false;
    if(r && (r.ok || ["sem_client_id","data_fora","tamanho"].includes(r.erro))){ FILA.shift(); store.set("hagtreino.fila",FILA); return FILA.length?enviarFila():carregar().then(()=>true); }
    return false;
  }).catch(()=>{ enviarFila.ocupado=false; return false; });
}
function salvar(){
  const rpe=+document.getElementById("rpe").value, dur=+document.getElementById("dur").textContent||0; const d=diaAtual(); const its=itens();
  const {series,cardio,hyrox}=coletar();
  const antes={}; for(const s of historico()) for(const x of s.series){ const v=e1rm(x.kg,x.reps,x.rir); if(v&&(!antes[x.ex]||v>antes[x.ex])) antes[x.ex]=v; }
  const pr=(!S.prontPulou && Object.values(S.pront).every(v=>v!=null))?{...S.pront}:null;
  const payload={client_id:uid(), data:HOJE(), dia_id:d.id, dia:d.nome, tipo:d.tipo, inicio:S.inicio?new Date(S.inicio).toISOString():null, dur, rpe, pront:pr, cv:S.cv, series, cardio, hyrox};
  FILA.push(payload); store.set("hagtreino.fila",FILA); store.del("hagtreino.rascunho");
  const rec=[], vistos=new Set();
  for(const x of series){ const v=e1rm(x.kg,x.reps,x.rir); if(v&&antes[x.ex]&&v>antes[x.ex]+.05&&!vistos.has(x.ex)){ rec.push(`${esc(EX(x.ex).nome)}: força estimada ${fmt(v)} kg (melhor anterior ${fmt(antes[x.ex])})`); vistos.add(x.ex);} }
  const dor=[...new Set(series.filter(x=>x.dor>=4).map(x=>EX(x.ex).nome))];
  const prox=its.filter(it=>it.mod==="forca"||it.mod==="mobilidade").map(it=>({nome:EX(it.id).nome, un:EX(it.id).un, ...sugestao(it)}));
  const partes=[series.length?`${series.length} séries`:"", cardio.length?`${cardio.length} cardio`:"", hyrox.length?`${hyrox.length} tempos`:""].filter(Boolean).join(" · ");
  S.salvo={n:series.length, um:series.filter(x=>x.um).length, rpe, dur, ci:rpe*dur, rec, dor, prox, cv:S.cv, partes, enviada:false};
  if(wakeLock){ try{ wakeLock.release(); }catch(e){} wakeLock=null; }
  render();
  enviarFila().then(ok=>{ if(S.salvo){ S.salvo.enviada=!FILA.length; render(); renderEvo(); } });
}

vHoje.addEventListener("click", e=>{
  const b=e.target.closest("button"); if(!b) return; const a=b.dataset.a; if(!a) return;
  if(a==="recarregar") return carregar();
  if(a==="enviar") return enviarFila().then(render);
  if(a==="pr"){ S.pront[b.dataset.k]=+b.dataset.v; return render(); }
  if(a==="pular"){ S.prontPulou=true; return render(); }
  if(a==="onbok"){ store.set("hagtreino.rir.visto",true); return render(); }
  if(a==="dia"){ S.diaId=b.dataset.v; S.sub={}; return render(); }
  if(a==="iniciar"){ S.fase="treino"; S.inicio=Date.now(); somPronto(); manterTelaAcesa(); salvarRascunho(); return render(); }
  if(a==="feito") return registrar(+b.dataset.v);
  if(a==="ajustar"){ S.abrirAjuste=!S.abrirAjuste; return render(); }
  if(a==="pq"){ S.verPq=!S.verPq; return render(); }
  if(a==="video"){ S.verVideo=!S.verVideo; return render(); }
  if(a==="sub"){ const it=itens()[S.i]; if(b.dataset.v) S.sub[it.orig]=b.dataset.v; else delete S.sub[it.orig]; S.ajuste=null; return render(); }
  const A=S.ajuste;
  if(A && ["kg-","kg+","r-","r+","dor","local","lado","tipo"].includes(a)){
    const ex=EX(A.id), inc=+ex.inc||2.5, passo=ex.un==="seg"?5:1;
    if(a==="kg-") A.kg=Math.max(0,+(A.kg-inc).toFixed(2)); if(a==="kg+") A.kg=+(A.kg+inc).toFixed(2);
    if(a==="r-") A.reps=Math.max(0,A.reps-passo); if(a==="r+") A.reps+=passo;
    if(a==="dor"){ A.dor=+b.dataset.v; if(!A.dor){A.local=A.lado=A.tipo=null;} }
    if(a==="local"){ A.local=b.dataset.v; A.lado=null; } if(a==="lado") A.lado=b.dataset.v; if(a==="tipo") A.tipo=b.dataset.v;
    /* definir a carga da primeira vez não é "ajuste": não havia sugestão para aceitar */
    if(!((a==="kg-"||a==="kg+") && !A.sug)) A.mexeu=true; return render();
  }
  if(a==="sup"){ S.cardio[S.i].sup=b.dataset.v; return render(); }
  if(a==="cardiook"){ const c=S.cardio[S.i]; if(num(c.min)==null && num(c.km)==null){ document.getElementById("cardio-msg").textContent="Preencha pelo menos o tempo ou a distância."; return; } c.ok=true; salvarRascunho(); avancar(0); return render(); }
  if(a==="hxstart"){ somPronto(); S.crono={i:S.i,t0:Date.now()}; return render(); }
  if(a==="hxstop"){ const it=itens()[S.i]; const seg=Math.round((Date.now()-S.crono.t0)/1000); (S.voltas[S.i] ||= []).push({seg, kg:S.cargaHx.kg}); S.crono=null; clearInterval(tickCrono); salvarRascunho();
    if(S.voltas[S.i].length>=it.ns){ const simulado=(diaAtual().tipo||"").toLowerCase()==="simulado"; avancar(simulado?0:it.desc); if(simulado && S.fase==="treino" && itens()[S.i].mod==="hyrox") S.crono={i:S.i,t0:Date.now()}; }
    else iniciarDescanso(it.desc, `Próxima: volta ${S.voltas[S.i].length+1} de ${it.ns}`);
    return render(); }
  if(a==="hx-"||a==="hx+"){ const inc=+EX(itens()[S.i].id).inc||1; S.cargaHx.kg=Math.max(0,S.cargaHx.kg+(a==="hx+"?inc:-inc)); return render(); }
  if(a==="volta"){ pararDescanso(); S.abrirAjuste=S.verPq=S.verVideo=false; if(S.i>0){ S.i--; S.ajuste=null; S.crono=null; } return render(); }
  if(a==="pulaex"){ pararDescanso(); S.crono=null; S.abrirAjuste=S.verPq=S.verVideo=false; if(S.i<itens().length-1){ S.i++; S.ajuste=null; } else S.fase="fim"; return render(); }
  if(a==="cv"){ S.cv=true; return render(); }
  if(a==="cvno"){ S.cv=false; return render(); }
  if(a==="cvok"){ pararDescanso(); S.crono=null; S.fase="fim"; return render(); }
  if(a==="d-"||a==="d+"){ const o=document.getElementById("dur"); o.textContent=Math.max(1,(+o.textContent||0)+(a==="d+"?5:-5)); return; }
  if(a==="voltartreino"){ S.fase="treino"; return render(); }
  if(a==="descartar"){ if(b.dataset.c==="1"){ store.del("hagtreino.rascunho"); pararDescanso(); S=novoEstado(); return render(); } b.dataset.c="1"; b.textContent="toque de novo para descartar"; return; }
  if(a==="salvar") return salvar();
  if(a==="novo"){ S=novoEstado(); return render(); }
});
vHoje.addEventListener("input", e=>{
  const t=e.target;
  if(t.id==="rpe"){ document.getElementById("rpe-v").textContent=t.value; document.getElementById("rpe-t").textContent=rpeTexto(+t.value); }
  if(t.dataset.c && S.cardio[S.i]) S.cardio[S.i][t.dataset.c]=t.value;
});

/* ---------- aba: estou evoluindo? ---------- */
const semanaDe = s => { const d=new Date(s+"T12:00:00Z"); const dow=(d.getUTCDay()+6)%7; d.setUTCDate(d.getUTCDate()-dow); return d.toISOString().slice(0,10); };
function serieE1(exId){ const p=[]; for(const s of historico()){ const ser=s.series.filter(x=>x.ex===exId); if(ser.length){ const b=Math.max(...ser.map(x=>e1rm(x.kg,x.reps,x.rir)||0)); if(b) p.push({x:br(s.data), d:s.data, y:b}); } } return p; }
const W = () => Math.max(300, Math.min(528, (document.querySelector("main").clientWidth||360)-66));
function linha(pontos,{h=200,rot=""}={}){
  if(pontos.length<2) return `<p class="note">Ainda são poucos registros para desenhar a linha. Ela aparece a partir da segunda sessão.</p>`;
  const w=W(),L=40,R=14,T=18,B=26, ys=pontos.map(p=>p.y); let lo=Math.min(...ys), hi=Math.max(...ys); const pad=(hi-lo)*.15||1; lo=Math.floor(lo-pad); hi=Math.ceil(hi+pad);
  const X=i=>L+i*(w-L-R)/(pontos.length-1), Y=v=>T+(hi-v)*(h-T-B)/(hi-lo), ticks=[0,1,2,3].map(i=>lo+i*(hi-lo)/3);
  const d=pontos.map((p,i)=>`${i?"L":"M"}${X(i).toFixed(1)} ${Y(p.y).toFixed(1)}`).join(" "), last=pontos.at(-1);
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${rot}">${ticks.map(t=>`<line x1="${L}" x2="${w-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--chart-grid)"/><text x="${L-6}" y="${Y(t)+4}" font-size="11" text-anchor="end" fill="var(--muted)">${fmt(t,0)}</text>`).join("")}
   <path d="${d} L${X(pontos.length-1)} ${h-B} L${X(0)} ${h-B} Z" fill="var(--chart-2)" fill-opacity=".12"/><path d="${d}" fill="none" stroke="var(--chart-1)" stroke-width="2"/>
   ${pontos.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.y)}" r="${i===pontos.length-1?4.5:2.5}" fill="${i===pontos.length-1?"var(--chart-2)":"var(--chart-1)"}"/>`).join("")}
   ${pontos.map((p,i)=>(i%Math.ceil(pontos.length/5)===0||i===pontos.length-1)?`<text x="${X(i)}" y="${h-8}" font-size="11" text-anchor="middle" fill="var(--muted)">${p.x}</text>`:"").join("")}
   <text x="${X(pontos.length-1)-8}" y="${Y(last.y)-10}" font-size="12" text-anchor="end" fill="var(--ink)" font-weight="500">${fmt(last.y,0)}</text></svg>`;
}
function barrasAlvo(v){
  const ks=Object.keys(MUSC).filter(k=>v[k]>0||["quad","glut","post","peito","costas","ombro"].includes(k)), w=W(), rowH=28, L=98, R=40, h=ks.length*rowH+28, max=20, X=x=>L+x*(w-L-R)/max;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Séries por músculo na semana contra o alvo">${[0,5,10,15,20].map(t=>`<line x1="${X(t)}" x2="${X(t)}" y1="6" y2="${h-22}" stroke="var(--chart-grid)"/><text x="${X(t)}" y="${h-6}" font-size="11" text-anchor="middle" fill="var(--muted)">${t}</text>`).join("")}
   ${ks.map((k,i)=>{ const y=8+i*rowH,[a,b]=ALVO[k],val=v[k]||0,cor=val>=a&&val<=b?"var(--good)":val<a?"var(--warn)":"var(--crit)"; return `<text x="${L-8}" y="${y+14}" font-size="12" text-anchor="end" fill="var(--ink)">${MUSC[k]}</text><rect x="${X(a)}" y="${y+2}" width="${X(b)-X(a)}" height="18" fill="var(--chart-2)" fill-opacity=".16" rx="3"/><rect x="${L}" y="${y+6}" width="${Math.max(2,X(Math.min(val,max))-L)}" height="10" fill="${cor}" rx="2"/><text x="${X(Math.min(val,max))+6}" y="${y+15}" font-size="11.5" fill="var(--ink)">${fmt(val,1)}</text>`; }).join("")}</svg>`;
}
let exSel=null;
function renderEvo(){
  if(!CTX||CTX.ok===false){ vEvo.innerHTML=""; return; }
  const h=historico();
  if(!h.length){ vEvo.innerHTML=`<div class="card"><h3>Ainda sem treinos registrados</h3><p class="sub">Depois da primeira sessão, a sua evolução aparece aqui: força estimada por exercício, séries por músculo e frequência.</p></div>`; return; }
  const comE1=[...new Set(h.flatMap(s=>s.series.map(x=>x.ex)))].filter(k=>serieE1(k).length);
  if(!exSel||!comE1.includes(exSel)) exSel=comE1[0]||null;
  const g=comE1.map(k=>{ const p=serieE1(k); return {k, g:p.length>1?(p.at(-1).y/p[0].y-1)*100:null}; }).filter(x=>x.g!=null);
  const sobe=g.filter(x=>x.g>=2).length;
  const semanas=new Map(); for(const s of h){ const k=semanaDe(s.data); semanas.set(k,(semanas.get(k)||0)+1); }
  const ult8=[...semanas.entries()].sort((a,b)=>a[0]<b[0]?-1:1).slice(-8), alvoSem=(prog()&&prog().sessoes_semana)||3;
  const semC=[...semanas.keys()].sort().filter(k=>k<semanaDe(HOJE())).at(-1) || [...semanas.keys()].sort().at(-1);
  const vol={}; for(const s of h) if(semanaDe(s.data)===semC) for(const x of s.series) if((x.rir==null?0:x.rir)<=4) for(const [m,f] of Object.entries(EX(x.ex).m||{})) vol[m]=(vol[m]||0)+ +f;
  const pts=exSel?serieE1(exSel):[], ganho=pts.length>1?(pts.at(-1).y/pts[0].y-1)*100:0;
  const titulo = g.length ? `${sobe>=g.length/2?"Sim":"Ainda pouco"}: sua força estimada subiu em ${sobe} de ${g.length} exercícios desde ${br(h[0].data)}` : `${h.length} ${h.length===1?"sessão registrada":"sessões registradas"} desde ${br(h[0].data)}`;
  vEvo.innerHTML=`<div><div class="kicker">Estou evoluindo?</div><h2>${titulo}</h2><p class="sub">Força estimada = carga × (1 + (repetições + as que sobravam) ÷ 30), pela melhor série de cada sessão. Não precisa testar o máximo.</p></div>
   ${exSel?`<div class="card"><div class="row between"><label for="exsel" class="lbl">Exercício</label><select id="exsel">${comE1.map(k=>`<option value="${k}"${k===exSel?" selected":""}>${esc(EX(k).nome)}</option>`).join("")}</select></div>
     <div class="row" style="gap:24px;margin:10px 0 4px"><div><div class="big">${pts.length?fmt(pts.at(-1).y,0):"-"} kg</div><div class="note">última sessão</div></div>${pts.length>1?`<div><div class="big ${ganho>=0?"pos":"neg"}">${ganho>=0?"+":""}${fmt(ganho)}%</div><div class="note">desde ${pts[0].x}</div></div>`:""}</div>
     ${linha(pts,{rot:"Força estimada em kg por sessão"})}</div>`:""}
   <div class="card"><div class="kicker">Frequência</div><h3>Sessões por semana, alvo ${alvoSem}</h3><div class="chips" style="margin-top:8px">${ult8.map(([k,n])=>`<span class="chip" style="cursor:default" aria-pressed="${n>=alvoSem}">${br(k)} · ${n}</span>`).join("")}</div></div>
   ${Object.keys(vol).length?`<div class="card"><div class="kicker">Semana de ${br(semC)}</div><h3>Séries por músculo contra o alvo</h3><p class="sub">Série como músculo principal conta 1; como ajudante, 0,5.</p>${barrasAlvo(vol)}</div>`:""}
   ${(CTX.versoes||[]).length?`<div class="card"><div class="kicker">Seu programa</div>${CTX.versoes.map(v=>`<div style="padding:8px 0;border-top:1px solid var(--line)"><b>${esc(v.nome)} v${v.versao}</b> <span class="mono note">${v.inicio?br(v.inicio):""} → ${v.fim?br(v.fim):"hoje"}</span>${v.mudanca?`<div class="note">${esc(v.mudanca)}</div>`:""}</div>`).join("")}</div>`:""}`;
}
vEvo.addEventListener("change",e=>{ if(e.target.id==="exsel"){ exSel=e.target.value; renderEvo(); } });

/* ---------- carga inicial ---------- */
function carregar(){
  if(!TOKEN){ render(); return Promise.resolve(); }
  return rpc("hag_treino_contexto",{p_token:TOKEN}).then(r=>{
    CTX=r; if(r && r.ok) store.set("hagtreino.ctx",r);
    if(r && r.ok && r.paciente) document.getElementById("titulo").textContent="Treino de "+r.paciente.nome;
    if(S.fase==="inicio") S.diaId=null;
    render(); renderEvo();
  }).catch(()=>{ if(CTX && CTX.ok){ render(); renderEvo(); } else vHoje.innerHTML=`<div class="card"><h3>Sem conexão</h3><p class="sub">Não consegui carregar o seu treino agora. Verifique o sinal e toque em tentar de novo.</p><button type="button" class="btn small ghost" data-a="recarregar" style="margin-top:10px">Tentar de novo</button></div>`; });
}
const tabs=[...document.querySelectorAll("nav.tabs button")];
function abrir(v){ tabs.forEach(t=>t.setAttribute("aria-selected",String(t.dataset.v===v))); vHoje.hidden=v!=="hoje"; vEvo.hidden=v!=="evo"; elTimer.style.display=v==="hoje"?"":"none"; if(v==="evo") renderEvo(); }
tabs.forEach(t=>t.addEventListener("click",()=>abrir(t.dataset.v)));
window.addEventListener("online",enviarFila);
let rz; window.addEventListener("resize",()=>{ clearTimeout(rz); rz=setTimeout(renderEvo,200); });
/* sessão interrompida no mesmo dia (tela fechada sem querer) volta de onde parou */
const rasc=store.get("hagtreino.rascunho",null);
if(rasc && rasc.dia===HOJE() && rasc.S && rasc.S.fase==="treino"){ S=Object.assign(novoEstado(),rasc.S); }
if(CTX && CTX.ok){ if(CTX.paciente) document.getElementById("titulo").textContent="Treino de "+CTX.paciente.nome; render(); }
enviarFila().then(sent=>{ if(!sent) carregar(); });
})();
</script>
