<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A0E17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HAG Treino">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icone-treino-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icone-treino-192.png">
<title>HAG Treino</title>
<!-- HAG_TREINO_v1 (01/10/2026)
     App do paciente. Entra pelo link pessoal (?t=TOKEN), nunca por login: as duas unicas
     funcoes que respondem ao anonimo sao hag_treino_contexto e hag_treino_salvar, e as duas
     so devolvem o treino do dono do token. Nenhuma tabela treino_* tem leitura anonima.
     Sem IA: a sugestao de carga sai da regra do programa e mostra a conta. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<script>/* HAG_TEMA_CLARO_v1: aplica a escolha antes de desenhar, sem piscar */try{if(localStorage.getItem("hagtreino.tema")==="claro")document.documentElement.dataset.tema="claro"}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* HAG_TREINO_NOTURNO_v1 (15/10/2026). O Dr. Henrique escolheu a versao 2 "Noturno" entre tres direcoes
   (canvas "HAG Treino · 3 versoes finais"): fundo quase preto, numeros grandes em Barlow Condensed, texto em Manrope,
   ouro so na acao, verde no progresso, ambar no descanso. Tema escuro sempre (e a identidade escolhida), por isso
   a antiga troca automatica claro/escuro saiu. So aparencia: nenhuma regra, registro ou envio mudou. */
:root{
  --bg:#0A0E17; --surface:#131A28; --cream:#1A2233; --ink:#F1F2F5; --ink-2:#A9B1C2; --muted:#8A93A7;
  --line:#252F44; --gold:#E3B964; --gold-ui:#E3B964; --gold-soft:rgba(227,185,100,.14); --navy:#1E2738; --on-navy:#F1F2F5;
  --good:#5DD39E; --warn:#F0B35A; --crit:#FF8A80; --good-bg:rgba(93,211,158,.12); --warn-bg:rgba(240,179,90,.13); --crit-bg:rgba(255,138,128,.12);
  --chart-1:#F1F2F5; --chart-2:#E3B964; --chart-grid:#1E2738; --btn:#E3B964; --on-btn:#1A1405;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Manrope","Helvetica Neue",Arial,sans-serif; --mono:"Manrope","Helvetica Neue",Arial,sans-serif;
  --tile:#1E2738; --rest:#F0B35A; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;margin:0}
button{font:inherit;color:inherit}
input{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 64px}
header.top{background:var(--navy);color:var(--on-navy);padding:calc(14px + env(safe-area-inset-top)) 16px 0}
header.top .in{max-width:560px;margin:0 auto}
.brand{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-ui)}
h1{font-family:var(--display);font-weight:700;font-size:24px;margin:2px 0 0}
nav.tabs{display:flex;gap:0;margin-top:10px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{font-size:15px;background:none;border:0;color:var(--on-navy);opacity:.72;padding:10px 6px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;flex:0 0 auto}
nav.tabs button[aria-selected="true"]{opacity:1;border-bottom-color:var(--gold-ui);font-weight:700}
:focus-visible{outline:2px solid var(--gold-ui);outline-offset:2px}
section.view{display:flex;flex-direction:column;gap:14px;padding-top:16px}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
h2{font-family:var(--display);font-size:22px;margin:2px 0 0;line-height:1.2}
h3{font-family:var(--display);font-size:18px;margin:0}
.sub{color:var(--ink-2);font-size:14px;margin:4px 0 0}
.note{font-size:13px;color:var(--ink-2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.btn{font-weight:700;padding:14px 18px;border-radius:10px;border:0;background:var(--btn);color:var(--on-btn);cursor:pointer;font-size:16px}
.btn.wide{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:8px 12px;font-size:14px;font-weight:500}
.btn:disabled{opacity:.5}
.link{background:none;border:0;padding:6px 2px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px}
.chip{font-family:var(--mono);font-size:13px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;min-height:36px}
.chip[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold-ui);font-weight:500}
.chip.pain[aria-pressed="true"]{background:var(--crit-bg);border-color:var(--crit);color:var(--crit)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.mono{font-family:var(--mono)}
.pos{color:var(--good)} .neg{color:var(--crit)}
.bloco{background:var(--navy);color:var(--on-navy);border-radius:12px;padding:14px 16px}
.bloco .kicker{color:var(--gold-ui)}
.bloco .semanas{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:10px}
.bloco .sem{border-top:3px solid rgba(244,238,223,.25);padding-top:4px;font-size:12px;opacity:.8}
.bloco .sem.on{border-top-color:var(--gold-ui);opacity:1;font-weight:700}
.lista .it{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line)}
.lista .it:first-child{border-top:0}
.lista .it .r{font-family:var(--mono);font-size:13px;text-align:right}
.lista .it .s{font-size:12.5px;color:var(--muted)}
.ready .q{display:grid;grid-template-columns:1fr;gap:4px;padding:6px 0}
.semaforo{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;font-size:14px}
.semaforo i{width:12px;height:12px;border-radius:50%;flex:none;margin-top:4px}
.semaforo.g{background:var(--good-bg)} .semaforo.g i{background:var(--good)}
.semaforo.y{background:var(--warn-bg)} .semaforo.y i{background:var(--warn)}
.semaforo.r{background:var(--crit-bg)} .semaforo.r i{background:var(--crit)}
.prog{display:flex;gap:4px}
.prog i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.prog i.d{background:var(--gold-ui)} .prog i.c{background:var(--btn)}
.exname{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.15;margin:4px 0 0}
.cue{font-size:15px;color:var(--ink-2);margin:6px 0 0}
.porque{background:var(--cream);border-left:3px solid var(--gold-ui);padding:10px 12px;border-radius:0 8px 8px 0;font-size:14px}
.serie{text-align:center;padding:18px 12px 6px}
.serie .k{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.serie .alvo{font-family:var(--display);font-size:38px;font-weight:700;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.motivo{font-size:13px;color:var(--ink-2);margin-top:6px}
.lock{background:var(--crit-bg);color:var(--crit);font-size:14px;padding:10px 12px;border-radius:8px}
.aviso{background:var(--warn-bg);color:var(--ink);font-size:14px;padding:10px 12px;border-radius:8px}
/* HAG_TREINO_ENTRADA_v1 (09/10/2026): entrada em duas etapas, escalas grandes, escolha do esforço em toques */
.esc{padding:10px 0;border-top:1px solid var(--line)} .esc:first-child{border-top:0;padding-top:2px}
.esc .t{font-size:15.5px;font-weight:700;margin-bottom:6px}
.esc .g{display:grid;gap:6px}
.esc .g .chip{min-height:46px;font-size:17px;border-radius:10px;padding:0}
.esc .l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.grupo{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);padding:12px 0 2px}
.grupo:first-child{padding-top:0}
/* HAG_TREINO_CIRCUITO_v1 */
.circ{font-size:12.5px;color:var(--muted);padding:10px 0 4px;border-top:1px dashed var(--line)} .circ b{color:var(--ink);font-weight:600}
.circ + .it{border-top:0}
.prog.muitos{gap:1px}
details.outro{font-size:14px} details.outro summary{cursor:pointer;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;padding:6px 0;text-align:center;list-style:none}
details.outro .chips{margin-top:8px;justify-content:center}
/* HAG_TREINO_CATALOGO_v1 (23/10/2026): cards do catálogo de programas */
.catg{display:flex;flex-direction:column;gap:10px}
.catc{display:block;width:100%;text-align:left;cursor:pointer;border-left:4px solid var(--cc,var(--gold));position:relative}
.catc h3{font-size:19px}
.catc .meta{font-size:13px;color:var(--ink-2);margin-top:2px}
.catc .st{margin-top:8px;font-size:12.5px;font-family:var(--mono);letter-spacing:.04em;color:var(--cc,var(--gold))}
.catc.tranc{opacity:.62;border-left-color:var(--line)}
.catc.tranc .st{color:var(--muted)}
.catc .cad{position:absolute;top:14px;right:14px;color:var(--muted)}
.catc .info{margin-top:8px;font-size:13.5px;color:var(--ink-2)}
/* HAG_TREINO_CATALOGO_FOTO_v1 (23/10/2026): foto de cada card (feitas pelo Dr.); trancado fica em cinza com o cadeado por cima */
.catc.comfoto{overflow:hidden}
.catc .catimg{display:block;width:calc(100% + 32px);max-width:none;margin:-16px -16px 12px;aspect-ratio:16/7;object-fit:cover;background:var(--line)}
.catc.tranc .catimg{filter:grayscale(1) brightness(.8)}
.catc.comfoto .cad{top:10px;right:10px;background:rgba(10,14,23,.72);color:#fff;border-radius:999px;padding:4px 9px;font-size:13px}
.cathero{display:block;width:100%;aspect-ratio:16/8;object-fit:cover;border-radius:14px;background:var(--line)}
/* HAG_TREINO_TRILHAS_v1 (23/10/2026): trilhas com cards que deslizam para o lado */
.trilha{display:flex;flex-direction:column;gap:8px}
.trilha .th h3{font-family:var(--display);font-size:20px;margin:2px 0 0;line-height:1.15}
.trilha .th .tn{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.trow{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.trow::-webkit-scrollbar{display:none}
.trow>.catc{flex:0 0 80%;max-width:340px;scroll-snap-align:start;margin:0}
.catc .catph{display:flex;align-items:flex-end;width:calc(100% + 32px);margin:-16px -16px 12px;aspect-ratio:16/7;padding:12px 14px;box-sizing:border-box;
  background:radial-gradient(120% 140% at 85% 0%,var(--cc,var(--gold)) 0%,transparent 55%),linear-gradient(160deg,#1A2233 0%,#0A0E17 100%);
  font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:rgba(255,255,255,.78);text-transform:uppercase}
.catc.tranc .catph{filter:grayscale(1) brightness(.85)}
.catc .passo{display:inline-block;margin-top:8px;font-size:11.5px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;color:#1A1405;background:var(--cc,var(--gold));border-radius:999px;padding:3px 9px}
.trilha .prog{font-size:12.5px;font-family:var(--mono);color:var(--cc,var(--gold))}
/* HAG_TREINO_ESCOLHA_DO_DIA_v1 (23/10/2026): escolher o treino do dia dentro da semana */
.tdias{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tdias button{position:relative;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 10px 9px;text-align:left;min-height:66px;cursor:pointer;font:inherit}
.tdias button b{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
.tdias button span{display:block;font-size:14px;font-weight:650;margin-top:3px;line-height:1.2}
.tdias button[aria-pressed="true"]{border-color:var(--cc,var(--gold));box-shadow:inset 0 0 0 1px var(--cc,var(--gold))}
.tdias button.ok b{color:#5DD39E}
.tdias button.sug::after{content:"";position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--cc,var(--gold))}
.diadet{border-color:var(--cc,var(--gold))}
.diadet ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14.5px}
.diadet ol small{color:var(--ink-2);font-size:12.5px}
.semstrip button.feita{color:#5DD39E}
.semstrip button.tranc{opacity:.45}

/* HAG_TREINO_MENTE_v1: tocador de respiração e meditação */
.mente{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.mcirc{width:220px;height:220px;border-radius:50%;margin:10px auto 4px;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 45%,rgba(183,156,240,.55),rgba(108,180,240,.18) 62%,transparent 70%);border:2px solid rgba(183,156,240,.55);
  transform:scale(.55);transition-property:transform;transition-timing-function:ease-in-out}
.mcirc span{font-family:var(--mono);font-size:30px;color:var(--ink)}
.mfase{font-family:var(--display);font-size:24px;font-weight:700;min-height:30px}
.mtexto{font-size:19px;line-height:1.45;max-width:30ch;min-height:110px;display:flex;align-items:center;justify-content:center}
.mbar{width:100%;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.mbar i{display:block;height:100%;width:0;background:#B79CF0;transition:width .25s linear}
.mrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;width:100%}
.mrow .btn{flex:1;min-width:130px}

.semstrip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.semstrip::-webkit-scrollbar{display:none}
.semstrip button{flex:0 0 auto;min-width:44px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-family:var(--display);font-size:16px;font-weight:700}
.semstrip button[aria-pressed="true"]{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}
.semstrip button.atual{border-color:var(--gold-ui)}
.catsess .ok{color:var(--good);font-size:12.5px;margin-top:2px}
.cathoje{display:flex;flex-direction:column;gap:6px}
.cathoje .chips{display:flex;gap:6px;flex-wrap:wrap}
.cathoje .chip small{display:block;font-size:11px;color:var(--ink-2)}
/* HAG_TREINO_PROGRAMA_v1 e HAG_TREINO_LIVRE_v1 (13/10/2026) */
.escolha .chips{margin-top:8px}
.escolha .chip small{font-family:var(--body);font-size:11px;color:var(--gold);margin-left:4px}
.pdia .cab{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.pdia .tag{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold-ui);border-radius:999px;padding:2px 8px;white-space:nowrap}
.pdia .it .n{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.pdia .it .lk{grid-column:1/-1}
.livre .meta{font-size:13px;color:var(--ink-2);margin-top:2px}
.prontr{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--ink-2)}
.rpe-g{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;margin-top:8px}
.rpe-g .chip{min-height:44px;padding:0;border-radius:8px;font-size:15px}
.rirq{font-size:16px;font-weight:700;text-align:center;margin:12px 0 2px}
.rirh{font-size:12.5px;color:var(--muted);text-align:center;margin-bottom:10px}
.rirbtns{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.rirbtns button{height:64px;border-radius:12px;border:1.5px solid var(--btn);background:var(--surface);font-family:var(--display);font-size:26px;font-weight:700;cursor:pointer}
.rirbtns button.alvo{background:var(--btn);color:var(--on-btn)}
.rirbtns small{display:block;font-family:var(--body);font-size:10.5px;font-weight:400;opacity:.8;margin-top:-2px}
.ajuste{border-top:1px solid var(--line);margin-top:12px;padding-top:12px;display:flex;flex-direction:column;gap:10px}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);width:170px}
.step button{width:46px;height:42px;border:0;background:var(--cream);cursor:pointer;font-size:20px}
.step output{flex:1;text-align:center;font-family:var(--mono);font-size:15px}
.step input.stepin{flex:1;min-width:0;width:100%;height:42px;border:0;background:transparent;color:inherit;text-align:center;font-family:var(--mono);font-size:16px;padding:0;-moz-appearance:textfield;appearance:textfield}   /* HAG_TREINO_CARGA_DIGITAR_v1: 16px evita o zoom do iPhone */
.step input.stepin:focus{outline:2px solid var(--accent,#c9a96e);outline-offset:-2px}
.feitas{font-family:var(--mono);font-size:12.5px;color:var(--muted);text-align:center;margin-top:10px}
.campo{display:flex;flex-direction:column;gap:4px}
.campo input{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:10px 12px;font-family:var(--mono);font-size:16px;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.crono{font-family:var(--display);font-size:56px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1;margin:10px 0}
.timer{position:fixed;inset:auto 0 0 0;background:var(--navy);color:var(--on-navy);padding:14px 16px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px rgba(0,0,0,.18);z-index:5}
.timer .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.timer .t{font-family:var(--display);font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;min-width:120px}
.timer .lb{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ui)}
.timer .nx{font-size:13.5px;opacity:.85;flex-basis:100%;order:3}
.timer .sp{flex:1}
.timer button{background:transparent;color:var(--on-navy);border:1px solid rgba(244,238,223,.4);border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:700}
.timer.pronto{background:var(--good)}
.timer.pronto .lb{color:var(--on-navy)}
body.descansando .wrap{padding-bottom:190px}
/* HAG_TREINO_TIMER_v1 (09/10/2026): timer de isometria, descanso com barra e botões grandes de seguir */
.timer .bar{flex-basis:100%;order:4;height:6px;border-radius:3px;background:rgba(244,238,223,.18);overflow:hidden}
.timer .bar i{display:block;height:100%;background:var(--gold-ui);transition:width .2s linear}
.timer.pronto .bar i{background:var(--on-navy)}
.timer .go{background:var(--on-navy);color:var(--navy);border:0;font-size:16px;padding:12px 18px}
.iso{margin-top:6px;border:1.5px solid var(--btn);border-radius:14px;padding:14px;text-align:center;background:var(--surface)}
.iso .lb{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.iso .t{font-family:var(--display);font-size:64px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums;margin:4px 0}
.iso .bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:6px 0 12px}
.iso .bar i{display:block;height:100%;background:var(--gold-ui);transition:width .2s linear}
.iso.segura{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.iso.segura .lb{color:var(--gold-ui)}
.iso.prep,.iso.troca{background:var(--gold-soft);border-color:var(--gold-ui)}
.iso.fim{background:var(--good-bg,#E4F1EA);border-color:var(--good)}
.iso .btn{min-height:52px}
.iso.segura .btn{background:var(--on-navy);color:var(--navy)}
.navx{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:4px}

(function(){

  var SOL='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';

  function ap(c){ var r=document.documentElement; if(c) r.dataset.tema="claro"; else delete r.dataset.tema;
    var m=document.querySelector('meta[name="theme-color"]'); if(m) m.content=c?"#F3F4F6":"#0A0E17";

})();

/* ---------- regra de progressão, com o motivo escrito ---------- */
function travado(exId){
  const h=historico().filter(s=>s.series.some(x=>x.ex===exId)); const ult=h.at(-1); if(!ult) return null;
  const ser=ult.series.filter(x=>x.ex===exId); if(!ser.some(x=>x.dor>=4)) return null;
  const lib=((CTX&&CTX.liberacoes)||[]).some(l=>l.ex===exId && String(l.em)>=String(ult.data));

}
function sugestao(it){

  const h=historico().filter(s=>s.series.some(so)); const ult=h.at(-1);
  const u = un==="seg" ? "seg" : "reps", tp=tipoReg(it,ex);
  if(tp==="aquec"||tp==="mob") return {kg:+it.carga||0, reps:lo, motivo:""};
  if(trab){
    if(!ult) return {kg:+it.carga||0, reps:it.min||10, primeira:true, motivo:"Faça no seu ritmo, com boa técnica, até o apito. No fim, registre quantas saíram."};
    const st=ult.series.filter(so), best=Math.max(...st.map(x=>x.reps||0));
    return {kg:+st[0].kg||0, reps:best, motivo:`Em ${br(ult.data)}, o melhor foi ${best} em ${it.trab} s. Tente igualar ou passar, sem perder a técnica.`};
  }
  if(!ult){ const kg=+it.carga||0; return {kg, reps:lo, primeira:true, motivo: (un==="kg"&&!kg&&it.carga!==0) ? "Primeira vez neste exercício: escolha uma carga com que sobrem umas 2 ou 3 repetições." : (un==="kg"&&it.carga===0) ? "Comece com o peso do corpo." : "Primeira vez neste exercício."}; }
  const ser=ult.series.filter(so), kg=+ser[0].kg||0, quando=br(ult.data), feito=ser.map(x=>x.reps).join(", ");
  const tr=travado(exId);
  if(tr) return {kg, reps:ser[0].reps, trava:true, motivo:`Dor ${tr.dor} em ${quando}: a carga fica igual até o Dr. Henrique liberar.`};
  const alvoJ=j=>{ const r=repsVolta(it,j+1); return r!=null?r:hi; }; /* HAG_TREINO_CIRCUITO_v1: com reps por volta, cada volta tem o seu alvo */
  const topo=ser.every((x,j)=>x.reps>=alvoJ(j) && (x.rir==null || x.rir>=(it.rir==null?2:it.rir)));
  if(Array.isArray(it.rv) && it.rv.length && !topo) return {kg, reps:repsVolta(it,1), motivo:`Em ${quando} você fez ${feito}${kg?` com ${fkg(kg)} kg`:""}. Buscar ${it.rv.join(" / ")} (a carga sobe quando todas as voltas baterem o alvo).`};
  if(un!=="kg"){ /* peso do corpo ou tempo: só sobe a repetição ou o tempo */
    if(tp==="reab"){ const duas=h.slice(-2); if(duas.some(s=>s.series.filter(so).some(x=>(x.dor||0)>2))){ const r=Math.max(lo,Math.min(hi,ser[0].reps)); return {kg, reps:r, motivo:`Dor acima de 2 em uma das duas últimas sessões: mantenha ${r} ${u}.`}; } }
    if(topo) return {kg, reps:hi, motivo:`Em ${quando} você fez ${feito} ${u}: topo da faixa. Mantenha, e avise na consulta para subir a dificuldade.`};
    const passo = un==="seg"?5:1; const r=Math.min(hi, Math.max(...ser.map(x=>x.reps))+passo);

    const duas=h.slice(-2); const semDor=duas.every(s=>s.series.filter(x=>x.ex===exId).every(x=>(x.dor||0)<=2));
    if(!semDor) return {kg, reps:Math.min(hi,Math.max(lo,ser[0].reps)), motivo:`Dor acima de 2 em uma das duas últimas sessões: a carga fica em ${fkg(kg)} kg.`};
  }
  if(topo){
    let novo;
    if(regra==="forca"){ const best=Math.max(...ser.map(x=>e1rm(x.kg,x.reps,x.rir)||0)); const alvo=best/(1+(lo+(it.rir==null?2:it.rir))/30); novo=roundTo(Math.min(Math.max(alvo,kg+inc),kg*1.05+inc/2),inc); if(novo<=kg) novo=kg+inc;
      return {kg:novo, reps:lo, sobe:true, de:kg, motivo:`Em ${quando} você fez ${ser.length} × ${feito} com ${fkg(kg)} kg, força estimada de ${fmt(best,0)} kg: a carga sobe para ${fkg(novo)} kg e ${Array.isArray(it.rv)&&it.rv.length?`as voltas seguem em ${it.rv.join(" / ")}`:`as repetições voltam a ${lo}`}.`}; }

  }
  const r=Math.min(hi, Math.max(lo, Math.max(...ser.map(x=>x.reps))+1));
  return {kg, reps:r, motivo:`Em ${quando} você fez ${ser.length} × ${feito} com ${fkg(kg)} kg. Mesma carga, buscando ${r} (a carga sobe quando todas chegarem a ${hi}).`};
}

          semana:w&&!w.fim?w.w:null, itens:(s.itens||[]).map(i=>({...i, livre:!!s.pc}))};

/* ---------- HAG_TREINO_TIMER_v1 (09/10/2026): timer de isometria ----------
   Pedido do Dr. Henrique: exercício em isometria (unidade "seg") com timer do tempo a segurar, além do descanso.
   Conta 3 s para a pessoa se posicionar, segura o tempo da série com bipes nos 3 últimos segundos e apita no fim.
   Exercício unilateral (lat "u", vindo do banco) conta os dois lados, com 5 s para trocar. "Parei antes" grava o
   tempo real (no unilateral, o menor dos lados). Relógio por horário (Date.now), como o descanso: não atrasa se a
   tela travar um instante. */
let tickIso=null;
function bipCurto(){ try{ if(!audio) return; const o=audio.createOscillator(), g=audio.createGain(); o.frequency.value=660; g.gain.value=.12; o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime+.12); }catch(e){} }
function isoAtual(){ const z=S.iso; return z && z.i===S.i && z.k===(S.feitas[S.i]||[]).length ? z : null; }
function isoRodando(){ const z=isoAtual(); return !!(z && z.fase!=="fim"); }
function isoParaTudo(){ clearInterval(tickIso); S.iso=null; }
function isoHTML(ex,a,trab){
  /* HAG_TREINO_CIRCUITO_v1: o mesmo timer serve ao trabalho por tempo (trab): um lado só, e o tempo não vira repetição */
  const z=isoAtual(), lados=trab?1:(ex.lat==="u"?2:1), alvoT=trab?(itens()[S.i].trab||30):a.reps, nomeT=trab?"Trabalho":ex.mod==="mobilidade"?"Tempo":"Isometria";
  if(!z) return `<div class="iso"><div class="lb">${nomeT}${lados>1?" · cada lado":""}</div><div class="t">${mmss(alvoT)}</div>
     <button type="button" class="btn wide" data-a="isogo">▶ INICIAR TIMER</button>
     <p class="note" style="margin:8px 0 0">3 s para posicionar · apita no fim.${trab?" Seu ritmo até o apito.":""}${lados>1?" 5 s para trocar de lado.":""}</p></div>`;
  const rest=z.fase==="fim"?0:z.dur-(Date.now()-z.t0)/1000;
  if(z.fase==="fim") return `<div class="iso fim"><div class="lb">Tempo feito</div><div class="t">${mmss(z.trab?(z.feito.length?Math.min(...z.feito):alvoT):a.reps)}</div>
     <p class="note" style="margin:0 0 10px">${z.lados>1?"Contando o lado em que você aguentou menos. ":""}${z.trab?"Agora registre quantas repetições saíram.":"Agora registre a série logo abaixo."}</p>
     <button type="button" class="btn small ghost" data-a="isogo">Refazer o tempo</button></div>`;
  const lb=z.fase==="prep"?"Prepare-se":z.fase==="troca"?"Troque de lado":(z.trab?"Vai, no seu ritmo":"Segure")+(z.lados>1?` · lado ${z.lado} de ${z.lados}`:"");
  return `<div class="iso ${z.fase}"><div class="lb">${lb}</div><div class="t" id="iso-t">${z.fase==="segura"?mmss(rest):Math.max(1,Math.ceil(rest))}</div>
     <div class="bar"><i id="iso-b" style="width:${Math.max(0,Math.min(100,100*(1-rest/z.dur)))}%"></i></div>
     <button type="button" class="btn wide" data-a="isostop">${z.fase==="segura"?"PAREI ANTES":"CANCELAR"}</button></div>`;
}
function isoIniciar(){
  const it=itens()[S.i], ex=EX(it.id), trab=ehTrab(it,ex); somPronto(); pararDescanso(); clearInterval(tickIso);
  if(!trab && S.ajuste && S.iso && S.iso.alvo!=null && isoAtual()) S.ajuste.reps=S.iso.alvo;
  S.iso={i:S.i, k:(S.feitas[S.i]||[]).length, alvo:trab?it.trab:S.ajuste.reps, lados:trab?1:(ex.lat==="u"?2:1), lado:1, fase:"prep", t0:Date.now(), dur:3, feito:[], ult:null, trab};

}
function isoTick(){
  const z=S.iso; if(!z || z.fase==="fim" || z.i!==S.i || S.fase!=="treino"){ clearInterval(tickIso); return; }
  const rest=z.dur-(Date.now()-z.t0)/1000, s=Math.ceil(rest);
  if(rest>0 && s<=3 && z.ult!==s && (z.fase==="segura"||z.fase==="prep")){ z.ult=s; bipCurto(); }
  if(rest<=0){ z.ult=null;
    if(z.fase==="prep"){ z.fase="segura"; z.t0=Date.now(); z.dur=Math.max(1,z.alvo); bip(); }
    else if(z.fase==="segura"){ z.feito.push(z.alvo); if(z.lado<z.lados){ z.fase="troca"; z.t0=Date.now(); z.dur=5; bip(); } else return isoFim(); }
    else if(z.fase==="troca"){ z.lado++; z.fase="segura"; z.t0=Date.now(); z.dur=Math.max(1,z.alvo); bip(); }
    return render(); }
  const el=document.getElementById("iso-t"); if(el) el.textContent=z.fase==="segura"?mmss(rest):String(Math.max(1,s));

}

}
function isoFim(){
  const z=S.iso; clearInterval(tickIso); if(!z) return; z.fase="fim"; bip();
  const feito=z.feito.length?Math.min(...z.feito):0;
  if(S.ajuste && !z.trab && feito!==z.alvo){ S.ajuste.reps=feito; S.ajuste.mexeu=true; }

/* ---------- descanso: relógio por horário, tela acesa, som e cor ao terminar ---------- */
function bip(){ try{ if(!audio) return; const o=audio.createOscillator(), g=audio.createGain(); o.frequency.value=880; g.gain.value=.15; o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime+.3); }catch(e){} try{ navigator.vibrate && navigator.vibrate([200,80,200]); }catch(e){} }
function iniciarDescanso(seg, proxima){ if(!seg||seg<=0) return; descanso={fim:Date.now()+seg*1000, total:seg, proxima, avisou:false, ult:null}; elTimer.hidden=false; document.body.classList.add("descansando"); clearInterval(tick); tick=setInterval(desenharTimer,250); desenharTimer(); }
function desenharTimer(){
  if(!descanso) return; const rest=(descanso.fim-Date.now())/1000;
  if(rest<=0 && !descanso.avisou){ descanso.avisou=true; bip(); }
  const s3=Math.ceil(rest); if(rest>0 && s3<=3 && descanso.ult!==s3){ descanso.ult=s3; bipCurto(); }
  const pronto=rest<=0; elTimer.classList.toggle("pronto",pronto);
  const novoEx=/^Próximo/.test(descanso.proxima||""), pct=Math.max(0,Math.min(100,100*(1-rest/(descanso.total||1))));
  elTimer.innerHTML=`<div class="in"><div><div class="lb">${pronto?(novoEx?"Próximo exercício pronto":"Próxima série pronta"):"Descanso"}</div><div class="t">${pronto?"0:00":mmss(rest)}</div></div><div class="sp"></div>${pronto?`<button type="button" class="go" data-t="fechar">${novoEx?"IR AO EXERCÍCIO ›":"SEGUIR PARA A SÉRIE ›"}</button>`:`<button type="button" data-t="menos" aria-label="Tirar 15 segundos">−15 s</button><button type="button" data-t="mais" aria-label="Somar 30 segundos">+30 s</button><button type="button" class="go" data-t="pular">COMEÇAR JÁ ›</button>`}<div class="nx">${esc(descanso.proxima)}</div><div class="bar"><i style="width:${pct}%"></i></div></div>`;
}
function pararDescanso(){ clearInterval(tick); descanso=null; elTimer.hidden=true; elTimer.classList.remove("pronto"); document.body.classList.remove("descansando"); }
elTimer.addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b||!descanso) return; if(b.dataset.t==="mais"){ descanso.fim+=30000; descanso.total+=30; } if(b.dataset.t==="menos") descanso.fim=Math.max(Date.now(),descanso.fim-15000); if(b.dataset.t==="pular") return pararDescanso(); if(b.dataset.t==="fechar") return pararDescanso(); desenharTimer(); });
async function manterTelaAcesa(){ try{ if("wakeLock" in navigator) wakeLock=await navigator.wakeLock.request("screen"); }catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ if(S.fase==="treino") manterTelaAcesa(); desenharTimer(); enviarFila(); } });
function somPronto(){ if(!audio){ try{ audio=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }

function avancar(descansoSeg, deIt){
  /* HAG_TREINO_CIRCUITO_v1: avança para o próximo passo (no circuito, o próximo exercício da volta ou a próxima volta) */
  const its=itens(), ps=passos(), kp=passoAtual(ps); S.abrirAjuste=false; S.verPq=false; S.verVideo=false; S.ajuste=null;
  if(kp<ps.length-1){ const np=ps[kp+1]; irPasso(np); const nx=its[S.i]; let txt="Próximo: "+EX(nx.id).nome; if(np.b) txt+=` · volta ${np.v} de ${np.V}`;
    if((nx.mod==="forca"||nx.mod==="mobilidade") && !ehTrab(nx)){ const sg=sugestao(nx), rv=np.b?repsVolta(nx,np.v):null; if(EX(nx.id).un==="kg"&&sg.kg) txt+=` · ${fkg(sg.kg)} kg × ${rv!=null?rv:sg.reps}`; }
    iniciarDescanso(descansoSeg, txt); }

function registrar(rir){
  const its=itens(), it=its[S.i], a=S.ajuste; somPronto();
  (S.feitas[S.i] ||= []).push({ex:it.id, orig:it.orig!==it.id?it.orig:null, kg:a.kg, reps:a.reps, rir, dor:a.dor, local:a.local, lado:a.lado, tipo:a.tipo, sug:a.sug, um:!a.mexeu, trab:ehTrab(it,EX(it.id))?it.trab:null});

  const n=S.feitas[S.i].length, tpR=tipoReg(it,EX(it.id)), descR=(tpR==="aquec"||tpR==="mob")?0:it.desc; /* aquecimento e mobilidade: sem relógio de descanso entre um e outro */
  if(it.bloco){ const ps=passos(); avancar(descansoApos(ps,passoAtual(ps)), it); } /* HAG_TREINO_CIRCUITO_v1 */
  else if(n>=it.ns) avancar(descR, it); else { const kgTxt=EX(it.id).un==="kg"?`${fkg(a.kg)} kg × ${a.reps}`:`${a.reps}`; S.ajuste=null; iniciarDescanso(descR, `Próxima: série ${n+1} · ${kgTxt}`); }

function salvarRascunho(){ store.set("hagtreino.rascunho",{dia:HOJE(), S:{...S, crono:null, ajuste:null, iso:null}}); }

    return false;
  }).catch(()=>{ enviarFila.ocupado=false; return false; });
}
function salvar(){
  const rpe=S.rpe!=null?S.rpe:(S.cv?5:null), dur=+document.getElementById("dur").textContent||0; if(rpe==null) return; const d=diaAtual(); const its=itens();
  const {series,cardio,hyrox}=coletar();
  const antes={}; for(const s of historico()) for(const x of s.series){ if(x.trab) continue; const v=e1rm(x.kg,x.reps,x.rir); if(v&&(!antes[x.ex]||v>antes[x.ex])) antes[x.ex]=v; }
  const pr=(!S.prontPulou && Object.values(S.pront).every(v=>v!=null))?{...S.pront}:null;
  const payload={client_id:uid(), data:HOJE(), dia_id:d.id, dia:d.nome, tipo:d.tipo, cat:d.cat||null, cs:d.cs||null, /* HAG_TREINO_CATALOGO_v1 */ inicio:S.inicio?new Date(S.inicio).toISOString():null, dur, rpe, pront:pr, cv:S.cv, series, cardio, hyrox, ...(S.notaCorrida?{nota:S.notaCorrida}:{})}; /* HAG_TREINO_CORRIDA_GUIADA_v1: parada por dor vai na nota da sessão */
  FILA.push(payload); store.set("hagtreino.fila",FILA); store.del("hagtreino.rascunho");
  const rec=[], vistos=new Set();
  for(const x of series){ if(x.trab) continue; const v=e1rm(x.kg,x.reps,x.rir); if(v&&antes[x.ex]&&v>antes[x.ex]+.05&&!vistos.has(x.ex)){ rec.push(`${esc(EX(x.ex).nome)}: força estimada ${fmt(v)} kg (melhor anterior ${fmt(antes[x.ex])})`); vistos.add(x.ex);} }
  const dor=[...new Set(series.filter(x=>x.dor>=4).map(x=>EX(x.ex).nome))];

/* HAG_TREINO_CARGA_DIGITAR_v1 (28/10/2026): a carga tambem se digita. Grava ao confirmar (Enter, OK do
   teclado ou sair do campo), nao a cada tecla, para o campo nao perder o foco no meio da digitacao.
   Aceita virgula. Vazio ou invalido volta ao valor anterior. Teto de 500 kg contra erro de digitacao. */
function cargaDigitada(t){
  const v=String(t.value||"").trim().replace(",",".");
  const n=v===""?NaN:+v;
  if(t.dataset.in==="kg"){ const A=S.ajuste; if(!A) return;
    if(!isFinite(n) || n<0 || n>500){ t.value=fkgIn(A.kg); return; }
    const novo=Math.round(n*100)/100; if(novo===A.kg) return;
    A.kg=novo; if(A.sug) A.mexeu=true; return render(); }
  if(t.dataset.in==="hx"){ if(!S.cargaHx) return;
    if(!isFinite(n) || n<0 || n>500){ t.value=fkgIn(S.cargaHx.kg); return; }
    const novo=Math.round(n*100)/100; if(novo===S.cargaHx.kg) return;
    S.cargaHx.kg=novo; return render(); }
}
vHoje.addEventListener("change", e=>{ if(e.target.dataset && e.target.dataset.in) cargaDigitada(e.target); });
vHoje.addEventListener("keydown", e=>{ if(e.key==="Enter" && e.target.dataset && e.target.dataset.in){ e.preventDefault(); e.target.blur(); } });

  if(t.id==="rpe"){ document.getElementById("rpe-v").textContent=t.value; document.getElementById("rpe-t").textContent=rpeTexto(+t.value); }

});

const semanaDe = s => { const d=new Date(s+"T12:00:00Z"); const dow=(d.getUTCDay()+6)%7; d.setUTCDate(d.getUTCDate()-dow); return d.toISOString().slice(0,10); };

  if(a==="catvolta"){ catAberto=null; catReini=null; catSel=null; catAvisoSem=null; vLivre.style.removeProperty("--cc"); window.scrollTo(0,0); return renderLivre(); }
  if(a==="vittranc"){ vitTranc=b.dataset.v==="1"; cats().forEach(c=>{ c.lib=!vitTranc; }); catAberto=null; catInfo=null; render(); return renderLivre(); }   /* HAG_TREINO_VITRINE_v1 */
  if(a==="catsem"){ const c=cats().find(x=>x.id===catAberto), p=c&&progCat(c), v=+b.dataset.v;   /* HAG_TREINO_SEMANA_POR_CONCLUSAO_v1 */
    if(p && !p.fim && v>p.w){ catAvisoSem=v; return renderLivre(); } catAvisoSem=null; catSem=v; catSel=null; return renderLivre(); }
  if(a==="catdia"){ catSel=b.dataset.v; return renderLivre(); }
  if(a==="nivel"){ store.set(b.dataset.k||"hagtreino.nivel",b.dataset.v); catSel=null; return renderLivre(); }
  if(a==="catreini"){
    const id=b.dataset.v; if(catReini!==id){ catReini=id; return renderLivre(); }
    catReini=null; const c=cats().find(x=>x.id===id); if(c) c.inicio=null; catSem=null; renderLivre();
    return rpc("hag_treino_catalogo_iniciar",{p_token:TOKEN,p_id:id,p_reiniciar:true}).then(()=>carregar()).catch(()=>{});
  }
  if(a==="livrever"){
    const r=sessCat(b.dataset.v);
    /* primeiro treino de um programa com semanas: a semana 1 começa hoje */
    if(r && r.c.tipo==="programa" && !r.c.inicio){ r.c.inicio=HOJE(); rpc("hag_treino_catalogo_iniciar",{p_token:TOKEN,p_id:r.c.id,p_reiniciar:false}).catch(()=>{}); }
    if(!emAndamento()){ S=novoEstado(); S.livre=b.dataset.v; if(M && !M.rodando) M=null; }   /* HAG_TREINO_MENTE_v1: tocador começa do zero */
    abrir("hoje"); render(); window.scrollTo(0,0);
  }
}
vLivre.addEventListener("click",e=>{ const b=e.target.closest("[data-a]"); if(b) catAcao(b); });
vLivre.addEventListener("keydown",e=>{ if(e.key!=="Enter"&&e.key!==" ") return; const b=e.target.closest('[data-a="cat"]'); if(b){ e.preventDefault(); catAcao(b); } });


/* ---------- HAG_TREINO_MENTE_v1 (23/10/2026): Mente e respiração ----------
   Pedido do Dr. Henrique: trilha de mobilidade, meditação guiada e respiração. Sessão com "mente" não tem exercícios:
   tipo "resp" = fases (inspire/segure/solte) num círculo que cresce e diminui, repetidas em ciclos; tipo "guia" = passos de
   texto falados pela voz do próprio aparelho (pt-BR), cada um com o seu tempo. No fim sobe como sessão "Mente", com
   esforço 0, para não pesar na carga de treino. A voz pode ser desligada (fica guardado no aparelho). */
let M=null;
function vozPt(){ try{ const vs=speechSynthesis.getVoices().filter(v=>/^pt(-|_)BR/i.test(v.lang)); return vs.find(v=>/luciana|francisca|google|felipe/i.test(v.name))||vs[0]||null; }catch(e){ return null; } }
function falar(t){ if(!M||!M.voz||!t||!("speechSynthesis" in window)) return; try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang="pt-BR"; u.rate=.92; const v=vozPt(); if(v) u.voice=v; speechSynthesis.speak(u); }catch(e){} }
function tomSuave(){ try{ if(!audio) audio=new (window.AudioContext||window.webkitAudioContext)(); const o=audio.createOscillator(), g=audio.createGain(); o.frequency.value=432; g.gain.setValueAtTime(.0001,audio.currentTime); g.gain.exponentialRampToValueAtTime(.08,audio.currentTime+.05); g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+1.2); o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime+1.3); }catch(e){} }
function mPlano(m){
  /* devolve a linha do tempo [{ini, s, f, t}] e o total em segundos */
  const L=[]; let t=0;
  if(m.tipo==="resp"){
    L.push({ini:0, s:8, f:"prep", t:"Prepare-se", fala:m.intro||""}); t=8;
    for(let c=0;c<(m.ciclos||1);c++) for(const f of (m.fases||[])){ L.push({ini:t, s:f.s, f:f.f, t:f.t, c:c+1, fala:f.t}); t+=f.s; }
  } else for(const p of (m.passos||[])){ L.push({ini:t, s:p.s, f:"guia", t:p.t, fala:p.t}); t+=p.s; }
  return {L, total:t};
}
function mElapsed(){ return M.acum + (M.rodando ? (Date.now()-M.t0)/1000 : 0); }
function renderMente(r){
  const {c,s}=r, m=s.mente, key=c.id+"|"+s.id;
  if(!M || M.key!==key){ let voz=true; try{ voz=store.get("hagtreino.voz",true)!==false; }catch(e){} M={key, c, s, m, ...mPlano(m), acum:0, t0:0, rodando:false, idx:-1, fim:false, salvo:false, voz}; }
  const resp=m.tipo==="resp";
  vHoje.innerHTML=`${filaHTML()}<div><div class="kicker">${esc(c.nome)}</div><h2>${esc(s.nome)}</h2><p class="sub">${esc(s.foco||"")} · ~${esc(s.min||Math.round(M.total/60))} min</p></div>
  <div class="card mente">
    ${resp?`<div class="mcirc" id="mCirc"><span id="mConta">${M.fim?"✓":""}</span></div><div class="mfase" id="mFase">${M.fim?"Concluído":"Pronto"}</div>`:""}
    <div class="mtexto" id="mTexto">${esc(M.fim?(resp?(m.fim||""):"Sessão concluída."):(resp?(m.intro||""):"Encontre um lugar tranquilo. Se puder, use fone de ouvido."))}</div>
    <div class="mbar"><i id="mProg" style="width:${M.fim?100:0}%"></i></div>
    <div class="note" id="mTempo">${M.fim?"Concluído · "+mmss(mElapsed()):mmss(M.total)+" no total"}</div>
    ${M.fim?`<div class="mrow">${M.salvo?`<p class="note" style="margin:0">Registrado no seu histórico.</p>`:`<button type="button" class="btn" data-a="msalvar">Registrar</button>`}<button type="button" class="btn ghost" data-a="msair">Voltar a ${esc(c.nome)}</button></div>`
      :`<div class="mrow"><button type="button" class="btn" data-a="mplay" id="mPlay">${M.rodando?"Pausar":(M.acum>0?"Continuar":"Começar")}</button>${M.acum>0||M.rodando?`<button type="button" class="btn ghost" data-a="mfim">Encerrar</button>`:""}</div>
       <button type="button" class="link" data-a="mvoz" aria-pressed="${M.voz}">Voz guia: ${M.voz?"ligada":"desligada"}</button>
       ${M.acum>0||M.rodando?"":`<button type="button" class="link" data-a="msair">voltar a ${esc(c.nome)}</button>`}`}
  </div>
  ${resp&&!M.fim?`<p class="note" style="margin:0;text-align:center">Se sentir tontura, volte a respirar normalmente.</p>`:""}`;
  if(M.rodando) mTick(true);
}
function mTick(forcar){
  if(!M) return; const e=mElapsed(), {L,total}=M;
  if(e>=total){ return mConcluir(true); }
  let i=L.findIndex(x=>e>=x.ini && e<x.ini+x.s); if(i<0) i=L.length-1;
  const x=L[i], resto=x.ini+x.s-e, el=id=>document.getElementById(id);
  if(i!==M.idx || forcar){
    const novo=i!==M.idx; M.idx=i;
    if(M.m.tipo==="resp"){
      const cc=el("mCirc"); if(cc){ const alvo=x.f==="in"?1:(x.f==="out"||x.f==="prep")?.55:null;
        if(alvo!=null){ cc.style.transitionDuration=(forcar&&!novo?Math.max(.1,resto):x.s)+"s"; cc.style.transform=`scale(${alvo})`; } }
      const fz=el("mFase"); if(fz) fz.textContent=x.t; const tx=el("mTexto"); if(tx) tx.textContent=x.f==="prep"?(M.m.intro||""):(x.c?`Ciclo ${x.c} de ${M.m.ciclos}`:"");
    } else { const tx=el("mTexto"); if(tx) tx.textContent=x.t; }
    if(novo){ if(M.voz) falar(x.fala); else if(M.m.tipo==="resp" && x.f!=="prep") tomSuave(); }
  }
  const ct=el("mConta"); if(ct) ct.textContent=M.m.tipo==="resp"&&x.f!=="prep"?Math.ceil(resto):"";
  const pb=el("mProg"); if(pb) pb.style.width=Math.min(100,e/total*100)+"%";
  const tp=el("mTempo"); if(tp) tp.textContent=mmss(total-e)+" restantes";
}
function mPlay(){
  if(!M) return;
  if(M.rodando){ M.acum=mElapsed(); M.rodando=false; clearInterval(M.int); try{ speechSynthesis.cancel(); }catch(e){} return render(); }
  M.rodando=true; M.t0=Date.now(); if(!M.inicio) M.inicio=Date.now(); M.idx=-1; somPronto(); manterTelaAcesa();
  render(); clearInterval(M.int); M.int=setInterval(()=>mTick(false),250); mTick(false);
}
function mConcluir(completo){
  if(!M || M.fim) return; M.acum=Math.min(mElapsed(), M.total); M.rodando=false; M.fim=true; clearInterval(M.int);
  if(wakeLock){ try{ wakeLock.release(); }catch(e){} wakeLock=null; }
  if(M.m.tipo==="resp"){ if(M.voz) falar(M.m.fim||""); else tomSuave(); } else if(!M.voz) tomSuave();
  render(); if(completo) mSalvar();
}
function mSalvar(){
  if(!M || M.salvo || M.acum<30) { if(M && M.acum<30){ M.salvo=false; } return render(); }
  const d=livreDia(M.key)||{}; M.salvo=true;
  FILA.push({client_id:uid(), data:HOJE(), dia_id:null, dia:d.nome||M.s.nome, tipo:"Mente", cat:M.c.id, cs:M.s.id, inicio:M.inicio?new Date(M.inicio).toISOString():null,
             dur:Math.max(1,Math.round(M.acum/60)), rpe:0, pront:null, cv:false, series:[], cardio:[], hyrox:[]});
  store.set("hagtreino.fila",FILA); render(); enviarFila().then(()=>{ renderEvo(); });
}
function mSair(){ const cid=M&&M.c?M.c.id:null; if(M){ clearInterval(M.int); try{ speechSynthesis.cancel(); }catch(e){} } M=null; S=novoEstado(); catAberto=cid; render(); abrir("livre"); window.scrollTo(0,0); }

/* ---------- carga inicial ---------- */
function carregar(){
  if(!TOKEN){ render(); return Promise.resolve(); }
  return rpc("hag_treino_contexto",{p_token:TOKEN}).then(r=>{
    CTX=r; if(r && r.ok){ store.set("hagtreino.ctx",r); if(window.hagInstalar && S.fase==="inicio") window.hagInstalar.mostrar(); }
    if(r && r.ok && r.paciente) document.getElementById("titulo").textContent="Treino de "+r.paciente.nome;
    if(VITRINE){ document.getElementById("titulo").textContent="Catálogo HAG Treino"; if(r && r.ok && !carregar._vit){ carregar._vit=1; setTimeout(()=>abrir("livre"),0); } }   /* HAG_TREINO_VITRINE_v1 */
    if(S.fase==="inicio" && !S.diaEscolhido) S.diaId=null;
    render(); renderEvo(); renderProg(); renderLivre();
  }).catch(()=>{ if(CTX && CTX.ok){ render(); renderEvo(); renderProg(); renderLivre(); } else vHoje.innerHTML=`<div class="card"><h3>Sem conexão</h3><p class="sub">Não consegui carregar o seu treino agora. Verifique o sinal e toque em tentar de novo.</p><button type="button" class="btn small ghost" data-a="recarregar" style="margin-top:10px">Tentar de novo</button></div>`; });
}
const tabs=[...document.querySelectorAll("nav.tabs button")];
function abrir(v){ tabs.forEach(t=>t.setAttribute("aria-selected",String(t.dataset.v===v))); vHoje.hidden=v!=="hoje"; vEvo.hidden=v!=="evo"; vProg.hidden=v!=="prog"; vLivre.hidden=v!=="livre"; elTimer.style.display=v==="hoje"?"":"none"; if(v==="evo") renderEvo(); if(v==="prog") renderProg(); if(v==="livre") renderLivre(); }
tabs.forEach(t=>t.addEventListener("click",()=>abrir(t.dataset.v)));
window.addEventListener("online",enviarFila);
let rz; window.addEventListener("resize",()=>{ clearTimeout(rz); rz=setTimeout(renderEvo,200); });
/* sessão interrompida no mesmo dia (tela fechada sem querer) volta de onde parou */
const rasc=store.get("hagtreino.rascunho",null);
if(rasc && rasc.dia===HOJE() && rasc.S && rasc.S.fase==="treino"){ S=Object.assign(novoEstado(),rasc.S); }
if(CTX && CTX.ok){ if(CTX.paciente) document.getElementById("titulo").textContent="Treino de "+CTX.paciente.nome; render(); renderLivre(); }
enviarFila().then(sent=>{ if(!sent) carregar(); });
})();
</script>
