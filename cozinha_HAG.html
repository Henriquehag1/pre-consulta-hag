<head>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Cozinha · Método HAG</title>
<!-- HAG_COZINHA_COLECAO_v1 (02/10/2026)
     Coleção de receitas e guias do Método HAG. Página pública, SEM dado de paciente e SEM login.
     Lê só o que o médico aprovou, por duas funções: hag_cozinha_colecao (índice) e hag_cozinha_item (ficha).
     Item "só paciente" exige o link pessoal (?t=TOKEN); sem ele, aparece trancado e a ficha não é entregue.
     Números: soma de gramas pela TACO 4ª ed. e pelo USDA SR Legacy, feita fora daqui. Sem IA, sem custo por uso.
     HAG_COZINHA_PARA_VOCE_v1 (08/10/2026): com o link pessoal, a coleção traz "para_voce", a seleção que o Dr. Henrique
     aprovou na consulta (receitas e guias, cada um com o porquê em uma linha). Aparece no topo de Receitas, só sem busca
     e com "Todas". Só id e motivo vêm do banco; nada de nome ou dado do paciente.
     HAG_COZINHA_SO_LIBERADO_v1 (09/10/2026). Pedido dele: "liberar conforme eu aceito que libere, não que fique tudo
     exposto, porque assim os pacientes não valorizam". Agora o paciente vê SÓ o que o Dr. Henrique liberou para ele
     (cozinha_selecao ativa), e sem o link pessoal a página não mostra conteúdo nenhum, só a apresentação. A trava está no
     banco (hag_cozinha_colecao e hag_cozinha_item), não aqui: esta página só mostra o que vier. Tudo numa aba, "Para você",
     na ordem dele, com o porquê de cada item; receitas e guias juntos. Cache novo (col2) para não exibir a coleção
     inteira guardada no aparelho por versão anterior.
     HAG_COZINHA_NOTURNO_v1 (16/10/2026): telas novas aprovadas pelo Dr. Henrique. Visual do HAG Treino (escuro e claro),
     início com filtro, ficha curta com versões em abas, modo cozinhar (Separe, passo a passo com timer, tela acesa) e
     "Fiz esta receita", que grava em cozinha_eventos (hag_cozinha_evento, HAG_COZINHA_FIZ_v1) para o painel. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<script>/* HAG_COZINHA_NOTURNO_v1: aplica o tema escolhido antes de desenhar, sem piscar */try{if(localStorage.getItem("hagcozinha.tema")==="claro")document.documentElement.dataset.tema="claro"}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* HAG_COZINHA_NOTURNO_v1 (16/10/2026): visual do HAG Treino (Noturno), escuro por padrão e claro no botão sol e lua.
   Telas aprovadas pelo Dr. Henrique no canvas "HAG Cozinha · telas novas". */
:root{
  --bg:#0A0E17; --surface:#131A28; --tile:#1E2738; --ink:#F1F2F5; --ink2:#A9B1C2; --muted:#8A93A7; --line:#252F44;
  --gold:#E3B964; --btn:#E3B964; --onbtn:#1A1405; --good:#5DD39E; --goodbg:rgba(93,211,158,.14);
  --rest:#F0B35A; --restbg:rgba(240,179,90,.12); --sombra:0 1px 3px rgba(0,0,0,.25); --veu:rgba(10,14,23,.72);
  --disp:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Manrope","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
:root[data-tema="claro"]{
  --bg:#F3F4F6; --surface:#FFFFFF; --tile:#E3E6EC; --ink:#0E1320; --ink2:#465063; --muted:#5B6578; --line:#D9DDE5;
  --gold:#8A6516; --good:#1D8657; --goodbg:rgba(29,134,87,.12); --rest:#9A5D08; --restbg:rgba(154,93,8,.10);
  --sombra:0 1px 2px rgba(14,19,32,.08); color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;margin:0;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
p{margin:0}
.wrap,.top .in{max-width:560px;margin:0 auto}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 6px}
.top .in{display:flex;justify-content:space-between;align-items:center}
.marca{font-family:var(--disp);font-weight:700;font-size:22px;letter-spacing:.16em}
.marca span{color:var(--gold)}
.redondo{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;padding:0;color:var(--ink)}
.wrap{padding:6px 16px 24px;display:flex;flex-direction:column;gap:14px}
.kick{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
h1.tit{margin:2px 0 0;font-family:var(--disp);font-weight:700;font-size:40px;line-height:1;text-transform:uppercase}
.sub{margin-top:4px;font-size:13px;color:var(--muted)}
h2{font-family:var(--disp);font-weight:700;font-size:30px;line-height:1.05;text-transform:uppercase;margin:0}
.muted{color:var(--muted)} .small{font-size:13.5px}
.estado{border:1px dashed var(--line);border-radius:14px;padding:18px 16px;background:var(--surface);color:var(--ink2)}
.aviso{font-size:14px;color:var(--ink2);background:var(--restbg);border-radius:12px;padding:10px 12px}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:700;white-space:nowrap;color:var(--ink)}
.chip i{font-style:normal;opacity:.7;font-weight:600;margin-left:4px}
.chip[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:var(--onbtn)}
.busca input{width:100%;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px;font-size:16px}

/* lista do início */
.linhas{display:flex;flex-direction:column}
.linha{display:grid;grid-template-columns:72px minmax(0,1fr) 18px;gap:14px;align-items:center;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.linha.sem-foto{grid-template-columns:minmax(0,1fr) 18px}
.th{width:72px;height:72px;border-radius:12px;overflow:hidden;background:var(--tile);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;letter-spacing:.14em;color:var(--gold)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.linha .nm{display:block;font-weight:700;font-size:16px;line-height:1.25}
.linha .mt{display:block;margin-top:3px;font-size:13px;color:var(--muted)}
.linha .mt b{color:var(--ink2);font-weight:700}
.linha .pq{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:3px;font-size:13px;color:var(--ink2)}
.linha .sv{color:var(--gold);margin-left:8px;display:inline-flex;vertical-align:-2px}
.seta{color:var(--muted)}
.orib{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.orib b{display:block;font-size:15px}
.orib span{display:block;font-size:13px;color:var(--ink2)}
.rodape{font-size:13px;color:var(--muted);text-align:center;padding-top:6px}
.rodape button{background:none;border:0;padding:6px;color:var(--gold);font-weight:700;font-size:13px}

/* ficha */
.heroi{position:relative;margin:0 -16px;height:240px;background:var(--tile);overflow:hidden}
.heroi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.heroi .vazio{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:28px;letter-spacing:.2em;color:var(--gold)}
.heroi .bt{position:absolute;top:12px;width:44px;height:44px;border-radius:50%;border:0;background:var(--veu);color:#F1F2F5;display:flex;align-items:center;justify-content:center;padding:0}
.heroi .bt.v{left:14px} .heroi .bt.s{right:14px;color:#E3B964}
.heroi .ilus{position:absolute;right:12px;bottom:8px;font-size:10px;letter-spacing:.1em;color:rgba(255,255,255,.8);text-shadow:0 1px 2px rgba(0,0,0,.6)}
.voltar{align-self:flex-start;height:40px;padding:0 12px 0 6px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:4px;font-weight:700;font-size:14px}
.ficha{display:flex;flex-direction:column;gap:14px}
.ficha h1{margin:0;font-family:var(--disp);font-weight:700;font-size:32px;line-height:1;text-transform:uppercase}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills span{padding:6px 10px;border-radius:999px;background:var(--tile);font-size:12.5px;font-weight:700}
.pills .g{color:var(--good)}
.abas{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--tile);overflow-x:auto;scrollbar-width:none}
.abas::-webkit-scrollbar{display:none}
.abas button{flex:1 0 auto;min-height:40px;padding:0 12px;border-radius:9px;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:14px;white-space:nowrap}
.abas button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--sombra)}
.ideia{font-size:13.5px;color:var(--ink2);margin-top:-6px}
.cabsec{display:flex;justify-content:space-between;align-items:center;gap:8px}
.passador{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.passador b{color:var(--ink);font-size:15px;min-width:14px;text-align:center}
.passador button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:18px;padding:0;line-height:1}
ul.ing{list-style:none;margin:0;padding:0}
ul.ing li{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
ul.ing li b{font-weight:800;font-variant-numeric:tabular-nums}
ul.ing li .m{color:var(--muted)}
ul.ing li.novo .nome::after{content:" · nesta versão";color:var(--gold);font-size:12.5px;font-weight:700}
.dest{font-size:12.5px;color:var(--muted)}
.dest b{color:var(--good);font-weight:700}
details.caixa{border:1px solid var(--line);border-radius:14px;background:var(--surface)}
details.caixa summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:14.5px}
details.caixa summary::-webkit-details-marker{display:none}
details.caixa summary::after{content:"+";font-size:20px;color:var(--gold);font-weight:700}
details.caixa[open] summary::after{content:"\2212"}
ol.prep{margin:0;padding:0 14px 12px 34px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.dica{margin:0 14px 14px;padding:10px 12px;border-radius:12px;background:var(--tile);font-size:14px;color:var(--ink2)}
.dica b{color:var(--ink)}
.bula table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.bula td{padding:5px 14px;border-top:1px solid var(--line);vertical-align:middle}
.bula td.v{text-align:right;white-space:nowrap}
.bula td.vd{width:32%}
.bula tr.grp td{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);background:var(--tile)}
.barra{height:6px;border-radius:3px;background:var(--tile);position:relative;overflow:hidden}
.barra i{position:absolute;inset:0 auto 0 0;background:var(--good);border-radius:3px;max-width:100%}
.vdn{font-size:11px;color:var(--muted)}
.src{font-size:10px;color:var(--muted);margin-left:4px}
.crunote{font-size:10px;color:var(--rest);margin-left:4px}
.bula .nota{padding:8px 14px 12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.guardar{font-size:14px;color:var(--ink2)}
.guardar b{color:var(--ink)}
.bsec{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14.5px;width:100%}
.pe{font-size:12px;color:var(--muted)}
.barrinha{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.barrinha .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px}
.barrinha .lst{height:56px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;padding:0;color:var(--ink)}
.barrinha .lst[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.grande{height:56px;border-radius:14px;border:0;background:var(--btn);color:var(--onbtn);display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--disp);font-weight:700;font-size:23px;letter-spacing:.08em;width:100%}

/* guias */
.gbloco{border-left:3px solid var(--line);padding-left:12px;display:flex;flex-direction:column;gap:6px}
.gbloco h3{margin:0;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.gbloco.b0{border-color:var(--good)} .gbloco.b2{border-color:var(--rest)} .gbloco.b3{border-color:var(--ink2)}
.gbloco ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.pratico .gbloco{border-color:var(--gold)}
.gicon{width:72px;height:72px;border-radius:12px;background:var(--tile);display:flex;align-items:center;justify-content:center;color:var(--gold)}

/* lista de compras */
.sel{display:flex;flex-direction:column}
.sel .l{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.sel .x{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;padding:0}
.secao{display:flex;flex-direction:column}
.secao label{display:grid;grid-template-columns:26px 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.secao label input{width:20px;height:20px;accent-color:var(--good);margin:0}
.secao label.ok span{text-decoration:line-through;color:var(--muted)}
.secao .q{font-size:13.5px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.bloco{display:flex;flex-direction:column;gap:8px}
.acao{height:52px;border-radius:14px;border:0;background:var(--btn);color:var(--onbtn);font-weight:800;font-size:15px;width:100%}
.sobre{display:flex;flex-direction:column;gap:14px;font-size:15px}
.sobre ul{margin:0;padding-left:20px}
.sobre li{margin-bottom:6px}

/* navegação de baixo */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(10px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
nav.tabs button,nav.tabs a{height:54px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);position:relative}
nav.tabs [aria-selected="true"]{color:var(--gold);font-weight:800}
nav.tabs .n{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--btn);color:var(--onbtn);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}
nav.tabs .n[hidden]{display:none}

/* modo cozinhar */
#coz{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;display:flex;flex-direction:column}
#coz[hidden]{display:none}
.cz{flex:1;display:flex;flex-direction:column;max-width:560px;width:100%;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px))}
.cz-top{display:flex;align-items:center;gap:10px}
.cz-x{width:44px;height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;color:var(--ink)}
.prog{flex:1;display:flex;gap:4px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--tile)}
.prog i.on{background:var(--btn)}
.cz-tag{font-size:12.5px;font-weight:800;letter-spacing:.06em;color:var(--ink2);white-space:nowrap}
.acesa{height:32px;padding:0 10px;border-radius:999px;background:var(--tile);display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--good);white-space:nowrap}
.cz h1{margin:4px 0 0;font-family:var(--disp);font-weight:700;font-size:54px;line-height:.9;text-transform:uppercase}
.cz .cab{padding-top:22px}
.itens{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.it{min-height:64px;padding:10px 14px;border-radius:14px;display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.it .cx{width:30px;height:30px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:2px solid var(--muted);color:var(--bg)}
.it.ok{border-color:var(--good);opacity:.78}
.it.ok .cx{border-color:var(--good);background:var(--good)}
.it .t1{display:block;font-size:16px;font-weight:700}
.it.ok .t1{text-decoration:line-through}
.it .t2{display:block;font-size:13px;color:var(--muted)}
.cz .mais{font-size:13px;color:var(--muted);margin-top:4px}
.cz .fim{margin-top:auto;padding-top:16px}
.cz .duo{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px}
.cz .duo .bsec{height:60px;border-radius:14px}
.cz .grande{height:60px;font-size:24px}
.passo-txt{margin:8px 0 0;font-size:26px;line-height:1.28;font-weight:700}
.timer{margin-top:22px;padding:16px 18px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.timer .tt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.timer .tt span{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--rest)}
.timer .tt button{height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink2);font-weight:700;font-size:12.5px}
.relogio{font-family:var(--disp);font-weight:700;font-size:104px;line-height:.95;text-align:center;color:var(--rest);font-variant-numeric:tabular-nums}
.timer .bar{height:8px;border-radius:4px;background:var(--tile);overflow:hidden}
.timer .bar i{display:block;height:8px;background:var(--rest);width:0}
.timer .bts{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.timer .bts button{height:52px;border-radius:12px;font-weight:800;font-size:15px;border:1px solid var(--line);background:transparent}
.timer .bts .go{border:0;background:var(--rest);color:#1A1405}
.timer.fim{border-color:var(--good)}
.timer.fim .relogio,.timer.fim .tt span{color:var(--good)}
.cz .nota{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--tile);font-size:14px;line-height:1.4;color:var(--ink2)}
.cz .nota b{color:var(--ink)}
.feito{width:84px;height:84px;border-radius:50%;background:var(--goodbg);color:var(--good);display:flex;align-items:center;justify-content:center;margin:34px auto 0}
.cz .centro{text-align:center}
.notas{margin-top:10px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.notas button,.ajs button{border-radius:12px;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.notas button{height:52px}
.ajs{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
.ajs button{height:40px;padding:0 14px}
.notas button[aria-pressed="true"],.ajs button[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:var(--onbtn)}
.salvar{margin-top:20px;height:56px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:12px;padding:0 16px;font-weight:700;font-size:15px;width:100%;color:var(--ink)}

  var r=FICHAS[st.rec]&&FICHAS[st.rec].dados; if(!r) return '';
  var na=st.lista.some(function(x){return x.id===r.id&&x.vari===st.vari});
  return '<div class="in"><button class="lst" id="add" aria-pressed="'+na+'" aria-label="'+(na?'Tirar da lista de compras':'Pôr na lista de compras')+'">'+IC.lista+'</button>'+
    '<button class="grande" id="cozinhar">COZINHAR '+IC.vai+'</button></div>';
}

function render(){
  if(window.hagInstalar) window.hagInstalar.vis(st.tab==='rec'&&!st.rec&&!st.guia&&!st.coz);
  var nav=$('#nav'), barra=$('#barra');
  var semNav=st.semLink||st.linkInvalido||!COL;
  nav.hidden=semNav||!!st.rec||!!st.coz;
  barra.hidden=!st.rec||!!st.coz||!FICHAS[st.rec];
  if(!nav.hidden) nav.innerHTML=navHTML();
  if(!barra.hidden) barra.innerHTML=barraHTML();
  document.body.style.paddingBottom=(nav.hidden&&barra.hidden)?'24px':'';
  if(st.semLink||st.linkInvalido){ telaPorta(); return; }
  if(!COL){ app.innerHTML='<div class="estado">'+esc(st.erro||(st.vazia&&!st.carregandoIndice?'A coleção está sendo preparada. Volte em breve.':'Carregando…'))+'</div>'+(st.erro?'<button class="acao" id="tentar">Tentar de novo</button>':''); return; }
  if(st.tab==='lista') telaLista(); else if(st.tab==='sobre') telaSobre();
  else if(st.guia) telaGuia(); else if(st.rec) telaFicha(); else telaInicio(st.tab==='guias'?'guia':'receita');
}
async function abrir(id){
  var it=IDX[id]; if(!it) return;
  if(it.trancado){ toast('Conteúdo para pacientes. Peça o seu link à equipe do consultório.'); return; }
  st.voltaTab=st.tab==='guias'?'guias':'rec';
  if(it.tipo==='guia'){ st.tab='guias'; st.guia=id; st.rec=null; } else { st.tab='rec'; st.rec=id; st.guia=null; st.vari=-1; }
  st.carregando=id; render(); window.scrollTo(0,0);
  try{ history.replaceState(null,'',location.pathname+location.search+'#'+id); }catch(e){}
  try{ var F=await ficha(id); if(it.tipo==='receita'&&st.rec===id) st.porc=F.dados.rende; evento('abriu',id); }catch(e){ if(e.message==='nao_liberado'||e.message==='so_paciente'){ st.rec=null; st.guia=null; toast('Este conteúdo não está liberado para você.'); } }
  st.carregando=null; render();
}
function fechar(){ var vt=st.guia?'guias':(st.voltaTab||'rec'); st.rec=null; st.guia=null; st.tab=vt; try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} render(); }

/* ===== modo cozinhar ===== */
var wake=null;
async function telaAcesa(){ try{ if('wakeLock' in navigator){ wake=await navigator.wakeLock.request('screen'); wake.addEventListener('release',function(){ wake=null; if(st.coz) pintaAcesa(); }); } }catch(e){ wake=null; } if(st.coz) pintaAcesa(); }
function soltaTela(){ if(wake){ try{ wake.release(); }catch(e){} wake=null; } }
function pintaAcesa(){ var p=$('#acesa'); if(p) p.hidden=!wake; }
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible'&&st.coz&&!wake) telaAcesa(); if(document.visibilityState==='visible'&&st.coz&&st.coz.tm) tique(); });

// Tempo escrito no passo: "2 minutos de cada lado", "20 a 25 min", "40 segundos". Usa o primeiro número (o menor da faixa).
function tempoDoPasso(t){
  var m=String(t).toLowerCase().match(/(\d+(?:[.,]\d+)?)(?:\s*(?:a|-|ou)\s*\d+(?:[.,]\d+)?)?\s*(minutos|minuto|min|segundos|segundo|seg|horas|hora|h)\b/);
  if(!m) return null;
  var n=parseFloat(m[1].replace(',','.')), u=m[2], s=/^seg/.test(u)?n:/^h/.test(u)?n*3600:n*60;
  if(!s||s<10||s>3*3600) return null;
  return {seg:Math.round(s),lados:/cada lado|de cada|vire|virar/.test(String(t).toLowerCase())?2:1};
}
function abrirCoz(){
  var F=FICHAS[st.rec]; if(!F) return;
  st.coz={id:st.rec,fase:'separe',i:0,marc:{},nota:null,aj:{},tm:null};
  coz.hidden=false; document.body.style.overflow='hidden';
  telaAcesa(); evento('cozinhar',st.rec,{versao:st.vari<0?'Base':vnome(versao(F.dados,st.vari)),porcoes:st.porc});
  renderCoz(); render();
}
function abrirFiz(){ if(!FICHAS[st.rec]) return; st.coz={id:st.rec,fase:'fiz',i:0,marc:{},nota:null,aj:{},tm:null,direto:true}; coz.hidden=false; document.body.style.overflow='hidden'; renderCoz(); render(); }
function fecharCoz(){ pararTimer(); soltaTela(); st.coz=null; coz.hidden=true; coz.innerHTML=''; document.body.style.overflow=''; render(); }
function progHTML(on,tot){ var h=''; for(var k=0;k<tot;k++) h+='<i class="'+(k<=on?'on':'')+'"></i>'; return '<div class="prog">'+h+'</div>'; }
function renderCoz(){
  var c=st.coz; if(!c) return;
  var r=FICHAS[c.id].dados, v=versao(r,st.vari), f=st.porc/r.rende, P=r.preparo, tot=P.length+1;
  var nomeV=r.nome+(st.vari>=0?' · '+vnome(v):'');
  var h='<div class="cz">';
  if(c.fase==='separe'){
    var ing=ingDe(r,st.vari), feitos=ing.filter(function(x,k){return c.marc[k]}).length;
    h+='<div class="cz-top"><button class="cz-x" data-cz="sair" aria-label="Sair do modo cozinhar">'+IC.x+'</button>'+progHTML(0,tot)+
      '<span class="acesa" id="acesa"'+(wake?'':' hidden')+'>'+IC.cel+'Tela acesa</span></div>';
    h+='<div class="cab"><div class="kick">'+esc(nomeV)+'</div><h1>Separe</h1><div class="sub" style="font-size:15px;color:var(--ink2)">'+feitos+' de '+ing.length+' · toque para riscar'+(st.porc!==r.rende?' · '+st.porc+(st.porc>1?' porções':' porção'):'')+'</div></div>';
    h+='<div class="itens">'+ing.map(function(x,k){ var ok=!!c.marc[k];
      return '<button class="it'+(ok?' ok':'')+'" data-cz="marca" data-k="'+k+'" aria-pressed="'+ok+'"><span class="cx">'+(ok?IC.ok:'')+'</span><span><span class="t1">'+esc(x.nome)+'</span><span class="t2">'+(f===1&&x.med?esc(x.med)+' · ':'')+gr(x.g*f)+'</span></span></button>'; }).join('')+'</div>';
    if(r.tempero&&r.tempero.length) h+='<p class="mais">Também: '+esc(r.tempero.join(', '))+'.</p>';
    h+='<div class="fim"><button class="grande" data-cz="ir" data-i="0">COMEÇAR '+IC.vai+'</button></div>';
  } else if(c.fase==='passo'){
    var t=P[c.i], tm=tempoDoPasso(t), ult=c.i===P.length-1;
    h+='<div class="cz-top"><button class="cz-x" data-cz="sair" aria-label="Sair do modo cozinhar">'+IC.x+'</button>'+progHTML(c.i+1,tot)+
      '<span class="cz-tag">PASSO '+(c.i+1)+' DE '+P.length+'</span></div>';
    h+='<div class="cab"><div class="kick">'+esc(nomeV)+'</div><p class="passo-txt">'+esc(t)+'</p></div>';
    if(tm){
      if(!c.tm||c.tm.passo!==c.i) c.tm={passo:c.i,total:tm.seg,resta:tm.seg,lados:tm.lados,lado:1,fim:null};
      h+='<div class="timer" id="timer"><div class="tt"><span id="tmrot"></span>'+(tm.lados>1?'<button data-cz="virei">Virei</button>':'')+'</div>'+
        '<div class="relogio" id="relogio" aria-live="off"></div><div class="bar"><i id="tmbar"></i></div>'+
        '<div class="bts"><button data-cz="zerar">Zerar</button><button class="go" data-cz="play" id="tmplay"></button></div></div>';
    } else { pararTimer(); c.tm=null; }
    if(c.i===0&&st.vari>=0&&v.ideia) h+='<div class="nota"><b>Nesta versão:</b> '+esc(v.ideia)+'</div>';
    if(ult&&r.truque) h+='<div class="nota"><b>Dica:</b> '+esc(r.truque)+'</div>';
    h+='<div class="fim duo"><button class="bsec" data-cz="ir" data-i="'+(c.i-1)+'">Voltar</button>'+
      (ult?'<button class="grande" data-cz="pronto">PRONTO '+IC.ok+'</button>':'<button class="grande" data-cz="ir" data-i="'+(c.i+1)+'">PRÓXIMO '+IC.vai+'</button>')+'</div>';
  } else {
    var sv=!!st.salvas[c.id];
    h+='<div class="centro"><div class="feito">'+IC.ok.replace(/width="20" height="20"/,'width="40" height="40"')+'</div>'+
      '<h1 style="margin-top:18px;font-size:52px">Pronto</h1><div class="sub" style="font-size:15px;color:var(--ink2)">'+esc(nomeV)+' · '+st.porc+(st.porc>1?' porções':' porção')+'</div></div>';
    h+='<div style="margin-top:30px"><div class="kick">Como ficou?</div><div class="notas">'+
      [['gostei','Gostei'],['ajustaria','Ajustaria'],['nao','Não deu certo']].map(function(n){ return '<button data-cz="nota" data-v="'+n[0]+'" aria-pressed="'+(c.nota===n[0])+'">'+n[1]+'</button>'; }).join('')+'</div>';
    if(c.nota&&c.nota!=='gostei') h+='<div class="ajs">'+['Menos doce','Mais sal','Menos sal','Ficou seco','Porção pequena','Demorou'].map(function(a){ return '<button data-cz="aj" data-v="'+a+'" aria-pressed="'+!!c.aj[a]+'">'+a+'</button>'; }).join('')+'</div>';
    h+='</div><button class="salvar" data-cz="salvar" aria-pressed="'+sv+'"><span style="color:var(--gold);display:flex">'+coracao(sv,22)+'</span>'+(sv?'Nas suas salvas':'Salvar para repetir')+'</button>';
    h+='<div class="fim"><p class="small muted" style="text-align:center;margin-bottom:12px">Fica registrado para o Dr. Henrique ver na consulta.</p>'+
      '<button class="grande" data-cz="fiz">FIZ ESTA RECEITA</button><button class="agoranao" data-cz="sair">Agora não</button></div>';
  }
  h+='</div>';
  coz.innerHTML=h; coz.scrollTop=0;
  if(c.fase==='passo'&&c.tm) pintaTimer();
}
/* timer: conta pelo relógio (sobrevive à tela apagada), avisa com som e vibração */
var tickId=null, actx=null;
function agora(){ return Date.now(); }
function restaTimer(t){ return t.fim?Math.max(0,Math.round((t.fim-agora())/1000)):t.resta; }
function pintaTimer(){
  var t=st.coz&&st.coz.tm; if(!t) return;
  var s=restaTimer(t), mm=Math.floor(s/60), ss=s%60, el=$('#relogio'); if(!el) return;
  el.textContent=(t.total>=3600?Math.floor(mm/60)+':'+String(mm%60).padStart(2,'0'):mm)+':'+String(ss).padStart(2,'0');
  $('#tmbar').style.width=Math.round((t.total-s)/t.total*100)+'%';
  $('#tmrot').textContent='TIMER'+(t.lados>1?' · LADO '+t.lado+' DE '+t.lados:'');
  $('#tmplay').textContent=t.fim?'Pausar':(s===0?'De novo':(s<t.total?'Continuar':'Iniciar'));
  $('#timer').classList.toggle('fim',s===0);
}
function tique(){
  var t=st.coz&&st.coz.tm; if(!t||!t.fim){ pararTimer(); return; }
  if(restaTimer(t)<=0){ t.resta=0; t.fim=null; pararTimer(); alarme(); }
  pintaTimer();
}
function pararTimer(){ if(tickId){ clearInterval(tickId); tickId=null; } }
function iniciarTimer(){ var t=st.coz.tm; if(t.resta<=0) t.resta=t.total; t.fim=agora()+t.resta*1000; pararTimer(); tickId=setInterval(tique,250); pintaTimer(); somPronto(); }
function pausarTimer(){ var t=st.coz.tm; t.resta=restaTimer(t); t.fim=null; pararTimer(); pintaTimer(); }
function somPronto(){ try{ if(!actx){ var A=window.AudioContext||window.webkitAudioContext; if(A) actx=new A(); } if(actx&&actx.state==='suspended') actx.resume(); }catch(e){} }
function alarme(){
  try{ if(navigator.vibrate) navigator.vibrate([300,150,300,150,300]); }catch(e){}
  try{ if(!actx) return; var t0=actx.currentTime; [0,.35,.7].forEach(function(d){ var o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=880; o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(.0001,t0+d); g.gain.exponentialRampToValueAtTime(.3,t0+d+.02); g.gain.exponentialRampToValueAtTime(.0001,t0+d+.28); o.start(t0+d); o.stop(t0+d+.3); }); }catch(e){}
}
coz.addEventListener('click',function(e){
  var b=e.target.closest('[data-cz]'); if(!b||!st.coz) return; var c=st.coz, a=b.dataset.cz;
  if(a==='sair'){ fecharCoz(); return; }
  if(a==='marca'){ c.marc[b.dataset.k]=!c.marc[b.dataset.k]; renderCoz(); return; }
  if(a==='ir'){ var i=+b.dataset.i; if(i<0){ c.fase='separe'; } else { c.fase='passo'; c.i=i; } renderCoz(); return; }
  if(a==='pronto'){ pararTimer(); c.fase='fiz'; renderCoz(); return; }
  if(a==='play'){ if(c.tm.fim) pausarTimer(); else iniciarTimer(); return; }
  if(a==='zerar'){ pararTimer(); c.tm.fim=null; c.tm.resta=c.tm.total; pintaTimer(); return; }
  if(a==='virei'){ pararTimer(); c.tm.lado=c.tm.lado>=c.tm.lados?1:c.tm.lado+1; c.tm.resta=c.tm.total; c.tm.fim=null; iniciarTimer(); return; }
  if(a==='nota'){ c.nota=b.dataset.v; if(c.nota==='gostei') c.aj={}; renderCoz(); return; }
  if(a==='aj'){ c.aj[b.dataset.v]=!c.aj[b.dataset.v]; renderCoz(); return; }
  if(a==='salvar'){ if(st.salvas[c.id]) delete st.salvas[c.id]; else st.salvas[c.id]=1; salvarSalvas(); renderCoz(); return; }
  if(a==='fiz'){
    var r=FICHAS[c.id].dados, aj=Object.keys(c.aj).filter(function(k){return c.aj[k]});
    evento('fiz',c.id,{nota:c.nota,ajustes:aj,versao:st.vari<0?'Base':vnome(versao(r,st.vari)),porcoes:st.porc});
    var feitas=ls.get('hagcozinha.feitas')||{}; feitas[c.id]=(feitas[c.id]||0)+1; ls.set('hagcozinha.feitas',feitas);
    fecharCoz(); fechar(); toast('Registrado. Bom apetite!'); return;
  }
});
// deslizar entre os passos
(function(){ var x0=null,y0=null;
  coz.addEventListener('touchstart',function(e){ if(!st.coz||st.coz.fase!=='passo') return; x0=e.touches[0].clientX; y0=e.touches[0].clientY; },{passive:true});
  coz.addEventListener('touchend',function(e){ if(x0==null||!st.coz||st.coz.fase!=='passo') return; var dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0; x0=null;
    if(Math.abs(dx)<60||Math.abs(dy)>Math.abs(dx)) return; var c=st.coz, P=FICHAS[c.id].dados.preparo;
    if(dx<0&&c.i<P.length-1){ c.i++; renderCoz(); } else if(dx>0){ if(c.i>0){ c.i--; } else { c.fase='separe'; } renderCoz(); } },{passive:true});
})();

$('#nav').addEventListener('click',function(e){ var b=e.target.closest('button[data-t]'); if(!b) return; st.rec=null; st.guia=null; st.tab=b.dataset.t; st.q=''; try{ history.replaceState(null,'',location.pathname+location.search); }catch(er){} render(); window.scrollTo(0,0); });
$('#barra').addEventListener('click',function(e){ var t=e.target.closest('button'); if(!t) return;
  if(t.id==='cozinhar'){ abrirCoz(); return; }
  if(t.id==='add'){ var r=FICHAS[st.rec].dados, v=versao(r,st.vari), i=-1; st.lista.forEach(function(x,k){ if(x.id===r.id&&x.vari===st.vari) i=k; });
    if(i>=0){ st.lista.splice(i,1); toast('Tirada da lista'); } else { st.lista.push({id:r.id,vari:st.vari,porc:st.porc,rende:r.rende,nome:r.nome,vnome:st.vari>=0?v.nome:'',ing:ingDe(r,st.vari).map(function(x){return {k:x.k,nome:x.nome,g:x.g,sec:x.sec}})}); toast('Na lista de compras'); }
    salvar(); render(); }
});
app.addEventListener('click',function(e){
  var t=e.target.closest('button'); if(!t) return;
  if(t.id==='tentar'){ st.erro=null; render(); carregar(); return; }
  if(t.dataset.filtro){ st.filtro=t.dataset.filtro; render(); return; }
  if(t.dataset.abrir){ abrir(t.dataset.abrir); return; }
  if(t.id==='voltar'){ fechar(); return; }
  if(t.id==='numeros'){ st.tab='sobre'; render(); window.scrollTo(0,0); return; }
  if(t.id==='voltarSobre'){ st.tab='rec'; render(); window.scrollTo(0,0); return; }
  if(t.id==='salva'){ var id=st.rec; if(st.salvas[id]){ delete st.salvas[id]; toast('Tirada das salvas'); } else { st.salvas[id]=1; toast('Nas suas salvas'); } salvarSalvas(); render(); return; }
  if(t.id==='jafiz'){ abrirFiz(); return; }
  if(t.dataset.vari!=null){ st.vari=+t.dataset.vari; render(); return; }
  if(t.id==='mais'){ st.porc=Math.min(24,st.porc+1); render(); return; }
  if(t.id==='menos'){ st.porc=Math.max(1,st.porc-1); render(); return; }
  if(t.id==='pdf'){ document.querySelectorAll('details.caixa').forEach(function(d){ d.open=true; }); window.print(); return; }
  if(t.dataset.del!=null){ st.lista.splice(+t.dataset.del,1); salvar(); render(); return; }
  if(t.dataset.pm!=null){ var it=st.lista[+t.dataset.pm]; it.porc=Math.max(1,Math.min(24,it.porc+(+t.dataset.d))); salvar(); render(); return; }
  if(t.id==='limpar'){ st.lista=[]; st.feitos={}; salvar(); render(); return; }
  if(t.id==='copiar'){ var tx=textoLista(), falha=function(){ var ta=document.createElement('textarea'); ta.value=tx; ta.style.cssText='width:100%;height:160px'; t.before(ta); ta.select(); toast('Selecione e copie o texto'); };
    try{ navigator.clipboard.writeText(tx).then(function(){toast('Lista copiada')},falha); }catch(er){ falha(); } return; }
});
app.addEventListener('change',function(e){ var t=e.target; if(t.dataset&&t.dataset.ck){ if(t.checked) st.feitos[t.dataset.ck]=true; else delete st.feitos[t.dataset.ck]; salvar(); t.closest('label').classList.toggle('ok',t.checked); } });
var tb=null;
app.addEventListener('input',function(e){ if(e.target.id!=='busca') return; st.q=e.target.value; clearTimeout(tb); tb=setTimeout(function(){ var pos=e.target.selectionStart; render(); var b=$('#busca'); if(b){ b.focus(); try{b.setSelectionRange(pos,pos)}catch(er){} } },180); });
window.addEventListener('beforeprint',function(){ document.querySelectorAll('details.caixa').forEach(function(d){ d.open=true; }); });
window.addEventListener('online',enviarPendentes);
window.hagCozinha={st:st,tempoDoPasso:tempoDoPasso};
carregar();
})();
</script>
