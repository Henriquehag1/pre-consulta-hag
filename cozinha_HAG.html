<!-- HAG_COZINHA_COLECAO_v1 (02/10/2026)
     Coleção de receitas e guias do Método HAG. Página pública, SEM dado de paciente e SEM login.
     Lê só o que o médico aprovou, por duas funções: hag_cozinha_colecao (índice) e hag_cozinha_item (ficha).
     Item "só paciente" exige o link pessoal (?t=TOKEN); sem ele, aparece trancado e a ficha não é entregue.
     Números: soma de gramas pela TACO 4ª ed. e pelo USDA SR Legacy, feita fora daqui. Sem IA, sem custo por uso.
     HAG_COZINHA_PARA_VOCE_v1 (08/10/2026): com o link pessoal, a coleção traz "para_voce", a seleção que o Dr. Henrique
     aprovou na consulta (receitas e guias, cada um com o porquê em uma linha). Aparece no topo de Receitas, só sem busca
     e com "Todas". Só id e motivo vêm do banco; nada de nome ou dado do paciente.
     HAG_COZINHA_SO_LIBERADO_v1 (09/10/2026). Pedido dele: "liberar conforme eu aceito que libere, não que fique tudo
     exposto, porque assim os pacientes não valorizam". Agora o paciente vê SÓ o que o Dr. Henrique liberou para ele
     (cozinha_selecao ativa), e sem o link pessoal a página não mostra conteúdo nenhum, só a apresentação. A trava está no
     banco (hag_cozinha_colecao e hag_cozinha_item), não aqui: esta página só mostra o que vier. Tudo numa aba, "Para você",
     na ordem dele, com o porquê de cada item; receitas e guias juntos. Cache novo (col2) para não exibir a coleção
     inteira guardada no aparelho por versão anterior. -->

<style>

}

<script>
(function(){
"use strict";
var SURL='https://yutcnphwovqeiwcwzzhs.supabase.co', SKEY='sb_publishable_V-tdeq_qDKLAPYzN2vQuMA_okwPaOPi';
var $=function(s){return document.querySelector(s)}, app=$('#app');
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};

var ls={get:function(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* link pessoal: ?t=TOKEN fica guardado neste aparelho */
var qs=new URLSearchParams(location.search), TOKEN=qs.get('t')||ls.get('hagcozinha.col.token')||null;
if(qs.get('t')) ls.set('hagcozinha.col.token',qs.get('t'));
// HAG_COZINHA_SO_LIBERADO_v1: a versão anterior guardava a coleção inteira no aparelho. Apaga esse cache antigo.
try{ Object.keys(localStorage).forEach(function(k){ if(k==='hagcozinha.col.indice'||k.indexOf('hagcozinha.col.f.')===0) localStorage.removeItem(k); }); }catch(e){}
var CK='hagcozinha.col2.'+String(TOKEN||'').slice(0,12)+'.';

var COL=null, IDX={}, FICHAS={};
var st={tab:'rec',sit:'todas',q:'',rec:null,guia:null,vari:-1,porc:1,lista:[],feitos:{},erro:null,carregando:null};
(function(){var s=ls.get('hagcozinha.col.lista'); if(s&&Array.isArray(s.lista)){st.lista=s.lista; st.feitos=s.feitos||{};}})();

async function rpc(nome,args){
  var r=await fetch(SURL+'/rest/v1/rpc/'+nome,{method:'POST',headers:{'apikey':SKEY,'Authorization':'Bearer '+SKEY,'Content-Type':'application/json'},body:JSON.stringify(args)});
  if(!r.ok) throw new Error('erro '+r.status);
  return r.json();
}
// Coleção sem nada aprovado chega com meta nula: nesse caso não há o que montar, e a página avisa em vez de quebrar.
// HAG_COZINHA_SO_LIBERADO_v1: só existe coleção para quem tem link válido; sem item liberado, a página diz isso.
function aplicar(c){ if(!c||!c.paciente||!c.meta||!Array.isArray(c.itens)){ COL=null; IDX={}; st.vazia=true; return false; } st.vazia=!c.itens.length; COL=c; IDX={}; c.itens.forEach(function(i){IDX[i.id]=i}); return true; }
async function carregar(){
  if(!TOKEN){ st.semLink=true; render(); return; }
  var cache=ls.get(CK+'indice');
  if(cache&&cache.itens&&cache.meta){ try{ if(aplicar(cache)) render(); }catch(e){ COL=null; } }
  var pf=carregarFotos(); st.carregandoIndice=true;
  try{
    var c=await rpc('hag_cozinha_colecao',{p_token:TOKEN});

async function abrir(id){
  var it=IDX[id]; if(!it) return;
  if(it.trancado){ toast('Conteúdo para pacientes. Peça o seu link à equipe do consultório.'); return; }
  st.tab='rec'; if(it.tipo==='guia'){ st.guia=id; st.rec=null; } else { st.rec=id; st.guia=null; st.vari=-1; }
  st.carregando=id; render(); window.scrollTo(0,0);
  try{ history.replaceState(null,'',location.pathname+location.search+'#'+id); }catch(e){}
  try{ var F=await ficha(id); if(it.tipo==='receita'&&st.rec===id) st.porc=F.dados.rende; }catch(e){ if(e.message==='nao_liberado'||e.message==='so_paciente'){ st.rec=null; st.guia=null; toast('Este conteúdo não está liberado para você.'); } }
  st.carregando=null; render();
}

app.addEventListener('click',function(e){

  if(t.id==='mais'){ st.porc=Math.min(24,st.porc+1); render(); return; }
  if(t.id==='menos'){ st.porc=Math.max(1,st.porc-1); render(); return; }
  if(t.id==='pdf'){ var d=document.querySelector('details.bula'); if(d) d.open=true; window.print(); return; }
  if(t.id==='add'){ var r=FICHAS[st.rec].dados, v=versao(r,st.vari), i=-1; st.lista.forEach(function(x,k){ if(x.id===r.id&&x.vari===st.vari) i=k; });
    if(i>=0){ st.lista.splice(i,1); toast('Tirada da lista'); } else { st.lista.push({id:r.id,vari:st.vari,porc:st.porc,rende:r.rende,nome:r.nome,vnome:st.vari>=0?v.nome:'',ing:(st.vari<0?r.ing:v.ing).map(function(x){return {k:x.k,nome:x.nome,g:x.g,sec:x.sec}})}); toast('Na lista de compras'); }
    salvar(); render(); return; }
  if(t.dataset.del!=null){ st.lista.splice(+t.dataset.del,1); salvar(); render(); return; }
  if(t.dataset.pm!=null){ var it=st.lista[+t.dataset.pm]; it.porc=Math.max(1,Math.min(24,it.porc+(+t.dataset.d))); salvar(); render(); return; }
  if(t.id==='limpar'){ st.lista=[]; st.feitos={}; salvar(); render(); return; }
  if(t.id==='copiar'){ var tx=textoLista(), falha=function(){ var ta=document.createElement('textarea'); ta.value=tx; ta.style.cssText='width:100%;height:160px'; t.before(ta); ta.select(); toast('Selecione e copie o texto'); };
    try{ navigator.clipboard.writeText(tx).then(function(){toast('Lista copiada')},falha); }catch(er){ falha(); } return; }
});
app.addEventListener('change',function(e){ var t=e.target; if(t.dataset&&t.dataset.ck){ if(t.checked) st.feitos[t.dataset.ck]=true; else delete st.feitos[t.dataset.ck]; salvar(); t.closest('label').classList.toggle('ok',t.checked); } });
var tb=null;
app.addEventListener('input',function(e){ if(e.target.id!=='busca') return; st.q=e.target.value; clearTimeout(tb); tb=setTimeout(function(){ var pos=e.target.selectionStart; render(); var b=$('#busca'); if(b){ b.focus(); try{b.setSelectionRange(pos,pos)}catch(er){} } },180); });
window.addEventListener('beforeprint',function(){ var d=document.querySelector('details.bula'); if(d) d.open=true; });
carregar();
})();
</script>
</body>
</html>
