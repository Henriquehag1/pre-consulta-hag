<!-- HAG_COZINHA_v1 (01/10/2026)
     App do paciente. Entra pelo link pessoal (?t=TOKEN), nunca por login: as duas únicas funções que
     respondem sem login são hag_cozinha_contexto e hag_cozinha_salvar, e só com o token.
     Lê o plano que o Dr. Henrique liberou (porções por refeição + tabela de porções) e devolve o que

<header class="top"><div class="in">
  <div class="brand">Método HAG</div>

  <nav class="tabs" role="tablist" id="tabs" hidden>

<main class="wrap" id="main"><div class="centro note">Carregando o seu plano…</div></main>
<script>
/* HAG_COZINHA_v1 · núcleo sem tela: leitor do Plano Alimentar, conta de porções, receita na medida, doce, resumo do médico.
   Função pura, testada fora da página. Nenhuma chamada de rede e nenhuma IA aqui. */
var HC=(function(){
"use strict";
const norm=s=>String(s==null?"":s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
const FR={"½":.5,"¼":.25,"¾":.75};
function num(v){ if(v==null) return 0; if(typeof v==="number") return isFinite(v)?v:0; v=String(v).trim();
  if(!v||/^[—–-]$/.test(v)||/livre|vontade/i.test(v)) return 0;
  const m=v.match(/^(\d+)?\s*([½¼¾])$/); if(m) return (+(m[1]||0))+FR[m[2]];
  const x=parseFloat(v.replace(",",".")); return isFinite(x)?x:0; }
const fmt=x=>{ x=Math.round(x*100)/100; return String(x).replace(".",","); };
const GR=["p","c","f","g"], SIG={p:"P",c:"C",f:"F",g:"G"}, NOME={p:"proteína",c:"carboidrato",f:"fruta",g:"gordura"}, NOMES={p:"proteínas",c:"carboidratos",f:"frutas",g:"gorduras"};
const codigo=r=>GR.filter(k=>num(r[k])>0).map(k=>fmt(num(r[k]))+SIG[k]).join(" ")+(r.v?" · vegetais livres":"");
const porcoes=(n,k)=>fmt(n)+" "+(n===1?"porção":"porções")+" de "+NOME[k];

/* ---------- leitor do texto do Plano Alimentar (pdftotext) ---------- */
const VAL=/^(—|–|-|livre|\d+(,\d+)?|\d*\s?[½¼¾])$/i;
const RODAPE=/·\s*PLANO ALIMENTAR\s*$|^MÉTODO HAG\s*·|TABELA DE PORÇÕES\s*·\s*\d|^\[RODAPE\]/i;
const REF_NOME=/^(caf[eé] da manh[aã]|almo[cç]o|lanche|jantar|ceia|ao acordar|antes de dormir|pr[eé][- ]treino|p[oó]s[- ]treino|desjejum|cola[cç][aã]o)/i;
function lerGrade(texto){
  const tk=texto.split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean);
  let i=tk.findIndex((t,k)=>/^REFEIÇÃO$/i.test(t)&&tk.slice(k+1,k+7).some(x=>/^P PROTEÍNA$/i.test(x)));
  if(i<0) return null;
  while(i<tk.length&&!/VEGETAIS$/i.test(tk[i])) i++;
  i++; const out=[]; let vazio=0;
  for(;i<tk.length&&vazio<14&&out.length<12;){
    const t=tk[i];
    if(/^Total do dia/i.test(t)) break;
    const vs=tk.slice(i+1,i+6);
    if(/[a-zà-ú]/i.test(t)&&!VAL.test(t)&&!/^livre$/i.test(t)&&vs.length===5&&vs.every(x=>VAL.test(x))){
      out.push({nome:t.replace(/\s+/g," "),p:num(vs[0]),c:num(vs[1]),f:num(vs[2]),g:num(vs[3]),v:/livre/i.test(vs[4])}); i+=6; vazio=0;
    } else { i++; vazio++; }
  }
  return out.length?out:null;
}
function lerCabecalhos(texto){
  const ls=texto.split(/\n/).map(s=>s.trim()).filter(Boolean), out=[], vistos={};
  for(let i=0;i<ls.length;i++){
    if(!REF_NOME.test(ls[i])||ls[i].length>40||/[.:]$/.test(ls[i])) continue;
    const r={nome:ls[i],p:0,c:0,f:0,g:0,v:false}; let achou=0;
    for(let j=i+1;j<Math.min(ls.length,i+10);j++){
      const l=ls[j]; if(/^OPÇÃO/i.test(l)||REF_NOME.test(l)) break;
      const m=l.match(/^(\d+(?:,\d+)?|\d*\s?[½¼¾])\s+(prote[ií]na|carboidrato|fruta|gordura)s?$/i);
      if(m){ r[{p:"p",c:"c",f:"f",g:"g"}[norm(m[2])[0]]]=num(m[1]); achou++; }
      else if(/^vegetais [àa] vontade$/i.test(l)) r.v=true;
      else if(/^\d{1,2}\s?H(\d{2})?(\s?[ÀA]S\s?\d{1,2}\s?H(\d{2})?)?/i.test(l)&&!r.hora) r.hora=l.split("·")[0].trim().toLowerCase();
    }
    if(achou&&!vistos[norm(r.nome)]){ vistos[norm(r.nome)]=1; out.push(r); }
  }
  return out.length?out:null;
}
function lerTabela(texto,casa){
  const ini=texto.search(/TROQUE DENTRO DO MESMO GRUPO/); if(ini<0) return null;
  let corpo=texto.slice(ini); const fim=corpo.search(/\n\s*DOCES,?\s*\n|NENHUM É PROIBIDO/); if(fim>0) corpo=corpo.slice(0,fim);
  const idx={}; (casa||[]).forEach(a=>{ idx[norm(a.nome)]=a.grupo; });
  const ls=corpo.split(/\n/).map(s=>s.trim()).filter(Boolean), tab=[], defs={}, HDR={PROTEINAS:"P",CARBOIDRATOS:"C",FRUTAS:"F",GORDURAS:"G"};
  let cur=null, prev=null;
  const ehNome=l=>l.length<60&&!/[.]$/.test(l)&&!/^[A-Z]$/.test(l)&&!RODAPE.test(l)&&!/^(ALIMENTO|QUANTIDADE|MEDIDA CASEIRA)$/i.test(l)&&!/1 por[cç][aã]o =/i.test(l);
  for(let i=0;i<ls.length;i++){
    const l=ls[i], h=l.match(/^(PROTEÍNAS|CARBOIDRATOS|FRUTAS|GORDURAS)\b/);
    if(h){ cur=HDR[norm(h[1]).toUpperCase()]; prev=null; }
    const d=l.match(/1 por[cç][aã]o = (\d+(?:,\d+)?) g de (prote[ií]na|carboidrato|gordura)/i);
    if(d&&cur){ defs[cur.toLowerCase()]=num(d[1]); continue; }
    if(h) continue;
    const g=l.match(/^(\d+(?:,\d+)?)\s?g(?![a-zà-ú])\s*(.*)$/i)||l.match(/^(\d+(?:,\d+)?) g([a-zà-ú].*)$/i), rot=l.match(/^ver rótulo\s*(.*)$/i);
    if((g||rot)&&prev&&!/[.]$/.test(l)&&!(g&&/^,/.test(g[2]))){
      let med=(g?g[2]:rot[1]).trim();
      if(!med&&ls[i+1]&&!/^(\d+(?:,\d+)?)\s?g\b/i.test(ls[i+1])&&!/^(PROTEÍNAS|CARBOIDRATOS|FRUTAS|GORDURAS)\b/.test(ls[i+1])&&!RODAPE.test(ls[i+1])){ med=ls[i+1]; i++; }
      const k=idx[norm(prev)], grupo=k&&k!=="X"?k:cur;
      if(grupo) tab.push({g:grupo,nome:prev,gramas:g?num(g[1]):null,medida:med,duvida:!k});
      prev=null; continue;
    }
    if(ehNome(l)) prev=l;
  }
  const notas=corpo.split(/\n\s*\n/).map(b=>b.replace(/\s*\n\s*/g," ").trim()).filter(b=>b.length>60&&/^(Feijão|Vegetais|Uma concha|Alface|Cenoura)/.test(b));
  if(notas.some(n=>/110 g[^.]*meia\s+porção de proteína e meia de\s+carboidrato/i.test(n))&&!/não gosta do grão/i.test(notas.join(" ")))
    tab.push({g:"X",nome:"Feijão cozido",gramas:110,medida:"1 concha média",vale:{p:.5,c:.5}});
  return tab.length?{tabela:tab,defs,notas}:null;
}
function lerPlano(texto,casa){
  const avisos=[]; texto=String(texto||"");
  let refs=lerGrade(texto);
  if(!refs){ refs=lerCabecalhos(texto); if(refs) avisos.push("Este plano não tem a grade de porções. As refeições foram lidas dos cabeçalhos: confira uma a uma."); }
  if(!refs){ refs=[]; avisos.push("Não encontrei as refeições em porções neste documento. Preencha a grade à mão."); }
  const t=lerTabela(texto,casa);
  if(!t) avisos.push("Não encontrei a tabela de porções neste documento. Use a tabela da casa e ajuste.");
  else { const d=t.tabela.filter(x=>x.duvida).length; if(d) avisos.push(d+(d===1?" alimento não está":" alimentos não estão")+" na tabela da casa: confira o grupo (marcados em amarelo)."); }
  const defs=Object.assign({p:10,c:15,f:15,g:8},t?t.defs:{});
  return {refeicoes:refs,tabela:t?t.tabela:[],defs,notas:t?t.notas:[],avisos};
}

/* ---------- conta de porções ---------- */
function slotDe(nome){ const n=norm(nome); if(/cafe|desjejum|acordar/.test(n)) return "cafe"; if(/almoco/.test(n)) return "almoco"; if(/jantar/.test(n)) return "jantar"; if(/ceia|dormir/.test(n)) return "ceia"; return "lanche"; }
/* meta da refeição hoje = plano menos o que um doce já descontou */
function metaHoje(plano,idx,eventos){ const r=plano.refeicoes[idx], m={p:num(r.p),c:num(r.c),f:num(r.f),g:num(r.g),v:!!r.v};
  ajustesDoces(eventos).forEach(a=>{ if(a.idx===idx){ m.c=Math.max(0,m.c-a.c); m.g=Math.max(0,m.g-a.g); } }); return m; }
function ajustesDoces(eventos){ const desf={}, out=[]; (eventos||[]).forEach(e=>{ if(e.tipo==="doce_desfeito") desf[e.chave]=1; });
  (eventos||[]).forEach(e=>{ if(e.tipo==="doce"&&!desf[e.cid]&&e.detalhe) (e.detalhe.ajustes||[]).forEach(a=>out.push({idx:a.idx,c:num(a.c),g:num(a.g),doce:e.chave})); }); return out; }
const docesHoje=ev=>{ const desf={}; (ev||[]).forEach(e=>{ if(e.tipo==="doce_desfeito") desf[e.chave]=1; }); return (ev||[]).filter(e=>e.tipo==="doce"&&!desf[e.cid]); };
function gramas(item,por){ return item&&item.gramas!=null?Math.round(num(item.gramas)*por):null; }
function acharAlimento(tabela,nome,grupo){ const n=norm(nome); let a=tabela.find(x=>norm(x.nome)===n);
  if(!a&&/whey|proteina em po/.test(n)) a=tabela.find(x=>x.g==="P"&&/whey|proteina em po/.test(norm(x.nome)));
  return a||null; }
/* prato montado: escolhas = [{nome, por}] ; devolve o que falta por grupo */
function contaPrato(meta,tabela,escolhas){ const tem={p:0,c:0,f:0,g:0};
  (escolhas||[]).forEach(e=>{ const a=acharAlimento(tabela,e.nome); if(!a) return;
    if(a.g==="X"){ const v=a.vale||{}; GR.forEach(k=>{ tem[k]+=num(v[k])*e.por; }); } else tem[a.g.toLowerCase()]+=e.por; });
  const falta={}, sobra={}; let fechado=true, algum=false;
  GR.forEach(k=>{ const d=Math.round((meta[k]-tem[k])*100)/100; if(d>0.01){ falta[k]=d; fechado=false; } else if(d<-0.01) sobra[k]=-d; if(tem[k]>0) algum=true; });
  return {tem,falta,sobra,fechado,algum}; }
/* receita na medida da refeição: cada grupo da receita é escalado para as porções que a refeição pede */
function receitaPara(rec,meta,tabela,regras,naoGosta){
  regras=regras||{}; const mn=regras.escala_min||.5, mx=regras.escala_max||2, soma={p:0,c:0,f:0,g:0}, ng=(naoGosta||[]).map(norm);
  const ing=(rec.ing||[]).map(i=>({alimento:i.alimento,k:String(i.grupo||"").toLowerCase(),por:num(i.por),item:acharAlimento(tabela,i.alimento)}));
  const semItem=ing.find(i=>!i.item); if(semItem) return {serve:"fora",motivo:"usa "+semItem.alimento.toLowerCase()+", que não está na sua tabela"};
  const ruim=ing.find(i=>ng.includes(norm(i.item.nome))); if(ruim) return {serve:"fora",motivo:"usa "+ruim.item.nome.toLowerCase()+", que você marcou como fora"};
  ing.forEach(i=>{ soma[i.k]+=i.por; });
  if(!soma.p||!meta.p) return {serve:"nao",motivo:meta.p?"a receita não tem proteína":"esta refeição não tem proteína no plano"};
  const linhas=[], avisos=[], fator={};
  for(const k of GR){ if(!soma[k]) continue;
    if(!meta[k]){ avisos.push("faça sem "+ing.filter(i=>i.k===k).map(i=>i.item.nome.toLowerCase()).join(" e ")+": esta refeição não tem "+NOME[k]); fator[k]=0; continue; }
    fator[k]=meta[k]/soma[k];
    if(fator[k]<mn-1e-9||fator[k]>mx+1e-9) return {serve:"nao",motivo:"a receita não fecha na medida desta refeição ("+NOME[k]+")"}; }
  ing.forEach(i=>{ if(!fator[i.k]) return; const por=Math.round(i.por*fator[i.k]*100)/100; linhas.push({nome:i.item.nome,k:i.k,por,gramas:gramas(i.item,por),medida:i.item.medida,rotulo:i.item.gramas==null}); });
  GR.forEach(k=>{ if(meta[k]>0&&!soma[k]) avisos.push((k==="f"?"a fruta":"o "+NOME[k])+" da refeição fica à parte: "+porcoes(meta[k],k)); });
  return {serve:avisos.length?"ajuste":"ok",linhas,avisos};
}
/* doce: de onde sai o C e o G. Tira das refeições ainda não feitas, da última para a primeira. */
function encaixarDoce(doce,plano,eventos,feitas){
  let c=num(doce.c), g=num(doce.g); const aj=[];

    ${filaHTML()}
    <div class="row">${sos.length?`<button class="btn ghost" data-a="sos" aria-expanded="${S.sos}">Não consigo seguir o plano agora</button>`:""}${p.doces&&CTX.doces.length?`<button class="btn ghost" data-a="doces" aria-expanded="${S.doces}">Quero um doce hoje</button>`:""}</div>
    ${S.sos?`<div class="drawer" style="margin-top:0"><div class="lbl">O que está acontecendo?</div><div class="chips">${sos.map(g=>`<button class="chip" data-a="sosop" data-v="${esc(g.chave)}" aria-pressed="${S.sosMsg===g.chave}">${esc(g.titulo)}</button>`).join("")}</div>${(()=>{ const g=sos.find(x=>x.chave===S.sosMsg); if(!g) return ""; const d=(g.c||{}).destino||"";
       return `<p style="margin:0">${esc((g.c||{}).texto||"")}</p>${d==="fora"?`<button class="btn small" data-a="ir" data-v="fora">Ver as saídas fora de casa</button>`:d.indexOf("receitas")===0&&CTX.receitas.length?`<button class="btn small" data-a="irrec" data-v="${esc(d.split(":")[1]||"")}">Ver receitas</button>`:d==="doces"&&p.doces&&CTX.doces.length?`<button class="btn small" data-a="doces">Escolher um doce</button>`:""}`; })()}</div>`:""}
    ${S.doces&&p.doces&&CTX.doces.length?docesHTML(regs,evs).replace('class="drawer"','class="drawer" style="margin-top:0"'):""}
    ${p.refeicoes.map((r,i)=>refHTML(r,i,regs,evs)).join("")}
    <p class="note" style="margin:0">O Plano Alimentar que o Dr. Henrique entregou é a referência, com as opções prontas de cada refeição. Aqui você executa o dia.</p>`;
}
function proxima(){ const regs=regsHoje(), i=P().refeicoes.findIndex((x,k)=>!regs[k]); return i<0?0:i; }
function renderRec(){
  const p=P(), regs=regsHoje(), evs=eventosHoje(); if(S.recIdx==null||S.recIdx>=p.refeicoes.length) S.recIdx=proxima();
  const i=S.recIdx, r=p.refeicoes[i], m=HC.metaHoje(p,i,evs), slot=HC.slotDe(r.nome), ng=naoGosta();
  if(S.recAberta){ const rc=CTX.receitas.find(x=>x.id===S.recAberta), f=HC.receitaPara(rc,m,tabela(),CTX.regras,ng);
    main.innerHTML=`<button class="link" data-a="voltarrec" style="align-self:flex-start">‹ todas as receitas</button>
     <div class="prato"><div class="lbl">${rc.tempo?rc.tempo+" min · ":""}${rc.tags.map(esc).join(" · ")}</div><h2 style="margin-top:2px">${esc(rc.nome)}</h2><p class="sub">${esc(rc.porque||"")}</p></div>
     <div class="card"><div class="kicker">Na medida do seu ${esc(r.nome.toLowerCase())}</div>
       ${f.linhas?`<div style="margin-top:6px">${f.linhas.map(l=>`<div class="linha"><div><b>${esc(l.nome)}</b><div class="note">${fmt(l.por)} ${l.por===1?"porção":"porções"} de ${NOME[l.k]}</div></div><span class="mono"><b>${l.rotulo?"medida do rótulo: "+fmt(l.por*num((p.defs||{}).p||10))+" g":l.gramas+" g"}</b></span></div>`).join("")}
         ${(rc.livres||[]).map(x=>`<div class="linha"><div>${esc(x)}</div><span class="note">livre</span></div>`).join("")}</div>
         ${(f.avisos||[]).map(a=>`<div class="aviso" style="margin-top:8px">Ajuste: ${esc(a)}.</div>`).join("")}
         ${regs[i]?`<p class="note" style="margin:10px 0 0">Esta refeição já está marcada hoje.</p>`:`<button class="btn" data-a="comirec" style="margin-top:12px">✓ Comi esta receita no ${esc(r.nome.toLowerCase())}</button>`}`
       :`<p style="margin:6px 0 0">Não serve para esta refeição: ${esc(f.motivo)}.</p>`}</div>
     <div class="card"><h3>Preparo</h3><ol class="passos">${(rc.preparo||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>
     ${rc.cons?`<div class="card"><h3>Guardar</h3><p style="margin:6px 0 0">${esc(rc.cons)}</p></div>`:""}`; return; }
  const tags=[]; CTX.receitas.forEach(x=>x.tags.forEach(t=>{ if(!tags.includes(t)) tags.push(t); }));
  const lista=CTX.receitas.map(rc=>({rc,f:HC.receitaPara(rc,m,tabela(),CTX.regras,ng),doSlot:rc.slots.includes(slot)})).filter(x=>x.f.serve!=="fora"&&(!S.recTag||x.rc.tags.includes(S.recTag)))
    .sort((a,b)=>(b.doSlot-a.doSlot)||("ok ajuste nao".indexOf(a.f.serve)-"ok ajuste nao".indexOf(b.f.serve)));
  main.innerHTML=`<div><div class="kicker">Receitas aprovadas pelo Dr. Henrique</div><h2>Receita na medida de qual refeição?</h2></div>
    <div class="chips">${p.refeicoes.map((x,k)=>`<button class="chip" data-a="recref" data-i="${k}" aria-pressed="${k===i}">${esc(x.nome)}</button>`).join("")}</div>
    <div class="chips">${pills(m)}</div>
    ${tags.length?`<div class="chips">${tags.map(t=>`<button class="chip" data-a="rectag" data-v="${esc(t)}" aria-pressed="${S.recTag===t}">${esc(t)}</button>`).join("")}</div>`:""}
    ${lista.length?lista.map(({rc,f,doSlot})=>`<div class="card"><div class="row between"><div class="lbl">${rc.tempo?rc.tempo+" min":""}${doSlot?"":" · de outra refeição"}</div><span class="tag ${f.serve==="ok"?"g":f.serve==="ajuste"?"y":"r"}">${f.serve==="ok"?"na sua medida":f.serve==="ajuste"?"com ajuste":"não fecha aqui"}</span></div>
       <h3 style="margin-top:4px">${esc(rc.nome)}</h3><div class="note">${esc(rc.porque||"")}</div>
       <button class="btn small${f.serve==="nao"?" ghost":""}" data-a="verrec" data-v="${esc(rc.id)}" style="margin-top:10px">Ver na minha medida</button></div>`).join("")
     :`<div class="card"><p class="note" style="margin:0">Nenhuma receita com esse filtro. O banco cresce a cada receita que o Dr. Henrique aprova.</p></div>`}`;
}
function renderFora(){
  const gs=CTX.guias.filter(g=>g.tipo==="fora");
  main.innerHTML=`<div><div class="kicker">Vida real</div><h2>Vou comer fora. O que eu peço?</h2><p class="sub">Três saídas por tipo de lugar. Depois, marque a refeição em Hoje como "comi fora".</p></div>
    ${gs.length?gs.map(g=>`<div class="card"><h3>${esc(g.titulo)}</h3><div class="esc"><div class="m"><b>Melhor escolha.</b> ${esc(g.c.melhor||"")}</div><div class="b"><b>Boa escolha.</b> ${esc(g.c.boa||"")}</div><div class="p"><b>Possível com ajuste.</b> ${esc(g.c.ajuste||"")}</div></div></div>`).join("")
     :`<div class="card"><p class="note" style="margin:0">O guia de comer fora ainda não foi liberado.</p></div>`}`;
}
function renderTab(){
  const p=P(), ng=naoGosta().map(HC.norm), d=p.defs||{}, U={P:"proteína",C:"carboidrato",F:"carboidrato",G:"gordura"}, T={P:"Proteínas",C:"Carboidratos",F:"Frutas",G:"Gorduras",X:"Contam em dois grupos"};
  main.innerHTML=`<div><div class="kicker">A sua tabela de porções</div><h2>Troque dentro do mesmo grupo</h2><p class="sub">Cada linha vale 1 porção. Precisa de 2? Use o dobro. Toque em um alimento que você não come para tirá-lo das sugestões.</p></div>
    ${["P","C","F","G","X"].filter(K=>tabela().some(a=>a.g===K)).map(K=>`<div class="card"><div class="kicker">${T[K]}${K!=="X"&&d[K.toLowerCase()]?` · 1 porção = ${fmt(num(d[K.toLowerCase()]))} g de ${U[K]}`:""}</div>
      ${tabela().filter(a=>a.g===K).map(a=>{ const f=ng.includes(HC.norm(a.nome)); return `<button class="linha" data-a="pref" data-n="${esc(a.nome)}" aria-pressed="${f}" style="width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left;cursor:pointer"><div class="${f?"fora":""}"><b>${esc(a.nome)}</b><div class="note">${esc(a.medida||"")}</div></div><span class="mono">${f?"fora":a.gramas==null?"rótulo":fmt(num(a.gramas))+" g"}</span></button>`; }).join("")}</div>`).join("")}
    ${(p.notas||[]).length?`<div class="card">${p.notas.map(n=>`<p style="margin:0 0 8px">${esc(n)}</p>`).join("")}</div>`:""}`;
}
function render(){
  document.getElementById("titulo").textContent=CTX&&CTX.paciente?"HAG Cozinha · "+CTX.paciente.nome:"HAG Cozinha";
  if(!TOKEN||S.erro==="link_invalido"){ tabs.hidden=true; main.innerHTML=`<div class="card centro"><h2>Link não reconhecido</h2><p class="sub">Abra o HAG Cozinha pelo link pessoal que o consultório enviou. Se ele parou de funcionar, peça um novo pelo WhatsApp do consultório.</p></div>`; return; }
  if(!CTX){ tabs.hidden=true; main.innerHTML=`<div class="card centro"><p class="sub">${S.erro==="rede"?"Sem conexão agora. Abra de novo quando tiver sinal.":"Carregando o seu plano…"}</p>${S.erro?`<button class="btn" data-a="recarregar">Tentar de novo</button>`:""}</div>`; return; }
  if(!P()){ tabs.hidden=true; main.innerHTML=`<div class="card centro"><h2>Seu plano ainda não chegou aqui</h2><p class="sub">O Dr. Henrique libera o plano no HAG Cozinha depois da consulta. Enquanto isso, siga o Plano Alimentar que você recebeu.</p><button class="btn ghost" data-a="recarregar">Atualizar</button></div>`; return; }
  tabs.hidden=false; tabs.querySelectorAll("button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.v===S.aba)));
  ({hoje:renderHoje,rec:renderRec,fora:renderFora,tab:renderTab})[S.aba]();
}
function ir(v){ S.aba=v; S.recAberta=null; render(); window.scrollTo(0,0); }
tabs.addEventListener("click",e=>{ const b=e.target.closest("button"); if(b) ir(b.dataset.v); });
main.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]"); if(!b||b.disabled) return; const a=b.dataset.a, i=+b.dataset.i, v=b.dataset.v, nm=b.dataset.n;
  if(a==="recarregar"||a==="reenviar"){ enviarFila().then(ok=>{ if(!ok) carregar(); }); return; }
  if(a==="plano"){ S.menu=null; return salvarRef(i,{como:"plano",detalhe:null,faltou:null}); }
  if(a==="fora"||a==="pulei"){ S.menu=null; return salvarRef(i,{como:a,detalhe:null,faltou:null,sac:null,doce:null}); }
  if(a==="desfazer") return salvarRef(i,{como:"desfeito",detalhe:null,faltou:null,sac:null,doce:null});
  if(a==="menu"){ S.menu=i; return render(); }
  if(a==="sac") return salvarRef(i,{sac:v});
  if(a==="doce") return salvarRef(i,{doce:v});
  if(a==="montar"){ S.montar=S.montar&&S.montar.idx===i?null:{idx:i,esc:[]}; return render(); }
  if(a==="fecharmontar"){ S.montar=null; return render(); }
  if(a==="mais"||a==="menos"){ const M=S.montar, al=HC.acharAlimento(tabela(),nm), m=HC.metaHoje(P(),M.idx,eventosHoje()); let e=M.esc.find(x=>x.nome===nm);
    if(a==="mais"){ const ct=HC.contaPrato(m,tabela(),M.esc), falta=al.g==="X"?1:(ct.falta[al.g.toLowerCase()]||0), passo=al.g==="X"?1:Math.min(1,falta); if(passo<=0) return;
      if(e) e.por=Math.round((e.por+passo)*100)/100; else M.esc.push({nome:nm,por:passo}); }
    else if(e){ e.por=Math.round((e.por-(e.por%1||1))*100)/100; if(e.por<=0) M.esc=M.esc.filter(x=>x!==e); }
    return render(); }
  if(a==="comimontado"){ const M=S.montar, m=HC.metaHoje(P(),i,eventosHoje()), ct=HC.contaPrato(m,tabela(),M.esc); S.montar=null;
    return salvarRef(i,{como:"montei",detalhe:{itens:M.esc.map(x=>({nome:x.nome,por:x.por}))},faltou:ct.fechado?null:ct.falta}); }
  if(a==="sos"){ S.sos=!S.sos; S.sosMsg=null; return render(); }
  if(a==="sosop"){ S.sosMsg=v; enfileirar({tipo:"evento",client_id:uid(),data:HOJE(),evento:"sos",chave:v,detalhe:null}); return; }
  if(a==="ir") return ir(v);
  if(a==="irrec"){ S.recTag=CTX.receitas.some(r=>r.tags.includes(v))?v:null; S.recIdx=proxima(); return ir("rec"); }
  if(a==="doces"){ S.doces=!S.doces||b.closest(".drawer")!=null; S.doceSel=null; if(b.closest(".drawer")) S.sos=false; return render(); }
  if(a==="fechardoces"){ S.doces=false; S.doceSel=null; return render(); }
  if(a==="docesel"){ S.doceSel=v; return render(); }
  if(a==="docecancela"){ S.doceSel=null; return render(); }
  if(a==="doceok"){ const d=CTX.doces.find(x=>x.nome===S.doceSel), feitas={}; Object.keys(regsHoje()).forEach(k=>feitas[k]=true); const r=HC.encaixarDoce(d,P(),eventosHoje(),feitas); S.doceSel=null;
    if(r.ok) enfileirar({tipo:"evento",client_id:uid(),data:HOJE(),evento:"doce",chave:d.nome,detalhe:{custo:{c:num(d.c),g:num(d.g)},ajustes:r.ajustes}}); else render(); return; }
  if(a==="docedesfaz") return enfileirar({tipo:"evento",client_id:uid(),data:HOJE(),evento:"doce_desfeito",chave:v,detalhe:null});
  if(a==="recde"){ S.recIdx=i; S.recTag=null; return ir("rec"); }
  if(a==="recref"){ S.recIdx=i; return render(); }
  if(a==="rectag"){ S.recTag=S.recTag===v?null:v; return render(); }
  if(a==="verrec"){ S.recAberta=v; render(); return window.scrollTo(0,0); }
  if(a==="voltarrec"){ S.recAberta=null; return render(); }
  if(a==="comirec"){ const rc=CTX.receitas.find(x=>x.id===S.recAberta), idx=S.recIdx, f=HC.receitaPara(rc,HC.metaHoje(P(),idx,eventosHoje()),tabela(),CTX.regras,naoGosta()); S.recAberta=null; S.aba="hoje";
    return salvarRef(idx,{como:"receita",detalhe:{receita:rc.nome,itens:(f.linhas||[]).map(l=>({nome:l.nome,por:l.por}))},faltou:null}); }
  if(a==="pref"){ let ng=naoGosta().slice(); const k=HC.norm(nm); if(ng.map(HC.norm).includes(k)) ng=ng.filter(x=>HC.norm(x)!==k); else ng.push(nm); return enfileirar({tipo:"pref",nao_gosta:ng}); }
});
window.addEventListener("online",()=>enviarFila());
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ enviarFila().then(ok=>{ if(!ok) carregar(); }); } });
render(); enviarFila().then(ok=>{ if(!ok) carregar(); });
})();
</script>
</body>
</html>
