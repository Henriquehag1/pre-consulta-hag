# HAG_OS_CI_v1 (28/10/2026): produz o check "Testes e integridade" que a protecao do main exige,
# para as paginas do HAG OS. O HAG RUN tem o seu proprio workflow no branch dele.
name: HAG OS CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hag-os-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Testes e integridade
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          package-manager-cache: false
      - name: Sintaxe das paginas e scripts
        run: node .github/scripts/check-paginas.mjs
      # HAG_COZINHA_TESTES_v1 (29/10/2026): bateria de navegador da Cozinha HAG, com banco simulado e receitas ficticias.
      - name: Instalar Playwright
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.0
          # HAG_CI_PLAYWRIGHT_RESILIENTE_v2 (11/11/2026): o apt do runner travou no PR #45 (espelho do
          # Ubuntu fora, 7 min por tentativa). Agora o apt tem no maximo 150 s e, se falhar, o teste segue
          # sem ele: o Chromium vem do CDN do Playwright e a imagem ja tem as bibliotecas do Chrome.
          timeout 150 npx playwright install-deps chromium || echo 'apt indisponivel agora: seguindo sem ele'
          npx playwright install chromium
      - name: Testes da Cozinha HAG
        run: node tests/cozinha/teste_cozinha.mjs
